<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>工作台 · 版权开放平台</title>
<script>
/* 工作台 = 当前阶段入口（常规工作台已下线）
   未认证 → 资质认证引导；已认证未签合同 → 合同签署引导；均已完成后 → 收益管理 */
(function () {
  function get(k) { try { return localStorage.getItem(k) || 'none'; } catch (e) { return 'none'; } }
  var cert = get('cp_cert');
  var contract = get('cp_contract');
  var target;
  if (cert !== 'done') target = 'workbench-cert.html';
  else if (contract !== 'done') target = 'workbench-contract.html';
  else target = 'earnings.html';
  location.replace(target);
})();
</script>
<style>
  html, body { height: 100%; margin: 0; background: #f6f7f9; }
  body { display: flex; align-items: center; justify-content: center; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 13px; color: #8a9199; }
</style>
</head>
<body>
<div>正在进入…</div>
</body>
</html>
