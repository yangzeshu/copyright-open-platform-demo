<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>收益明细 · 版权开放平台</title>
<style>/* ============================================================
   版权开放平台 · 公共样式 common.css
   品牌主色：粉红 #ff2e63，浅色背景，卡片式布局
   C 端与 B 端共享
   ============================================================ */

:root {
  --brand: #ff2e63;
  --brand-dark: #e0244f;
  --brand-light: #fff0f4;
  --brand-weak: rgba(255, 46, 99, 0.06);
  --brand-grad: linear-gradient(135deg, #ff5c8a 0%, #ff2e63 100%);

  --bg: #f7f8fa;
  --fill-1: #f7f8fa;
  --fill-2: #eef0f3;
  --card: #ffffff;
  --border: #eef0f3;
  --border-strong: #e2e5ea;

  --text: #1f2329;
  --text-2: #51565d;
  --text-3: #8a9199;
  --text-invert: #ffffff;

  --ok: #16b364;
  --warn: #f0a020;
  --danger: #e5484d;
  --info: #3b82f6;

  --radius-card: 12px;
  --radius-btn: 8px;
  --radius-input: 8px;
  --shadow-card: 0 2px 12px rgba(20, 24, 30, 0.06);
  --shadow-pop: 0 8px 30px rgba(20, 24, 30, 0.14);

  --sidebar-w: 220px;
  --topbar-h: 64px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei",
    "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  color: var(--text);
  background: var(--bg);
  font-size: 14px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}

a { color: inherit; text-decoration: none; }
ul, ol { list-style: none; }
button { font-family: inherit; cursor: pointer; border: none; background: none; }
input, select, textarea { font-family: inherit; font-size: 14px; }

/* ---------- 通用布局 ---------- */
.container { max-width: 1200px; margin: 0 auto; padding: 0 24px; }

/* ---------- 顶部栏 ---------- */
.topbar {
  position: sticky; top: 0; z-index: 100;
  background: #fff;
  height: var(--topbar-h);
  border-bottom: 1px solid var(--border);
}
.topbar-inner {
  max-width: 1440px; margin: 0 auto; padding: 0 24px;
  height: 100%; display: flex; align-items: center; justify-content: space-between;
}
.topbar-left { display: flex; align-items: center; gap: 12px; }
.topbar-logo {
  width: 30px; height: 30px; border-radius: 8px;
  background: var(--brand-grad);
  display: flex; align-items: center; justify-content: center;
  color: #fff; font-weight: 700; font-size: 16px;
}
.topbar-title { font-size: 15px; font-weight: 600; }
.topbar-divider { width: 1px; height: 16px; background: var(--border-strong); }
.topbar-sub { font-size: 13px; color: var(--text-3); }
.topbar-switch { display: inline-flex; align-items: center; height: 26px; padding: 0 12px; font-size: 13px; color: var(--brand); border: 1px solid var(--brand); border-radius: 4px; cursor: pointer; text-decoration: none; margin-left: 2px; }
.topbar-switch:hover { background: var(--brand); color: #fff; }

.topbar-right { display: flex; align-items: center; gap: 20px; }
.topbar-icon {
  width: 20px; height: 20px; color: var(--text-2);
  position: relative; display: flex; align-items: center;
}
.topbar-icon .dot {
  position: absolute; top: -2px; right: -2px;
  width: 7px; height: 7px; border-radius: 50%; background: var(--brand);
  border: 1.5px solid #fff;
}
.topbar-user { display: flex; align-items: center; gap: 8px; cursor: pointer; }
.topbar-avatar {
  width: 28px; height: 28px; border-radius: 50%;
  background: var(--brand-grad); color: #fff;
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; font-weight: 600;
}
.topbar-name { font-size: 14px; color: var(--text); }
.topbar-caret { width: 14px; height: 14px; color: var(--text-3); }

/* ---------- 主体框架：侧边菜单 + 内容 ---------- */
.layout {
  display: flex; min-height: calc(100vh - var(--topbar-h));
  max-width: 1440px; margin: 0 auto;
}
.sidebar {
  width: var(--sidebar-w); flex-shrink: 0;
  padding: 20px 12px;
}
.sidebar-item {
  display: flex; align-items: center; gap: 10px;
  padding: 11px 14px; margin-bottom: 4px;
  border-radius: 8px; color: var(--text-2);
  font-size: 14px; cursor: pointer;
  transition: background .15s, color .15s;
}
.sidebar-item:hover { background: var(--fill-2); color: var(--text); }
.sidebar-item.active {
  background: var(--brand-weak); color: var(--brand); font-weight: 600;
}
.sidebar-item svg { width: 18px; height: 18px; flex-shrink: 0; }
.sidebar-item .arrow { margin-left: auto; width: 14px; height: 14px; transition: transform .2s; }

/* 目录分组：子菜单默认收起，展开后箭头旋转 */
.sidebar-group .sidebar-sub { display: none; padding-left: 28px; }
.sidebar-group.open .sidebar-sub { display: block; }
.sidebar-group.open .arrow { transform: rotate(180deg); }
.sidebar-sub .sidebar-item { padding: 9px 14px; font-size: 13px; }

.content {
  flex: 1; min-width: 0;
  padding: 24px 32px 48px;
}

/* ---------- 页面标题 ---------- */
.page-head { margin-bottom: 20px; }
.page-title { font-size: 20px; font-weight: 700; }
.page-desc { font-size: 13px; color: var(--text-3); margin-top: 4px; }

/* ---------- 卡片 ---------- */
.card {
  background: var(--card); border-radius: var(--radius-card);
  box-shadow: var(--shadow-card);
  padding: 24px;
  margin-bottom: 20px;
}
.card-title { font-size: 16px; font-weight: 600; margin-bottom: 16px; }
.card + .card { margin-top: 0; }

/* ---------- 按钮 ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  padding: 9px 20px; border-radius: var(--radius-btn);
  font-size: 14px; font-weight: 500; line-height: 1;
  transition: all .15s; white-space: nowrap;
}
.btn-primary { background: var(--brand); color: #fff; }
.btn-primary:hover { background: var(--brand-dark); }
.btn-outline { border: 1px solid var(--border-strong); color: var(--text-2); background: #fff; }
.btn-outline:hover { border-color: var(--brand); color: var(--brand); }
.btn-text { color: var(--brand); padding: 9px 12px; }
.btn-text:hover { background: var(--brand-weak); }
.btn-danger { background: var(--danger); color: #fff; }
.btn-danger:hover { opacity: .9; }
.btn-plain { background: var(--fill-2); color: var(--text-2); }
.btn-plain:hover { background: var(--border-strong); }
.btn-ghost { color: var(--brand); }
.btn-block { width: 100%; }
.btn-lg { padding: 12px 28px; font-size: 15px; }
.btn-sm { padding: 6px 14px; font-size: 13px; }
.btn:disabled { opacity: .5; cursor: not-allowed; }

/* ---------- 表单 ---------- */
.form-item { margin-bottom: 18px; }
.form-label { display: block; font-size: 13px; color: var(--text-2); margin-bottom: 7px; }
.form-label .req { color: var(--danger); margin-left: 2px; }
.form-input {
  width: 100%; padding: 10px 14px;
  border: 1px solid var(--border-strong); border-radius: var(--radius-input);
  background: #fff; color: var(--text); outline: none;
  transition: border .15s, box-shadow .15s;
}
.form-input:focus { border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-weak); }
.form-input::placeholder { color: var(--text-3); }
textarea.form-input { resize: vertical; min-height: 90px; }
.form-row { display: flex; gap: 12px; }
.form-row > * { flex: 1; }
.form-hint { font-size: 12px; color: var(--text-3); margin-top: 6px; }

/* 验证码输入 */
.code-wrap { display: flex; gap: 10px; }
.code-wrap .form-input { flex: 1; }
.code-btn {
  flex-shrink: 0; min-width: 110px; padding: 0 14px;
  border: 1px solid var(--border-strong); border-radius: var(--radius-input);
  color: var(--brand); font-size: 13px; background: #fff;
}
.code-btn:disabled { color: var(--text-3); cursor: not-allowed; }

/* ---------- 状态徽标 ---------- */
.tag {
  display: inline-flex; align-items: center;
  padding: 3px 10px; border-radius: 6px;
  font-size: 12px; font-weight: 500; line-height: 1.5;
}
.tag-gray { background: #f0f1f3; color: #6b7280; }
.tag-blue { background: #e8f1ff; color: #2f6bdc; }
.tag-red { background: #fdeaea; color: #d13a3f; }
.tag-orange { background: #fff3e0; color: #e8840a; }
.tag-green { background: #e6f7ef; color: #149a5a; }
.tag-pink { background: var(--brand-light); color: var(--brand); }
.tag-dark { background: #3a3f45; color: #fff; }

/* ---------- 表格 ---------- */
.table { width: 100%; border-collapse: collapse; }
.table th, .table td {
  text-align: center; padding: 13px 14px;
  border-bottom: 1px solid var(--border);
  font-size: 13px;
}
.table th { color: var(--text-3); font-weight: 500; background: #fafbfc; white-space: nowrap; }
.table tr:last-child td { border-bottom: none; }
.table tbody tr:hover { background: #fafbfc; }
.table .cell-title { color: var(--text); font-weight: 500; }

/* 表格固定列（水平滚动时锁定） */
.table th.sticky-l, .table td.sticky-l { position: sticky; left: 0; z-index: 2; background: #fff; }
.table th.sticky-l2, .table td.sticky-l2 { position: sticky; left: 40px; z-index: 2; background: #fff; }
.table th.sticky-r, .table td.sticky-r { position: sticky; right: 0; z-index: 2; background: #fff; }
.table th.sticky-l, .table th.sticky-l2, .table th.sticky-r { background: #fafbfc; z-index: 3; }
.table tbody tr:hover td.sticky-l,
.table tbody tr:hover td.sticky-l2,
.table tbody tr:hover td.sticky-r { background: #fafbfc; }
.table td.sticky-l2 { box-shadow: 2px 0 4px rgba(0,0,0,.06); }
.table td.sticky-r, .table th.sticky-r { box-shadow: -2px 0 4px rgba(0,0,0,.06); }

/* ---------- 弹窗 ---------- */
.modal-mask {
  position: fixed; inset: 0; z-index: 200;
  background: rgba(20, 24, 30, 0.45);
  display: none; align-items: center; justify-content: center;
}
.modal-mask.show { display: flex; }
.modal {
  background: #fff; border-radius: 14px; width: 460px; max-width: 92vw;
  max-height: 88vh; display: flex; flex-direction: column;
  box-shadow: var(--shadow-pop);
  animation: pop .18s ease;
}
.modal-head {
  padding: 24px 24px 0; flex-shrink: 0;
  display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px;
}
.modal-body {
  padding: 0 24px; overflow-y: auto; flex: 1;
}
.modal-foot {
  padding: 16px 24px 24px; flex-shrink: 0;
  display: flex; justify-content: flex-end; gap: 10px; margin-top: 22px;
}
.modal-lg { width: 620px; }
@keyframes pop { from { transform: scale(.96); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.modal-title { font-size: 16px; font-weight: 600; }
.modal-close { width: 20px; height: 20px; color: var(--text-3); cursor: pointer; }

/* ---------- 空状态 / 提示 ---------- */
.empty {
  text-align: center; padding: 48px 20px; color: var(--text-3);
}
.empty .empty-icon { font-size: 40px; margin-bottom: 12px; opacity: .5; }
.empty .empty-text { font-size: 14px; }

/* ---------- 提示条 ---------- */
.notice {
  display: flex; align-items: flex-start; gap: 10px;
  padding: 14px 16px; border-radius: 10px; font-size: 13px;
  margin-bottom: 16px;
}
.notice-info { background: #e8f1ff; color: #2f6bdc; }
.notice-warn { background: #fff3e0; color: #e8840a; }
.notice-success { background: #e6f7ef; color: #149a5a; }
.notice svg { width: 18px; height: 18px; flex-shrink: 0; margin-top: 1px; }

/* ---------- 步骤条 ---------- */
.steps { display: flex; align-items: center; margin-bottom: 24px; }
.step { display: flex; align-items: center; gap: 8px; }
.step-dot {
  width: 26px; height: 26px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; font-weight: 600;
  background: var(--fill-2); color: var(--text-3);
}
.step.active .step-dot { background: var(--brand); color: #fff; }
.step.done .step-dot { background: var(--ok); color: #fff; }
.step-label { font-size: 13px; color: var(--text-3); }
.step.active .step-label { color: var(--text); font-weight: 600; }
.step.done .step-label { color: var(--text-2); }
.step-line { flex: 1; height: 2px; background: var(--border-strong); margin: 0 12px; }
.step-line.done { background: var(--ok); }

/* ---------- 辅助 ---------- */
.row { display: flex; align-items: center; gap: 12px; }
.between { display: flex; align-items: center; justify-content: space-between; }
.mt-8 { margin-top: 8px; } .mt-16 { margin-top: 16px; } .mt-24 { margin-top: 24px; }
.mb-8 { margin-bottom: 8px; } .mb-16 { margin-bottom: 16px; } .mb-24 { margin-bottom: 24px; }
.text-3 { color: var(--text-3); } .text-2 { color: var(--text-2); }
.text-brand { color: var(--brand); } .text-ok { color: var(--ok); } .text-danger { color: var(--danger); }
.fs-12 { font-size: 12px; } .fs-13 { font-size: 13px; }
.mono { font-variant-numeric: tabular-nums; }

/* 统计卡 */
.stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 20px; }
.stat-card { background: #fff; border-radius: var(--radius-card); box-shadow: var(--shadow-card); padding: 20px 22px; }
.stat-label { font-size: 13px; color: var(--text-3); }
.stat-value { font-size: 26px; font-weight: 700; margin-top: 6px; font-variant-numeric: tabular-nums; }
.stat-value .unit { font-size: 14px; font-weight: 400; color: var(--text-3); margin-left: 2px; }
.stat-trend { font-size: 12px; margin-top: 4px; }

/* 用户下拉菜单 */
.user-menu {
  position: absolute; top: var(--topbar-h); right: 24px; z-index: 150;
  background: #fff; border-radius: 10px; box-shadow: var(--shadow-pop);
  min-width: 140px; padding: 6px; overflow: hidden;
}
.user-menu a, .user-menu .logout-link {
  display: block; padding: 9px 14px; border-radius: 6px;
  font-size: 13px; color: var(--text-2);
}
.user-menu a:hover, .user-menu .logout-link:hover { background: var(--brand-weak); color: var(--brand); }

/* toast */
#toast {
  position: fixed; top: 80px; left: 50%; transform: translateX(-50%);
  z-index: 300; background: #fff; color: var(--text);
  padding: 10px 20px; border-radius: 8px; box-shadow: var(--shadow-pop);
  font-size: 14px; display: none;
}
#toast.show { display: block; animation: pop .2s ease; }

/* ===== 时间范围（高仿 antd RangePicker，公共组件） ===== */
.rp-wrap { position: relative; }
.rp-box {
  height: 32px; width: 320px; padding: 4px 11px; border: 1px solid #d9d9d9;
  border-radius: 6px; background: #fff; display: flex; align-items: center; cursor: pointer; transition: all .2s;
}
.rp-box:hover { border-color: var(--brand); }
.rp-box.open { border-color: var(--brand); box-shadow: 0 0 0 2px rgba(255,46,99,.1); }
.rp-val { flex: 1; font-size: 14px; color: var(--text); text-align: center; font-variant-numeric: tabular-nums; }
.rp-val.ph { color: #bfbfbf; }
.rp-sep { margin: 0 6px; color: var(--text-3); font-size: 14px; }
.rp-panel {
  position: absolute; top: calc(100% + 4px); left: 0; z-index: 60;
  background: #fff; border-radius: 8px; box-shadow: 0 6px 16px rgba(0,0,0,.12);
  display: none; overflow: hidden; width: 560px;
}
.rp-panel.show { display: flex; }
.rp-presets { width: 130px; border-right: 1px solid var(--border); padding: 8px 0; flex-shrink: 0; }
.rp-preset { padding: 8px 14px; font-size: 13px; color: var(--text-2); cursor: pointer; }
.rp-preset:hover { background: var(--brand-weak); color: var(--brand); }
.rp-main { flex: 1; padding: 12px; display: flex; flex-direction: column; }
.rp-inputs { display: flex; gap: 8px; margin-bottom: 12px; }
.rp-inputs input { flex: 1; height: 30px; padding: 0 8px; border: 1px solid #d9d9d9; border-radius: 6px; font-size: 13px; }
.rp-inputs input:focus { border-color: var(--brand); outline: none; box-shadow: 0 0 0 2px rgba(255,46,99,.1); }
.rp-cal-wrap { display: flex; gap: 16px; }
.rp-cal { flex: 1; }
.rp-cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.rp-cal-title { font-size: 13px; font-weight: 600; }
.rp-nav { display: flex; gap: 4px; }
.rp-nav button { width: 22px; height: 22px; border: none; background: none; cursor: pointer; color: var(--text-3); border-radius: 4px; font-size: 12px; }
.rp-nav button:hover { background: #f5f5f5; color: var(--text); }
.rp-week { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; font-size: 11px; color: var(--text-3); margin-bottom: 4px; }
.rp-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
.rp-day {
  height: 26px; display: flex; align-items: center; justify-content: center;
  font-size: 12px; color: var(--text); cursor: pointer; border-radius: 4px;
}
.rp-day:hover { background: var(--brand-weak); }
.rp-day.other { color: #bfbfbf; }
.rp-day.in-range { background: rgba(255,46,99,.1); }
.rp-day.start, .rp-day.end { background: var(--brand); color: #fff; }
.rp-day.disabled { color: #d9d9d9; cursor: not-allowed; }

/* ===== 筛选区折叠项 ===== */
.filter-extra { margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--border); }

/* ===== 联想输入 ===== */
.autocomplete { position: relative; }
.autocomplete .ac-panel {
  position: fixed; z-index: 400;
  background: #fff; border-radius: 8px; box-shadow: 0 6px 16px rgba(0,0,0,.12);
  border: 1px solid var(--border); max-height: 220px; overflow-y: auto; display: none;
}
.autocomplete .ac-panel.show { display: block; }
.ac-opt { padding: 8px 14px; font-size: 13px; color: var(--text-2); cursor: pointer; }
.ac-opt:hover { background: var(--brand-weak); color: var(--brand); }
.ac-opt .hl { color: var(--brand); font-weight: 600; }
.ac-empty { padding: 12px 14px; font-size: 13px; color: var(--text-3); }

/* ===== 列表多选框 ===== */
.cb-col { width: 40px; text-align: center; }
.cb-col input[type="checkbox"] { width: 15px; height: 15px; cursor: pointer; accent-color: var(--brand); }

/* ===== 下拉多选（高仿 antd Select multiple） ===== */
.ms-wrap { position: relative; }
.ms-box {
  min-height: 32px; width: 100%; box-sizing: border-box; padding: 2px 28px 2px 6px;
  border: 1px solid #d9d9d9; border-radius: 6px; background: #fff; cursor: pointer;
  display: flex; align-items: center; flex-wrap: wrap; gap: 3px; transition: all .2s;
  position: relative;
}
.ms-box:hover { border-color: var(--brand); }
.ms-box.open { border-color: var(--brand); box-shadow: 0 0 0 2px rgba(255,46,99,.1); }
.ms-placeholder { color: #bfbfbf; font-size: 14px; padding: 0 5px; }
.ms-tag {
  display: inline-flex; align-items: center; height: 24px; padding: 0 6px;
  background: #fafafa; border: 1px solid #d9d9d9; border-radius: 4px;
  font-size: 12px; color: var(--text-2); margin: 1px 0;
}
.ms-tag .ms-x { margin-left: 4px; color: #999; cursor: pointer; font-size: 12px; line-height: 1; }
.ms-tag .ms-x:hover { color: var(--brand); }
.ms-tag.more { background: #fff; border-style: dashed; color: var(--text-3); }
.ms-arrow { position: absolute; right: 9px; top: 50%; transform: translateY(-50%); color: #bfbfbf; pointer-events: none; transition: transform .2s; display: flex; }
.ms-box.open .ms-arrow { transform: translateY(-50%) rotate(180deg); }
.ms-panel {
  position: absolute; top: calc(100% + 4px); left: 0; z-index: 60; width: 100%;
  background: #fff; border-radius: 8px; box-shadow: 0 6px 16px rgba(0,0,0,.12);
  padding: 4px; display: none; max-height: 260px; overflow-y: auto;
}
.ms-panel.show { display: block; }
.ms-opt {
  display: flex; align-items: center; gap: 8px; padding: 7px 10px;
  border-radius: 4px; font-size: 14px; cursor: pointer; color: var(--text-2); transition: background .15s;
}
.ms-opt:hover { background: #f5f5f5; }
.ms-opt .opt-check { width: 16px; text-align: center; color: var(--brand); font-weight: 700; visibility: hidden; }
.ms-opt.checked .opt-check { visibility: visible; }
.ms-opt.checked { color: var(--brand); font-weight: 600; }

/* 操作列表头居中 */
.th-op { text-align: center; }

/* 响应式 */
@media (max-width: 900px) {
  .sidebar { display: none; }
  .stat-grid { grid-template-columns: repeat(2, 1fr); }
}
</style>
<style>  .page-tabs { display: flex; gap: 0; border-bottom: 1px solid var(--border); margin-bottom: 20px; }
  .page-tab { padding: 10px 20px; font-size: 14px; color: var(--text-3); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; transition: all .15s; }
  .page-tab.active { color: var(--brand); font-weight: 600; border-bottom-color: var(--brand); }
  .page-tab:hover { color: var(--brand); }
  .page-tab .tab-count { display: inline-block; min-width: 18px; height: 18px; padding: 0 5px; margin-left: 6px; background: var(--fill-2); border-radius: 9px; font-size: 12px; line-height: 18px; text-align: center; color: var(--text-3); }

  down: '<svg viewBox="0 0 20 20" fill="none"><path d="m5 8 5 5 5-5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>'
};
function icon(name) { return ICONS[name] || ''; }

// 简易 i18n 兜底（供日期组件调用）
function t(s) { return s; }
function isEnglish() { return false; }

function dateStr(d) {
  function p(n) { return (n < 10 ? '0' : '') + n; }
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
}

var RP_PRESETS = [
  { label: '今日', get: function () { var d = new Date(); return [dateStr(d), dateStr(d)]; } },
  { label: '昨日', get: function () { var d = new Date(); d.setDate(d.getDate() - 1); return [dateStr(d), dateStr(d)]; } },
  { label: '本周', get: function () { var s = new Date(); s.setDate(s.getDate() - s.getDay()); var e = new Date(s); e.setDate(e.getDate() + 6); return [dateStr(s), dateStr(e)]; } },
  { label: '本月', get: function () { var s = new Date(); s.setDate(1); var e = new Date(s.getFullYear(), s.getMonth() + 1, 0); return [dateStr(s), dateStr(e)]; } },
  { label: '今年', get: function () { var s = new Date(); s.setMonth(0, 1); var e = new Date(s.getFullYear(), 11, 31); return [dateStr(s), dateStr(e)]; } }
];

var _rpRegistry = {};

function createRangePicker(wrapId, opts) {
  opts = opts || {};
  var dateOnly = !!opts.dateOnly;
  var self = {
    wrapId: wrapId, dateOnly: dateOnly,
    start: null, end: null, focusCal: 'start',
    calStartDate: new Date(), calEndDate: new Date()
  };
  _rpRegistry[wrapId] = self;

  self.render = function () {
    var ph = dateOnly ? 'YYYY-MM-DD' : 'YYYY-MM-DD HH:mm:ss';
    document.getElementById(wrapId).innerHTML =
      '<div class="rp-box" id="' + wrapId + 'Box" onclick="rpToggle(\'' + wrapId + '\',event)">' +
        '<span class="rp-val ph" id="' + wrapId + 'StartVal">' + t('开始时间') + '</span>' +
        '<span class="rp-sep">→</span>' +
        '<span class="rp-val ph" id="' + wrapId + 'EndVal">' + t('结束时间') + '</span>' +
      '</div>' +
      '<div class="rp-panel" id="' + wrapId + 'Panel">' +
        '<div class="rp-presets" id="' + wrapId + 'Presets"></div>' +
        '<div class="rp-main">' +
          '<div class="rp-inputs">' +
            '<input type="text" id="' + wrapId + 'StartInput" placeholder="' + ph + '" readonly onclick="rpFocus(\'' + wrapId + '\',\'start\')">' +
            '<input type="text" id="' + wrapId + 'EndInput" placeholder="' + ph + '" readonly onclick="rpFocus(\'' + wrapId + '\',\'end\')">' +
          '</div>' +
          '<div class="rp-cal-wrap">' +
            '<div class="rp-cal" id="' + wrapId + 'CalStart"></div>' +
            '<div class="rp-cal" id="' + wrapId + 'CalEnd"></div>' +
          '</div>' +
        '</div>' +
      '</div>';
    self.renderPresets();
    self.renderCals();
    self.sync();
  };

  self.renderPresets = function () {
    var html = RP_PRESETS.map(function (p, i) {
      return '<div class="rp-preset" onclick="rpApplyPreset(\'' + wrapId + '\',' + i + ')">' + t(p.label) + '</div>';
    }).join('');
    document.getElementById(wrapId + 'Presets').innerHTML = html;
  };

  self.applyPreset = function (i) {
    var r = RP_PRESETS[i].get();
    self.start = dateOnly ? r[0] : r[0] + ' 00:00:00';
    self.end = dateOnly ? r[1] : r[1] + ' 23:59:59';
    self.sync();
    if (opts.onChange) opts.onChange(self);
  };

  self.togglePanel = function (e) {
    if (e) e.stopPropagation();
    var panel = document.getElementById(wrapId + 'Panel');
    var box = document.getElementById(wrapId + 'Box');
    var open = panel.classList.contains('show');
    panel.classList.toggle('show', !open);
    box.classList.toggle('open', !open);
    if (!open) self.renderCals();
  };

  self.sync = function () {
    document.getElementById(wrapId + 'StartInput').value = self.start || '';
    document.getElementById(wrapId + 'EndInput').value = self.end || '';
    var sv = document.getElementById(wrapId + 'StartVal');
    var ev = document.getElementById(wrapId + 'EndVal');
    if (self.start) { sv.textContent = self.start; sv.classList.remove('ph'); } else { sv.textContent = t('开始时间'); sv.classList.add('ph'); }
    if (self.end) { ev.textContent = self.end; ev.classList.remove('ph'); } else { ev.textContent = t('结束时间'); ev.classList.add('ph'); }
    self.renderCals();
  };

  self.renderCal = function (containerId, viewDate) {
    var y = viewDate.getFullYear(), m = viewDate.getMonth();
    var first = new Date(y, m, 1);
    var startDay = first.getDay();
    var daysInMonth = new Date(y, m + 1, 0).getDate();
    var daysInPrev = new Date(y, m, 0).getDate();
    var cells = [];
    for (var i = 0; i < 42; i++) {
      var dnum, cls = 'rp-day', dayObj;
      if (i < startDay) {
        dnum = daysInPrev - startDay + 1 + i; cls += ' other';
        dayObj = new Date(y, m - 1, dnum);
      } else if (i >= startDay + daysInMonth) {
        dnum = i - startDay - daysInMonth + 1; cls += ' other';
        dayObj = new Date(y, m + 1, dnum);
      } else {
        dnum = i - startDay + 1;
        dayObj = new Date(y, m, dnum);
      }
      var ds = dateStr(dayObj);
      if (self.start && ds === self.start.slice(0, 10)) cls += ' start';
      if (self.end && ds === self.end.slice(0, 10)) cls += ' end';
      if (self.start && self.end) {
        var sd = self.start.slice(0, 10), ed = self.end.slice(0, 10);
        if (ds > sd && ds < ed) cls += ' in-range';
      }
      cells.push('<div class="' + cls + '" onclick="rpPickDay(\'' + wrapId + '\',\'' + ds + '\')">' + dnum + '</div>');
    }
    var weekArr = isEnglish() ? ['Su','Mo','Tu','We','Th','Fr','Sa'] : ['日','一','二','三','四','五','六'];
    var weekHtml = weekArr.map(function (w) { return '<div>' + w + '</div>'; }).join('');

  function emEmpty(text) {
    return '<div class="empty" style="padding:26px 0"><div class="empty-text">' + text + '</div></div>';
  }

  function openEarnDetail(workId) {
    var w = findEarn(workId);
    if (!w) return;
    var daily = buildDaily(w);
    earnState = {
      id: workId,
      start: daily[0].date,
      end: daily[daily.length - 1].date,
      types: ['cost', 'share', 'income'],
      chans: CH_DEF.map(function (c) { return c.key; })
    };
    document.getElementById('earnModalTitle').textContent = '收益明细 · ' + w.workName;
    renderEarnDetail();
    // 日期范围（精确到日）：默认 = 上架日 ~ 数据截止日
    emDatePicker = createRangePicker('emDateWrap', {
      dateOnly: true,
      onChange: function () {
        var v = emDatePicker.get();
        if (v.start) earnState.start = v.start;
        if (v.end) earnState.end = v.end;
        renderEarnTable();
      }
    });
    emDatePicker.start = earnState.start;
    emDatePicker.end = earnState.end;
    emDatePicker.sync();
    openModal('earnModal');
    document.getElementById('earnModalBody').scrollTop = 0;
  }

  function renderEarnDetail() {
    var w = findEarn(earnState.id);
    if (!w) return;

    var html = '';
    // 一、基础信息
    html += '<div class="group-title" style="margin-top:0">基础信息</div>';
    html += '<div class="desc-grid info-block">';
    html += detailRow('短剧信息', w.workName + '（' + w.workId + '）');
    html += detailRow('剧本编号', w.scriptNo);
    html += detailRow('所属账号', w.accountName);
    html += detailRow('上架时间', w.shelfTime || '—');
    html += detailRow('授权主体', w.subjectName, 'grid-column:span 2');
    html += detailRow('播放量', fmtK(w.playCount));
    html += detailRow('收藏数', fmtK(w.favCount));
    html += detailRow('点赞数', fmtK(w.likeCount));
    html += '</div>';

    // 二、明细数据（以「日」为最小维度）
    html += '<div class="group-title gt-flex"><span>明细数据</span>' +
      '<span class="gt-action" onclick="exportDetail()">导出</span></div>';
    html += '<div class="detail-filter">';
    html += '<div class="df-item"><label>日期</label><div class="rp-wrap" id="emDateWrap"></div></div>';
    html += '<div class="df-item"><label>类型</label><div class="ms-wrap" style="width:240px">' +
      '<div class="ms-box" id="emTypeBox" onclick="togglePanel(\'emTypePanel\',\'emTypeBox\',event)">' +
        '<div id="emTypeContent" style="display:flex;align-items:center;flex-wrap:wrap;gap:3px"></div>' +
        '<span class="ms-arrow"><svg viewBox="0 0 20 20" fill="none" width="14" height="14"><path d="m5 8 5 5 5-5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></span>' +
      '</div><div class="ms-panel" id="emTypePanel"></div></div></div>';
    html += '<div class="df-item"><label>渠道</label><div class="ms-wrap" style="width:175px">' +
      '<div class="ms-box" id="emChanBox" onclick="togglePanel(\'emChanPanel\',\'emChanBox\',event)">' +
        '<div id="emChanContent" style="display:flex;align-items:center;flex-wrap:wrap;gap:3px"></div>' +
        '<span class="ms-arrow"><svg viewBox="0 0 20 20" fill="none" width="14" height="14"><path d="m5 8 5 5 5-5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></span>' +
      '</div><div class="ms-panel" id="emChanPanel"></div></div></div>';
    html += '</div>';
    html += '<div id="emTableWrap"></div>';

    document.getElementById('earnModalBody').innerHTML = html;
    renderMs(TYPE_OPTS, earnState.types, 'emTypeContent', 'emTypePanel', 'toggleEmType', 'removeEmType');
    renderMs(CHAN_OPTS, earnState.chans, 'emChanContent', 'emChanPanel', 'toggleEmChan', 'removeEmChan', 1);
    renderEarnTable();
  }

  function toggleEmType(k, e) {
    e.stopPropagation(); toggleIn(earnState.types, k);
    renderMs(TYPE_OPTS, earnState.types, 'emTypeContent', 'emTypePanel', 'toggleEmType', 'removeEmType');
    renderEarnTable();
  }
  function removeEmType(k, e) {
    e.stopPropagation();
    var i = earnState.types.indexOf(k); if (i !== -1) earnState.types.splice(i, 1);
    renderMs(TYPE_OPTS, earnState.types, 'emTypeContent', 'emTypePanel', 'toggleEmType', 'removeEmType');
    renderEarnTable();
  }
  function toggleEmChan(k, e) {
    e.stopPropagation(); toggleIn(earnState.chans, k);
    renderMs(CHAN_OPTS, earnState.chans, 'emChanContent', 'emChanPanel', 'toggleEmChan', 'removeEmChan', 1);
    renderEarnTable();
  }
  function removeEmChan(k, e) {
    e.stopPropagation();
    var i = earnState.chans.indexOf(k); if (i !== -1) earnState.chans.splice(i, 1);
    renderMs(CHAN_OPTS, earnState.chans, 'emChanContent', 'emChanPanel', 'toggleEmChan', 'removeEmChan', 1);
    renderEarnTable();
  }

  function renderEarnTable() {
    var w = findEarn(earnState.id);
    var box = document.getElementById('emTableWrap');
    if (!w || !box) return;

    var daily = buildDaily(w).filter(function (d) { return d.date >= earnState.start && d.date <= earnState.end; });
    var chans = CH_DEF.filter(function (c) { return earnState.chans.indexOf(c.key) !== -1; });
    var types = TYPE_OPTS.filter(function (x) { return earnState.types.indexOf(x.key) !== -1; });

    if (!chans.length) { emDetailRows = []; box.innerHTML = emEmpty('请至少选择一个渠道'); return; }
    if (!types.length) { emDetailRows = []; box.innerHTML = emEmpty('请至少选择一个类型'); return; }
    if (!daily.length) { emDetailRows = []; box.innerHTML = emEmpty('所选日期暂无数据'); return; }

    var rows = [];
    daily.forEach(function (d) {
      var mCost = costByChan(d.adCost);
      var mShare = shareCostByChan(d.adCost);
      var mInc = incomeByChan(dayProfit(d));
      chans.forEach(function (c) {
        types.forEach(function (tp) {
          rows.push({
            date: d.date, chan: c.label, type: tp.label,
            val: tp.key === 'cost' ? mCost[c.key] : (tp.key === 'share' ? mShare[c.key] : mInc[c.key])
          });
        });
      });
    });
    emDetailRows = rows;

    var body = rows.map(function (r) {
      return '<tr><td class="mono">' + r.date + '</td>' +
        '<td>' + r.chan + '</td>' +
        '<td>' + r.type + '</td>' +
        '<td class="mono" style="text-align:right">' + fmtMoney(r.val) + '</td></tr>';
    }).join('');

    box.innerHTML = '<div class="em-table-scroll"><table class="table detail-table">' +
      '<thead><tr><th style="width:130px">日期</th><th style="width:120px">渠道</th><th style="width:120px">类型</th><th style="text-align:right">金额(美元)</th></tr></thead>' +
      '<tbody>' + body + '</tbody></table></div>';
  }

  // ===================== 分渠道明细（实际消耗 / 可分成消耗 / 收入） =====================
  function openChannelDetail(workId, type) {
    var w = findEarn(workId);
    if (!w) return;
    var label = type === 'share' ? '可分成消耗' : (type === 'income' ? '收入' : '实际消耗');
    var total = type === 'share' ? calcShareCost(w) : (type === 'income' ? calcProfit(w) : w.adCost);
    var map = type === 'share' ? shareCostByChan(w.adCost)
      : (type === 'income' ? incomeByChan(total) : costByChan(total));

    document.getElementById('chanModalTitle').textContent = '分渠道' + label + ' · ' + w.workName;
    var body = '<table class="table detail-table"><thead><tr>' +
      '<th>渠道</th><th style="text-align:right">' + label + '(美元)</th>' +
      '</tr></thead><tbody>' +
      CH_DEF.map(function (c) {
        return '<tr><td>' + c.label + '</td><td class="mono" style="text-align:right">' + fmtMoney(map[c.key]) + '</td></tr>';
      }).join('') +
      '<tr class="sum-row"><td>合计</td><td class="mono" style="text-align:right">' + fmtMoney(total) + '</td></tr>' +
      '</tbody></table>';
    document.getElementById('chanModalBody').innerHTML = body;
    openModal('chanModal');
  }

  // 点击空白关闭下拉面板
  document.addEventListener('click', function (e) {
    if (!e.target.closest('.ms-wrap')) {
      document.querySelectorAll('.ms-wrap .ms-panel').forEach(function (p) { p.classList.remove('show'); });
      document.querySelectorAll('.ms-wrap .ms-box').forEach(function (b) { b.classList.remove('open'); });
    }
    if (!e.target.closest('.rp-wrap')) {
      document.querySelectorAll('.rp-panel').forEach(function (p) { p.classList.remove('show'); });
      document.querySelectorAll('.rp-box').forEach(function (b) { b.classList.remove('open'); });
    }
  });

  // ===================== 初始化 =====================
  document.getElementById('topbar-root').innerHTML = renderTopbar({});
  document.getElementById('sidebar-root').innerHTML = renderSidebar('earnings');
  renderList();
</script>
</body>
</html>
