<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>结算单管理 · 版权开放平台</title>
<style>/* ============================================================
   版权开放平台 · 公共样式 common.css
   品牌主色：粉红 #ff2e63，浅色背景，卡片式布局
   C 端与 B 端共享
   ============================================================ */

:root {
  --brand: #ff2e63;
  --brand-dark: #e0244f;
  --brand-light: #fff0f4;
  --brand-weak: rgba(255, 46, 99, 0.06);
  --brand-grad: linear-gradient(135deg, #ff5c8a 0%, #ff2e63 100%);

  --bg: #f7f8fa;
  --fill-1: #f7f8fa;
  --fill-2: #eef0f3;
  --card: #ffffff;
  --border: #eef0f3;
  --border-strong: #e2e5ea;

  --text: #1f2329;
  --text-2: #51565d;
  --text-3: #8a9199;
  --text-invert: #ffffff;

  --ok: #16b364;
  --warn: #f0a020;
  --danger: #e5484d;
  --info: #3b82f6;

  --radius-card: 12px;
  --radius-btn: 8px;
  --radius-input: 8px;
  --shadow-card: 0 2px 12px rgba(20, 24, 30, 0.06);
  --shadow-pop: 0 8px 30px rgba(20, 24, 30, 0.14);

  --sidebar-w: 220px;
  --topbar-h: 64px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei",
    "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  color: var(--text);
  background: var(--bg);
  font-size: 14px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}

a { color: inherit; text-decoration: none; }
ul, ol { list-style: none; }
button { font-family: inherit; cursor: pointer; border: none; background: none; }
input, select, textarea { font-family: inherit; font-size: 14px; }

/* ---------- 通用布局 ---------- */
.container { max-width: 1200px; margin: 0 auto; padding: 0 24px; }

/* ---------- 顶部栏 ---------- */
.topbar {
  position: sticky; top: 0; z-index: 100;
  background: #fff;
  height: var(--topbar-h);
  border-bottom: 1px solid var(--border);
}
.topbar-inner {
  max-width: 1440px; margin: 0 auto; padding: 0 24px;
  height: 100%; display: flex; align-items: center; justify-content: space-between;
}
.topbar-left { display: flex; align-items: center; gap: 12px; }
.topbar-logo {
  width: 30px; height: 30px; border-radius: 8px;
  background: var(--brand-grad);
  display: flex; align-items: center; justify-content: center;
  color: #fff; font-weight: 700; font-size: 16px;
}
.topbar-title { font-size: 15px; font-weight: 600; }
.topbar-divider { width: 1px; height: 16px; background: var(--border-strong); }
.topbar-sub { font-size: 13px; color: var(--text-3); }
.topbar-switch { display: inline-flex; align-items: center; height: 26px; padding: 0 12px; font-size: 13px; color: var(--brand); border: 1px solid var(--brand); border-radius: 4px; cursor: pointer; text-decoration: none; margin-left: 2px; }
.topbar-switch:hover { background: var(--brand); color: #fff; }

.topbar-right { display: flex; align-items: center; gap: 20px; }
.topbar-icon {
  width: 20px; height: 20px; color: var(--text-2);
  position: relative; display: flex; align-items: center;
}
.topbar-icon .dot {
  position: absolute; top: -2px; right: -2px;
  width: 7px; height: 7px; border-radius: 50%; background: var(--brand);
  border: 1.5px solid #fff;
}
.topbar-user { display: flex; align-items: center; gap: 8px; cursor: pointer; }
.topbar-avatar {
  width: 28px; height: 28px; border-radius: 50%;
  background: var(--brand-grad); color: #fff;
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; font-weight: 600;
}
.topbar-name { font-size: 14px; color: var(--text); }
.topbar-caret { width: 14px; height: 14px; color: var(--text-3); }

/* ---------- 主体框架：侧边菜单 + 内容 ---------- */
.layout {
  display: flex; min-height: calc(100vh - var(--topbar-h));
  max-width: 1440px; margin: 0 auto;
}
.sidebar {
  width: var(--sidebar-w); flex-shrink: 0;
  padding: 20px 12px;
}
.sidebar-item {
  display: flex; align-items: center; gap: 10px;
  padding: 11px 14px; margin-bottom: 4px;
  border-radius: 8px; color: var(--text-2);
  font-size: 14px; cursor: pointer;
  transition: background .15s, color .15s;
}
.sidebar-item:hover { background: var(--fill-2); color: var(--text); }
.sidebar-item.active {
  background: var(--brand-weak); color: var(--brand); font-weight: 600;
}
.sidebar-item svg { width: 18px; height: 18px; flex-shrink: 0; }
.sidebar-item .arrow { margin-left: auto; width: 14px; height: 14px; transition: transform .2s; }

/* 目录分组：子菜单默认收起，展开后箭头旋转 */
.sidebar-group .sidebar-sub { display: none; padding-left: 28px; }
.sidebar-group.open .sidebar-sub { display: block; }
.sidebar-group.open .arrow { transform: rotate(180deg); }
.sidebar-sub .sidebar-item { padding: 9px 14px; font-size: 13px; }

.content {
  flex: 1; min-width: 0;
  padding: 24px 32px 48px;
}

/* ---------- 页面标题 ---------- */
.page-head { margin-bottom: 20px; }
.page-title { font-size: 20px; font-weight: 700; }
.page-desc { font-size: 13px; color: var(--text-3); margin-top: 4px; }

/* ---------- 卡片 ---------- */
.card {
  background: var(--card); border-radius: var(--radius-card);
  box-shadow: var(--shadow-card);
  padding: 24px;
  margin-bottom: 20px;
}
.card-title { font-size: 16px; font-weight: 600; margin-bottom: 16px; }
.card + .card { margin-top: 0; }

/* ---------- 按钮 ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  padding: 9px 20px; border-radius: var(--radius-btn);
  font-size: 14px; font-weight: 500; line-height: 1;
  transition: all .15s; white-space: nowrap;
}
.btn-primary { background: var(--brand); color: #fff; }
.btn-primary:hover { background: var(--brand-dark); }
.btn-outline { border: 1px solid var(--border-strong); color: var(--text-2); background: #fff; }
.btn-outline:hover { border-color: var(--brand); color: var(--brand); }
.btn-text { color: var(--brand); padding: 9px 12px; }
.btn-text:hover { background: var(--brand-weak); }
.btn-danger { background: var(--danger); color: #fff; }
.btn-danger:hover { opacity: .9; }
.btn-plain { background: var(--fill-2); color: var(--text-2); }
.btn-plain:hover { background: var(--border-strong); }
.btn-ghost { color: var(--brand); }
.btn-block { width: 100%; }
.btn-lg { padding: 12px 28px; font-size: 15px; }
.btn-sm { padding: 6px 14px; font-size: 13px; }
.btn:disabled { opacity: .5; cursor: not-allowed; }

/* ---------- 表单 ---------- */
.form-item { margin-bottom: 18px; }
.form-label { display: block; font-size: 13px; color: var(--text-2); margin-bottom: 7px; }
.form-label .req { color: var(--danger); margin-left: 2px; }
.form-input {
  width: 100%; padding: 10px 14px;
  border: 1px solid var(--border-strong); border-radius: var(--radius-input);
  background: #fff; color: var(--text); outline: none;
  transition: border .15s, box-shadow .15s;
}
.form-input:focus { border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-weak); }
.form-input::placeholder { color: var(--text-3); }
textarea.form-input { resize: vertical; min-height: 90px; }
.form-row { display: flex; gap: 12px; }
.form-row > * { flex: 1; }
.form-hint { font-size: 12px; color: var(--text-3); margin-top: 6px; }

/* 验证码输入 */
.code-wrap { display: flex; gap: 10px; }
.code-wrap .form-input { flex: 1; }
.code-btn {
  flex-shrink: 0; min-width: 110px; padding: 0 14px;
  border: 1px solid var(--border-strong); border-radius: var(--radius-input);
  color: var(--brand); font-size: 13px; background: #fff;
}
.code-btn:disabled { color: var(--text-3); cursor: not-allowed; }

/* ---------- 状态徽标 ---------- */
.tag {
  display: inline-flex; align-items: center;
  padding: 3px 10px; border-radius: 6px;
  font-size: 12px; font-weight: 500; line-height: 1.5;
}
.tag-gray { background: #f0f1f3; color: #6b7280; }
.tag-blue { background: #e8f1ff; color: #2f6bdc; }
.tag-red { background: #fdeaea; color: #d13a3f; }
.tag-orange { background: #fff3e0; color: #e8840a; }
.tag-green { background: #e6f7ef; color: #149a5a; }
.tag-pink { background: var(--brand-light); color: var(--brand); }
.tag-purple { background: #f3e8ff; color: #7c3aed; }
.tag-cyan { background: #e0f5f7; color: #0e7490; }
.tag-dark { background: #3a3f45; color: #fff; }

/* ---------- 表格 ---------- */
.table { width: 100%; border-collapse: collapse; }
.table th, .table td {
  text-align: center; padding: 13px 14px;
  border-bottom: 1px solid var(--border);
  font-size: 13px;
}
.table th { color: var(--text-3); font-weight: 500; background: #fafbfc; white-space: nowrap; }
.table tr:last-child td { border-bottom: none; }
.table tbody tr:hover { background: #fafbfc; }
.table .cell-title { color: var(--text); font-weight: 500; }

/* 表格固定列（水平滚动时锁定） */
.table th.sticky-l, .table td.sticky-l { position: sticky; left: 0; z-index: 2; background: #fff; }
.table th.sticky-l2, .table td.sticky-l2 { position: sticky; left: 40px; z-index: 2; background: #fff; }
.table th.sticky-r, .table td.sticky-r { position: sticky; right: 0; z-index: 2; background: #fff; }
.table th.sticky-l, .table th.sticky-l2, .table th.sticky-r { background: #fafbfc; z-index: 3; }
.table tbody tr:hover td.sticky-l,
.table tbody tr:hover td.sticky-l2,
.table tbody tr:hover td.sticky-r { background: #fafbfc; }
.table td.sticky-l2 { box-shadow: 2px 0 4px rgba(0,0,0,.06); }
.table td.sticky-r, .table th.sticky-r { box-shadow: -2px 0 4px rgba(0,0,0,.06); }

/* ---------- 弹窗 ---------- */
.modal-mask {
  position: fixed; inset: 0; z-index: 200;
  background: rgba(20, 24, 30, 0.45);
  display: none; align-items: center; justify-content: center;
}
.modal-mask.show { display: flex; }
.modal {
  background: #fff; border-radius: 14px; width: 460px; max-width: 92vw;
  max-height: 88vh; display: flex; flex-direction: column;
  box-shadow: var(--shadow-pop);
  animation: pop .18s ease;
}
.modal-head {
  padding: 24px 24px 0; flex-shrink: 0;
  display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px;
}
.modal-body {
  padding: 0 24px; overflow-y: auto; flex: 1;
}
.modal-foot {
  padding: 16px 24px 24px; flex-shrink: 0;
  display: flex; justify-content: flex-end; gap: 10px; margin-top: 22px;
}
.modal-lg { width: 620px; }
@keyframes pop { from { transform: scale(.96); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.modal-title { font-size: 16px; font-weight: 600; }
.modal-close { width: 20px; height: 20px; color: var(--text-3); cursor: pointer; }

/* ---------- 空状态 / 提示 ---------- */
.empty {
  text-align: center; padding: 48px 20px; color: var(--text-3);
}
.empty .empty-icon { font-size: 40px; margin-bottom: 12px; opacity: .5; }
.empty .empty-text { font-size: 14px; }

/* ---------- 提示条 ---------- */
.notice {
  display: flex; align-items: flex-start; gap: 10px;
  padding: 14px 16px; border-radius: 10px; font-size: 13px;
  margin-bottom: 16px;
}
.notice-info { background: #e8f1ff; color: #2f6bdc; }
.notice-warn { background: #fff3e0; color: #e8840a; }
.notice-success { background: #e6f7ef; color: #149a5a; }
.notice svg { width: 18px; height: 18px; flex-shrink: 0; margin-top: 1px; }

/* ---------- 步骤条 ---------- */
.steps { display: flex; align-items: center; margin-bottom: 24px; }
.step { display: flex; align-items: center; gap: 8px; }
.step-dot {
  width: 26px; height: 26px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; font-weight: 600;
  background: var(--fill-2); color: var(--text-3);
}
.step.active .step-dot { background: var(--brand); color: #fff; }
.step.done .step-dot { background: var(--ok); color: #fff; }
.step-label { font-size: 13px; color: var(--text-3); }
.step.active .step-label { color: var(--text); font-weight: 600; }
.step.done .step-label { color: var(--text-2); }
.step-line { flex: 1; height: 2px; background: var(--border-strong); margin: 0 12px; }
.step-line.done { background: var(--ok); }

/* ---------- 辅助 ---------- */
.row { display: flex; align-items: center; gap: 12px; }
.between { display: flex; align-items: center; justify-content: space-between; }
.mt-8 { margin-top: 8px; } .mt-16 { margin-top: 16px; } .mt-24 { margin-top: 24px; }
.mb-8 { margin-bottom: 8px; } .mb-16 { margin-bottom: 16px; } .mb-24 { margin-bottom: 24px; }
.text-3 { color: var(--text-3); } .text-2 { color: var(--text-2); }
.text-brand { color: var(--brand); } .text-ok { color: var(--ok); } .text-danger { color: var(--danger); }
.fs-12 { font-size: 12px; } .fs-13 { font-size: 13px; }
.mono { font-variant-numeric: tabular-nums; }

/* 统计卡 */
.stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 20px; }
.stat-card { background: #fff; border-radius: var(--radius-card); box-shadow: var(--shadow-card); padding: 20px 22px; }
.stat-label { font-size: 13px; color: var(--text-3); }
.stat-value { font-size: 26px; font-weight: 700; margin-top: 6px; font-variant-numeric: tabular-nums; }
.stat-value .unit { font-size: 14px; font-weight: 400; color: var(--text-3); margin-left: 2px; }
.stat-trend { font-size: 12px; margin-top: 4px; }

/* 用户下拉菜单 */
.user-menu {
  position: absolute; top: var(--topbar-h); right: 24px; z-index: 150;
  background: #fff; border-radius: 10px; box-shadow: var(--shadow-pop);
  min-width: 140px; padding: 6px; overflow: hidden;
}
.user-menu a, .user-menu .logout-link {
  display: block; padding: 9px 14px; border-radius: 6px;
  font-size: 13px; color: var(--text-2);
}
.user-menu a:hover, .user-menu .logout-link:hover { background: var(--brand-weak); color: var(--brand); }

/* toast */
#toast {
  position: fixed; top: 80px; left: 50%; transform: translateX(-50%);
  z-index: 300; background: #fff; color: var(--text);
  padding: 10px 20px; border-radius: 8px; box-shadow: var(--shadow-pop);
  font-size: 14px; display: none;
}
#toast.show { display: block; animation: pop .2s ease; }

/* ===== 时间范围（高仿 antd RangePicker，公共组件） ===== */
.rp-wrap { position: relative; }
.rp-box {
  height: 32px; width: 320px; padding: 4px 11px; border: 1px solid #d9d9d9;
  border-radius: 6px; background: #fff; display: flex; align-items: center; cursor: pointer; transition: all .2s;
}
.rp-box:hover { border-color: var(--brand); }
.rp-box.open { border-color: var(--brand); box-shadow: 0 0 0 2px rgba(255,46,99,.1); }
.rp-val { flex: 1; font-size: 14px; color: var(--text); text-align: center; font-variant-numeric: tabular-nums; }
.rp-val.ph { color: #bfbfbf; }
.rp-sep { margin: 0 6px; color: var(--text-3); font-size: 14px; }
.rp-panel {
  position: absolute; top: calc(100% + 4px); left: 0; z-index: 60;
  background: #fff; border-radius: 8px; box-shadow: 0 6px 16px rgba(0,0,0,.12);
  display: none; overflow: hidden; width: 560px;
}
.rp-panel.show { display: flex; }
.rp-presets { width: 130px; border-right: 1px solid var(--border); padding: 8px 0; flex-shrink: 0; }
.rp-preset { padding: 8px 14px; font-size: 13px; color: var(--text-2); cursor: pointer; }
.rp-preset:hover { background: var(--brand-weak); color: var(--brand); }
.rp-main { flex: 1; padding: 12px; display: flex; flex-direction: column; }
.rp-inputs { display: flex; gap: 8px; margin-bottom: 12px; }
.rp-inputs input { flex: 1; height: 30px; padding: 0 8px; border: 1px solid #d9d9d9; border-radius: 6px; font-size: 13px; }
.rp-inputs input:focus { border-color: var(--brand); outline: none; box-shadow: 0 0 0 2px rgba(255,46,99,.1); }
.rp-cal-wrap { display: flex; gap: 16px; }
.rp-cal { flex: 1; }
.rp-cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.rp-cal-title { font-size: 13px; font-weight: 600; }
.rp-nav { display: flex; gap: 4px; }
.rp-nav button { width: 22px; height: 22px; border: none; background: none; cursor: pointer; color: var(--text-3); border-radius: 4px; font-size: 12px; }
.rp-nav button:hover { background: #f5f5f5; color: var(--text); }
.rp-week { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; font-size: 11px; color: var(--text-3); margin-bottom: 4px; }
.rp-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
.rp-day {
  height: 26px; display: flex; align-items: center; justify-content: center;
  font-size: 12px; color: var(--text); cursor: pointer; border-radius: 4px;
}
.rp-day:hover { background: var(--brand-weak); }
.rp-day.other { color: #bfbfbf; }
.rp-day.in-range { background: rgba(255,46,99,.1); }
.rp-day.start, .rp-day.end { background: var(--brand); color: #fff; }
.rp-day.disabled { color: #d9d9d9; cursor: not-allowed; }

/* ===== 筛选区折叠项 ===== */
.filter-extra { margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--border); }

/* ===== 联想输入 ===== */
.autocomplete { position: relative; }
.autocomplete .ac-panel {
  position: fixed; z-index: 400;
  background: #fff; border-radius: 8px; box-shadow: 0 6px 16px rgba(0,0,0,.12);
  border: 1px solid var(--border); max-height: 220px; overflow-y: auto; display: none;
}
.autocomplete .ac-panel.show { display: block; }
.ac-opt { padding: 8px 14px; font-size: 13px; color: var(--text-2); cursor: pointer; }
.ac-opt:hover { background: var(--brand-weak); color: var(--brand); }
.ac-opt .hl { color: var(--brand); font-weight: 600; }
.ac-empty { padding: 12px 14px; font-size: 13px; color: var(--text-3); }

/* ===== 列表多选框 ===== */
.cb-col { width: 40px; text-align: center; }
.cb-col input[type="checkbox"] { width: 15px; height: 15px; cursor: pointer; accent-color: var(--brand); }

/* ===== 下拉多选（高仿 antd Select multiple） ===== */
.ms-wrap { position: relative; }
.ms-box {
  min-height: 32px; width: 180px; padding: 2px 28px 2px 6px;
  border: 1px solid #d9d9d9; border-radius: 6px; background: #fff; cursor: pointer;
  display: flex; align-items: center; flex-wrap: wrap; gap: 3px; transition: all .2s;
  position: relative;
}
.ms-box:hover { border-color: var(--brand); }
.ms-box.open { border-color: var(--brand); box-shadow: 0 0 0 2px rgba(255,46,99,.1); }
.ms-placeholder { color: #bfbfbf; font-size: 14px; padding: 0 5px; }
.ms-tag {
  display: inline-flex; align-items: center; height: 24px; padding: 0 6px;
  background: #fafafa; border: 1px solid #d9d9d9; border-radius: 4px;
  font-size: 12px; color: var(--text-2); margin: 1px 0;
}
.ms-tag .ms-x { margin-left: 4px; color: #999; cursor: pointer; font-size: 12px; line-height: 1; }
.ms-tag .ms-x:hover { color: var(--brand); }
.ms-tag.more { background: #fff; border-style: dashed; color: var(--text-3); }
.ms-arrow { position: absolute; right: 9px; top: 50%; transform: translateY(-50%); color: #bfbfbf; pointer-events: none; transition: transform .2s; display: flex; }
.ms-box.open .ms-arrow { transform: translateY(-50%) rotate(180deg); }
.ms-panel {
  position: absolute; top: calc(100% + 4px); left: 0; z-index: 60; width: 100%;
  background: #fff; border-radius: 8px; box-shadow: 0 6px 16px rgba(0,0,0,.12);
  padding: 4px; display: none; max-height: 260px; overflow-y: auto;
}
.ms-panel.show { display: block; }
.ms-opt {
  display: flex; align-items: center; gap: 8px; padding: 7px 10px;
  border-radius: 4px; font-size: 14px; cursor: pointer; color: var(--text-2); transition: background .15s;
}
.ms-opt:hover { background: #f5f5f5; }
.ms-opt .opt-check { width: 16px; text-align: center; color: var(--brand); font-weight: 700; visibility: hidden; }
.ms-opt.checked .opt-check { visibility: visible; }
.ms-opt.checked { color: var(--brand); font-weight: 600; }

/* 操作列表头居中 */
.th-op { text-align: center; }

/* 响应式 */
@media (max-width: 900px) {
  .sidebar { display: none; }
  .stat-grid { grid-template-columns: repeat(2, 1fr); }
}
</style>
<style>
  .page-tabs { display: flex; gap: 0; border-bottom: 1px solid var(--border); margin-bottom: 20px; }
  .page-tab { padding: 10px 20px; font-size: 14px; color: var(--text-3); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; transition: all .15s; }

// ============================================================
// 通用时间范围选择器（精确到秒 / 精确到日），C 端、B 端共用
// 用法：var p = createRangePicker('wrapId', { dateOnly:false });
//   p.get() 返回 {start,end}；p.reset() 清空
// ============================================================
function dateStr(d) {
  function p(n) { return (n < 10 ? '0' : '') + n; }
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
}

var RP_PRESETS = [
  { label: '今日', get: function () { var d = new Date(); return [dateStr(d), dateStr(d)]; } },
  { label: '昨日', get: function () { var d = new Date(); d.setDate(d.getDate() - 1); return [dateStr(d), dateStr(d)]; } },
  { label: '本周', get: function () { var s = new Date(); s.setDate(s.getDate() - s.getDay()); var e = new Date(s); e.setDate(e.getDate() + 6); return [dateStr(s), dateStr(e)]; } },
  { label: '本月', get: function () { var s = new Date(); s.setDate(1); var e = new Date(s.getFullYear(), s.getMonth() + 1, 0); return [dateStr(s), dateStr(e)]; } },
  { label: '今年', get: function () { var s = new Date(); s.setMonth(0, 1); var e = new Date(s.getFullYear(), 11, 31); return [dateStr(s), dateStr(e)]; } }
];

var _rpRegistry = {};

function createRangePicker(wrapId, opts) {
  opts = opts || {};
  var dateOnly = !!opts.dateOnly;
  var self = {
    wrapId: wrapId, dateOnly: dateOnly,
    start: null, end: null, focusCal: 'start',
    calStartDate: new Date(), calEndDate: new Date()
  };
  _rpRegistry[wrapId] = self;

  self.render = function () {
    var ph = dateOnly ? 'YYYY-MM-DD' : 'YYYY-MM-DD HH:mm:ss';
    document.getElementById(wrapId).innerHTML =
      '<div class="rp-box" id="' + wrapId + 'Box" onclick="rpToggle(\'' + wrapId + '\',event)">' +
        '<span class="rp-val ph" id="' + wrapId + 'StartVal">' + t('开始时间') + '</span>' +
        '<span class="rp-sep">→</span>' +
        '<span class="rp-val ph" id="' + wrapId + 'EndVal">' + t('结束时间') + '</span>' +
      '</div>' +
      '<div class="rp-panel" id="' + wrapId + 'Panel">' +
        '<div class="rp-presets" id="' + wrapId + 'Presets"></div>' +
        '<div class="rp-main">' +
          '<div class="rp-inputs">' +
            '<input type="text" id="' + wrapId + 'StartInput" placeholder="' + ph + '" readonly onclick="rpFocus(\'' + wrapId + '\',\'start\')">' +
            '<input type="text" id="' + wrapId + 'EndInput" placeholder="' + ph + '" readonly onclick="rpFocus(\'' + wrapId + '\',\'end\')">' +
          '</div>' +
          '<div class="rp-cal-wrap">' +
            '<div class="rp-cal" id="' + wrapId + 'CalStart"></div>' +
            '<div class="rp-cal" id="' + wrapId + 'CalEnd"></div>' +
          '</div>' +
        '</div>' +
      '</div>';
    self.renderPresets();
    self.renderCals();
    self.sync();
  };

  self.renderPresets = function () {
    var html = RP_PRESETS.map(function (p, i) {
      return '<div class="rp-preset" onclick="rpApplyPreset(\'' + wrapId + '\',' + i + ')">' + t(p.label) + '</div>';
    }).join('');
    document.getElementById(wrapId + 'Presets').innerHTML = html;
  };

  self.applyPreset = function (i) {
    var r = RP_PRESETS[i].get();
    self.start = dateOnly ? r[0] : r[0] + ' 00:00:00';
    self.end = dateOnly ? r[1] : r[1] + ' 23:59:59';
    self.sync();
  };

  self.togglePanel = function (e) {
    if (e) e.stopPropagation();
    var panel = document.getElementById(wrapId + 'Panel');
    var box = document.getElementById(wrapId + 'Box');
    var open = panel.classList.contains('show');
    panel.classList.toggle('show', !open);
    box.classList.toggle('open', !open);
    if (!open) self.renderCals();
  };

  self.sync = function () {
    document.getElementById(wrapId + 'StartInput').value = self.start || '';
    document.getElementById(wrapId + 'EndInput').value = self.end || '';
    var sv = document.getElementById(wrapId + 'StartVal');
    var ev = document.getElementById(wrapId + 'EndVal');
    if (self.start) { sv.textContent = self.start; sv.classList.remove('ph'); } else { sv.textContent = t('开始时间'); sv.classList.add('ph'); }
    if (self.end) { ev.textContent = self.end; ev.classList.remove('ph'); } else { ev.textContent = t('结束时间'); ev.classList.add('ph'); }
    self.renderCals();
  };

  self.renderCal = function (containerId, viewDate) {
    var y = viewDate.getFullYear(), m = viewDate.getMonth();
    var first = new Date(y, m, 1);
    var startDay = first.getDay();
    var daysInMonth = new Date(y, m + 1, 0).getDate();
    var daysInPrev = new Date(y, m, 0).getDate();
    var cells = [];
    for (var i = 0; i < 42; i++) {
      var dnum, cls = 'rp-day', dayObj;
      if (i < startDay) {
        dnum = daysInPrev - startDay + 1 + i; cls += ' other';
        dayObj = new Date(y, m - 1, dnum);
      } else if (i >= startDay + daysInMonth) {
        dnum = i - startDay - daysInMonth + 1; cls += ' other';
        dayObj = new Date(y, m + 1, dnum);
      } else {
        dnum = i - startDay + 1;
        dayObj = new Date(y, m, dnum);
      }
      var ds = dateStr(dayObj);
      if (self.start && ds === self.start.slice(0, 10)) cls += ' start';
      if (self.end && ds === self.end.slice(0, 10)) cls += ' end';
      if (self.start && self.end) {
        var sd = self.start.slice(0, 10), ed = self.end.slice(0, 10);
        if (ds > sd && ds < ed) cls += ' in-range';
      }
      cells.push('<div class="' + cls + '" onclick="rpPickDay(\'' + wrapId + '\',\'' + ds + '\')">' + dnum + '</div>');
    }
    var weekArr = isEnglish() ? ['Su','Mo','Tu','We','Th','Fr','Sa'] : ['日','一','二','三','四','五','六'];
    var weekHtml = weekArr.map(function (w) { return '<div>' + w + '</div>'; }).join('');
    var monthNames = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    var calTitle = isEnglish() ? (monthNames[m] + ' ' + y) : (y + ' 年 ' + (m + 1) + ' 月');
    document.getElementById(containerId).innerHTML =
      '<div class="rp-cal-head"><div class="rp-cal-title">' + calTitle + '</div>' +
      '<div class="rp-nav"><button onclick="rpNavCal(\'' + wrapId + '\',\'' + containerId + '\',-1,event)">‹</button><button onclick="rpNavCal(\'' + wrapId + '\',\'' + containerId + '\',1,event)">›</button></div></div>' +
      '<div class="rp-week">' + weekHtml + '</div>' +
      '<div class="rp-grid">' + cells.join('') + '</div>';
  };

  self.renderCals = function () {
    self.renderCal(wrapId + 'CalStart', self.calStartDate);
    self.renderCal(wrapId + 'CalEnd', self.calEndDate);
  };

  self.navCal = function (cid, delta) {
    if (cid === wrapId + 'CalStart') self.calStartDate.setMonth(self.calStartDate.getMonth() + delta);
    else self.calEndDate.setMonth(self.calEndDate.getMonth() + delta);
    self.renderCals();
  };

  self.pickDay = function (ds) {
    if (self.focusCal === 'start') {
      self.start = dateOnly ? ds : ds + ' 00:00:00';
      self.focusCal = 'end';
    } else {
      self.end = dateOnly ? ds : ds + ' 23:59:59';
      self.focusCal = 'start';
    }
    if (self.start && self.end && self.start > self.end) {
      var t2 = self.start; self.start = self.end; self.end = t2;
    }
    self.sync();
  };

  self.reset = function () { self.start = null; self.end = null; self.sync(); };
  self.get = function () { return { start: self.start, end: self.end }; };

  self.render();
  return self;
}

function rpNavCal(id, cid, delta, e) { e.stopPropagation(); _rpRegistry[id].navCal(cid, delta); }

function renderSidebar(active) {
  var items = [
    { key: 'workbench', label: t('工作台'), href: 'workbench.html' },
    { key: 'works',     label: t('作品管理'), sub: [{ key: 'works', label: t('成品剧'), href: 'works.html' }] },

        { key: 'settlement', label: t('结算单'),   href: 'settlement.html' }
      ] }
  ];
  var html = '<div class="sidebar">';
  items.forEach(function (it) {
    // 判断该目录是否包含当前 active 的子项
    var childActiveKey = null;
    if (it.sub) {
      it.sub.forEach(function (s) { if (s.key === active) childActiveKey = s.key; });
    }
    var isGroup = !!it.sub && it.sub.length;
    var isGroupOpen = childActiveKey !== null;

// 联想输入单选：acInput(inputId, panelId, hiddenId, options, emptyText)
// options 为字符串数组；点击选项写入 input 显示值 + hidden 存值
function acInput(inputId, panelId, hiddenId, options, emptyText) {
  var input = document.getElementById(inputId);
  var panel = document.getElementById(panelId);
  var kw = input.value.trim();
  var matches = options.filter(function (o) { return o.indexOf(kw) !== -1; });

  if (matches.length === 0) {
    panel.innerHTML = '<div class="ac-empty">' + (emptyText || '无匹配项') + '</div>';
  } else {
    panel.innerHTML = matches.map(function (o) {
      var idx = o.indexOf(kw);
      var label = kw ? o.slice(0, idx) + '<span class="hl">' + o.slice(idx, idx + kw.length) + '</span>' + o.slice(idx + kw.length) : o;
      return '<div class="ac-opt" onclick="acSelect(\'' + inputId + '\',\'' + panelId + '\',\'' + hiddenId + '\',\'' + o + '\')">' + label + '</div>';
    }).join('');
  }

  var rect = input.getBoundingClientRect();
  panel.style.left = rect.left + 'px';
  panel.style.top = (rect.bottom + 4) + 'px';
  panel.style.width = rect.width + 'px';
  panel.classList.add('show');
}
function acSelect(inputId, panelId, hiddenId, value) {
  document.getElementById(inputId).value = value;
  document.getElementById(hiddenId).value = value;
  document.getElementById(panelId).classList.remove('show');
}

// 下拉多选渲染：renderMsMulti(options, selected, contentId, panelId, toggleFn, removeFn, placeholder)
function renderMsMulti(options, selected, contentId, panelId, toggleFn, removeFn, placeholder) {
  var c = document.getElementById(contentId);
  var MAX_TAGS = 2;
  if (selected.length === 0) {
    c.innerHTML = '<span class="ms-placeholder">' + (placeholder || '全部') + '</span>';
  } else {
    var html = '';
    var shown = selected.slice(0, MAX_TAGS);
    shown.forEach(function (k) {
      var label = labelOfOpt(options, k);
      html += '<span class="ms-tag">' + label + '<span class="ms-x" onclick="' + removeFn + '(\'' + escQ(k) + '\', event)">×</span></span>';
    });
    if (selected.length > MAX_TAGS) html += '<span class="ms-tag more">+ ' + (selected.length - MAX_TAGS) + '</span>';
    c.innerHTML = html;
  }
  var panel = document.getElementById(panelId);
  panel.innerHTML = options.map(function (s) {
    var key = s.key !== undefined ? s.key : s;
    var label = s.label !== undefined ? s.label : s;
    var checked = selected.indexOf(key) !== -1;
    return '<div class="ms-opt' + (checked ? ' checked' : '') + '" onclick="' + toggleFn + '(\'' + escQ(key) + '\', event)">' +
      '<span class="opt-check">✓</span>' + label + '</div>';
  }).join('');
}
function labelOfOpt(options, k) {
  var o = options.find(function (x) { return (x.key !== undefined ? x.key : x) === k; });
  if (!o) return k;
  return o.label !== undefined ? o.label : o;
}
function escQ(s) { return String(s).replace(/\\/g, '\\\\').replace(/'/g, "\\'"); }
function toggleMsPanel(panelId, boxId, e) {
  e.stopPropagation();
  var panel = document.getElementById(panelId);
  var box = document.getElementById(boxId);
  var open = panel.classList.contains('show');
  panel.classList.toggle('show', !open);
  box.classList.toggle('open', !open);
}
function toggleInArr(arr, k) {
  var i = arr.indexOf(k);
  if (i === -1) arr.push(k); else arr.splice(i, 1);
}

// 可搜索多选：内容区显示 tag，面板含搜索框 + 过滤选项
// searchMultiRender(contentId, panelId, searchInputId, options, selected, toggleFn, removeFn, placeholder)
function searchMultiRender(contentId, panelId, searchInputId, options, selected, toggleFn, removeFn, placeholder) {
  var c = document.getElementById(contentId);
  var MAX_TAGS = 3;
  if (selected.length === 0) {
    c.innerHTML = '<span class="ms-placeholder">' + (placeholder || '请选择') + '</span>';
  } else {
    var html = '';
    var shown = selected.slice(0, MAX_TAGS);
    shown.forEach(function (k) {
      html += '<span class="ms-tag">' + labelOfOpt(options, k) + '<span class="ms-x" onclick="' + removeFn + '(\'' + escQ(k) + '\', event)">×</span></span>';
    });
    if (selected.length > MAX_TAGS) html += '<span class="ms-tag more">+ ' + (selected.length - MAX_TAGS) + '</span>';
    c.innerHTML = html;
  }
  searchMultiFilter(panelId, searchInputId, options, selected, toggleFn);
}
function searchMultiFilter(panelId, searchInputId, options, selected, toggleFn) {
  var panel = document.getElementById(panelId);
  var kw = (document.getElementById(searchInputId).value || '').trim().toLowerCase();
  var list = options.filter(function (o) {
    var label = (o.label !== undefined ? o.label : o).toLowerCase();
    var key = String(o.key !== undefined ? o.key : o).toLowerCase();
    return !kw || label.indexOf(kw) !== -1 || key.indexOf(kw) !== -1;
  });
  panel.innerHTML = list.map(function (s) {
    var key = s.key !== undefined ? s.key : s;
    var label = s.label !== undefined ? s.label : s;
    var checked = selected.indexOf(key) !== -1;
    return '<div class="ms-opt' + (checked ? ' checked' : '') + '" onclick="' + toggleFn + '(\'' + escQ(key) + '\', event)">' +
      '<span class="opt-check">✓</span>' + label + '</div>';
  }).join('');
  if (list.length === 0) panel.innerHTML = '<div class="ac-empty">无匹配项</div>';
}

  SETTLEMENTS.forEach(function (s) {
    s.items.forEach(function (it) {
      it.initShareAmount = it.shareAmount;

      if (it.adjustTax == null) it.adjustTax = it.tax;

  function findSettle(no) { return SETTLEMENTS.find(function (x) { return x.no === no; }); }
  function sumShare(s) { return s.items.reduce(function (a, it) { return a + it.shareAmount; }, 0); }
  function sumTax(s) { return s.items.reduce(function (a, it) { return a + it.tax; }, 0); }
  function sumAdjustShare(s) { return s.items.reduce(function (a, it) { return a + it.adjustShare; }, 0); }
  function sumAdjustTax(s) { return s.items.reduce(function (a, it) { return a + it.adjustTax; }, 0); }
  function settleUsd(s) { return s.items.reduce(function (a, it) { return a + it.adjustShare - it.adjustTax; }, 0); }
  function settleCny(s) { return settleUsd(s) * s.rate; }
  function isSettleReview(s) { return s.status === 'pending' || s.status === 'disputed'; }
  function isPayReview(s) { return s.status === 'paying'; }

  // ========== 过滤 ==========
  function inPeriod(s, day) {
    if (!day) return true;
    var parts = s.period.split('-');
    var start = parts[0].trim();
    var end = parts.length > 1 ? parts[1].trim() : start;
    var d = day.replace(/[./]/g, '-');
    var st = start.replace(/\./g, '-');
    var en = end.replace(/\./g, '-');
    return d >= st && d <= en;
  }
  function filtered() {
    var no = document.getElementById('searchNo').value.trim();
    var period = document.getElementById('searchPeriod').value.trim();
    var subject = document.getElementById('searchSubject').value.trim();
    var reviewer = document.getElementById('searchReviewerHidden') ? document.getElementById('searchReviewerHidden').value : '';
    return SETTLEMENTS.filter(function (s) {
      if (selectedStatus.length > 0 && selectedStatus.indexOf(s.status) === -1) return false;
      if (reviewer && s.owner !== reviewer && s.payOwner !== reviewer) return false;
      if (no && s.no.indexOf(no) === -1) return false;
      if (period && !inPeriod(s, period)) return false;
      if (subject && s.subjectName.indexOf(subject) === -1) return false;
      if (selectedAccount.length > 0 && selectedAccount.indexOf(s.accountName) === -1) return false;
      return true;
    });
  }
  function resetSearch() {
    document.getElementById('searchNo').value = '';
    document.getElementById('searchPeriod').value = '';
    document.getElementById('searchSubject').value = '';
    if (document.getElementById('searchReviewer')) document.getElementById('searchReviewer').value = '';
    if (document.getElementById('searchReviewerHidden')) document.getElementById('searchReviewerHidden').value = '';
    selectedStatus = []; selectedAccount = [];
    document.getElementById('accountSearch').value = ''; accountFilter = '';
    selected = [];
    renderStatus(); renderAccount();
    renderList();
  }

    var val = name
      ? name + '　<span class="op-link" onclick="viewFile(\'' + name + '\')">查看</span>'
      : '<span class="text-3">未上传</span>';
    return '<div class="desc-row"><div class="desc-label">' + label + '</div><div class="desc-value">' + val + '</div></div>';
  }
  function viewFile(name) { showToast('演示：预览附件「' + name + '」', 'ok'); }
  function renderSettleDoc(s) {
    var html = '';
    html += '<div class="settle-title">结算对账单</div>';
    html += '<div class="group-title">收款方信息</div>';
    html += fieldRow('收款方', s.subjectName);
    html += fieldRow('付款方', '杭州织光映画科技有限公司');
    html += fieldRow('联系人', s.contact);
    html += fieldRow('联系方式', s.contactPhone);
    html += fieldRow('通信地址', s.address);

    html += '<div class="group-title">结算内容</div>';
    html += '<div class="settle-scroll"><table class="table settle-table"><thead><tr>' +
      '<th style="width:170px">结算周期</th><th style="width:130px">短剧名称</th><th style="width:130px">系统分成金额(美元)</th><th style="width:130px">系统应减税额(美元)</th><th style="width:130px">调整分成金额(美元)</th><th style="width:130px">调整应减税额(美元)</th><th style="width:130px">实际结算金额(美元)</th><th style="width:140px">实际结算金额(人民币)</th>' +
      '</tr></thead><tbody>';
    s.items.forEach(function (it) {
      html += '<tr>' +
        '<td class="mono">' + s.period + '</td>' +
        '<td>' + it.workName + '</td>' +
        '<td class="mono">' + fmtUsd(it.shareAmount) + '</td>' +
        '<td class="mono">' + fmtUsd(it.tax) + '</td>' +
        '<td class="mono">' + fmtUsd(it.adjustShare) + '</td>' +
        '<td class="mono">' + fmtUsd(it.adjustTax) + '</td>' +
        '<td class="mono">' + fmtUsd(it.adjustShare - it.adjustTax) + '</td>' +
        '<td class="mono">' + fmtCny((it.adjustShare - it.adjustTax) * s.rate) + '</td>' +
      '</tr>';
    });
    html += '</tbody></table></div>';
    html += '<div class="settle-total">实际应付金额总计（美元）：<span class="mono">' + fmtUsd(settleUsd(s)) + '</span>　汇率：<span class="mono">' + s.rate.toFixed(2) + '</span>　实际应付金额总计（人民币）：<span class="mono">' + fmtCny(settleCny(s)) + '</span></div>';

    html += '<div class="group-title">收款信息</div>';
    html += fieldRow('收款名称', s.subjectName);
    html += fieldRow('银行账号', s.bankAccount);
    html += fieldRow('开户银行', s.bankName);

    html += '<div class="group-title">发票信息</div>';
    html += fieldRow('发票类型', s.invoiceType);
    html += fieldRow('税率', s.taxRate);
    html += fieldRow('开票内容', s.invoiceContent);
    html += '<div class="group-title">上传附件</div>';
    html += fileField('签字/盖章结算单', s.stampFile);
    html += fileField('发票附件', s.invoiceFile);
    return html;
  }

  // ========== 详情（底部按钮按状态） ==========
  function viewDetail(no) {
    var s = findSettle(no);
    currentNo = no;
    document.getElementById('detailBody').innerHTML = renderSettleDoc(s);
    var foot = '<button class="btn btn-outline" onclick="closeModal(\'detailModal\')">关闭</button>';
    if (s.status === 'pending' || s.status === 'disputed') {
      foot += '<button class="btn btn-primary" onclick="pushFromDetail()">推送</button>';
      foot += '<button class="btn btn-outline" onclick="editFromDetail()">编辑</button>';
    } else if (s.status === 'paying') {
      foot += '<button class="btn btn-danger" onclick="payReturnFromDetail()">退回</button>';
      foot += '<button class="btn btn-primary" onclick="markPaidFromDetail()">已打款</button>';
    }
    document.getElementById('detailFoot').innerHTML = foot;
    openModal('detailModal');
  }
  function pushFromDetail() {
    var s = findSettle(currentNo);
    s.status = 'confirming';
    pushLog(s, '财务推送', CURRENT_OPERATOR);
    closeModal('detailModal');
    renderList();
    showToast('已推送至用户确认', 'ok');
  }
  function payReturnFromDetail() {
    var no = currentNo;
    closeModal('detailModal');
    openPayReturn(no);
  }
  function editFromDetail() {
    var no = currentNo;
    closeModal('detailModal');
    openEdit(no);
  }
  function markPaidFromDetail() {
    var s = findSettle(currentNo);
    s.status = 'paid';
    pushLog(s, '财务打款', s.payOwner || PAY_OPERATOR);
    closeModal('detailModal');
    renderList();
    showToast('已标记为已打款', 'ok');
  }

  // ========== 编辑（含批量重置） ==========
  function openEdit(no) {
    curNo = no;
    editSelected = [];
    var s = findSettle(no);
    var html = '<div class="edit-head-row"><div class="edit-head">' + s.no + ' · ' + s.period + ' · ' + s.subjectName + '　汇率：' + s.rate.toFixed(2) + '</div>' +
      '<button class="btn btn-outline btn-sm" onclick="batchReset()">批量重置</button></div>';
    html += '<div class="settle-scroll"><table class="table settle-table"><thead><tr>' +
      '<th style="width:40px">选择</th>' +
      '<th style="width:130px">短剧名称</th>' +
      '<th style="width:130px">系统分成金额(美元)</th>' +
      '<th style="width:130px">系统应减税额(美元)</th>' +
      '<th style="width:130px">调整分成金额(美元)</th>' +
      '<th style="width:130px">调整应减税额(美元)</th>' +
      '<th style="width:130px">实际结算金额(美元)</th>' +
      '<th style="width:140px">实际结算金额(人民币)</th>' +
      '</tr></thead><tbody>';
    s.items.forEach(function (it, idx) {
      var checked = editSelected.indexOf(idx) !== -1;
      html += '<tr>' +
        '<td><input type="checkbox" ' + (checked ? 'checked' : '') + ' onchange="toggleEditSelect(' + idx + ')"></td>' +
        '<td>' + it.workName + '</td>' +
        '<td class="mono">' + fmtUsd(it.shareAmount) + '</td>' +
        '<td class="mono">' + fmtUsd(it.tax) + '</td>' +
        '<td><input class="ant-input edit-input" type="number" step="0.01" data-idx="' + idx + '" data-field="adjustShare" value="' + it.adjustShare + '" oninput="recalcEdit()"></td>' +
        '<td><input class="ant-input edit-input" type="number" step="0.01" data-idx="' + idx + '" data-field="adjustTax" value="' + it.adjustTax + '" oninput="recalcEdit()"></td>' +
        '<td class="mono" data-row="' + idx + '"></td>' +
        '<td class="mono" data-rowcny="' + idx + '"></td>' +
      '</tr>';
    });
    html += '</tbody></table></div>';
    html += '<div class="settle-total">实际应付金额总计（美元）：<span class="mono" id="editTotalUsd"></span>　汇率：<span class="mono">' + s.rate.toFixed(2) + '</span>　实际应付金额总计（人民币）：<span class="mono" id="editTotalCny"></span></div>';
    document.getElementById('editBody').innerHTML = html;
    recalcEdit();
    openModal('editModal');
  }

  function toggleEditSelect(idx) {
    var i = editSelected.indexOf(idx);
    if (i === -1) editSelected.push(idx); else editSelected.splice(i, 1);
  }

  function batchReset() {
    var s = findSettle(curNo);
    if (!editSelected.length) { showToast('请先选择要重置的明细', 'err'); return; }
    editSelected.forEach(function (idx) {
      var it = s.items[idx];
      if (it) {
        it.adjustShare = it.shareAmount;
        it.adjustTax = it.tax;
      }
    });
    closeModal('editModal');
    openEdit(curNo);
    showToast('已重置所选明细为系统数据', 'ok');
  }

  function recalcEdit() {
    var inputs = document.querySelectorAll('#editBody .edit-input');
    var rows = {};
    inputs.forEach(function (inp) {
      var idx = inp.getAttribute('data-idx');
      var field = inp.getAttribute('data-field');
      if (!rows[idx]) rows[idx] = { adjustShare: 0, adjustTax: 0 };
      rows[idx][field] = parseFloat(inp.value) || 0;
    });
    var totalUsd = 0;
    Object.keys(rows).forEach(function (idx) {
      var r = rows[idx];
      var usd = r.adjustShare - r.adjustTax;
      totalUsd += usd;
      var cell = document.querySelector('#editBody [data-row="' + idx + '"]');
      var cellCny = document.querySelector('#editBody [data-rowcny="' + idx + '"]');
      if (cell) cell.textContent = fmtUsd(usd);
      if (cellCny) cellCny.textContent = fmtCny(usd * findSettle(curNo).rate);
    });
    document.getElementById('editTotalUsd').textContent = fmtUsd(totalUsd);
    document.getElementById('editTotalCny').textContent = fmtCny(totalUsd * findSettle(curNo).rate);
  }

  function saveEdit() {
    var s = findSettle(curNo);
    document.querySelectorAll('#editBody .edit-input').forEach(function (inp) {
      var idx = inp.getAttribute('data-idx');
      var field = inp.getAttribute('data-field');
      s.items[idx][field] = parseFloat(inp.value) || 0;
    });
    // 实际结算金额 = 调整分成金额 - 调整应减税额；系统值保持不变
    var snapshot = s.items.map(function (it) { return { workName: it.workName, shareAmount: it.shareAmount, tax: it.tax, adjustShare: it.adjustShare, adjustTax: it.adjustTax }; });
    pushLog(s, '财务修改', CURRENT_OPERATOR, { items: snapshot });
    closeModal('editModal');
    renderList();
    showToast('结算单已保存', 'ok');
  }

  // ========== 单条领取 ==========
  function claimOne(no) {
    var s = findSettle(no);
    if (!s) return;
    if (s.status === 'paying') { s.payOwner = PAY_OPERATOR; pushLog(s, '打款认领', PAY_OPERATOR); }
    else { s.owner = CURRENT_OPERATOR; pushLog(s, '财务认领', CURRENT_OPERATOR); }
    renderList();
    showToast('已领取', 'ok');
  }

  // ========== 结算单 PDF 下载（demo 模拟） ==========
  function downloadSettle(no) {
    var s = findSettle(no);
    if (!s) return;
    showToast('已生成并下载结算单 PDF：' + s.no, 'ok');
  }

  // ========== 查看原因（数据异议 / 附件重传） ==========
  function viewReason(no) {
    var s = findSettle(no);
    showToast(s.returnReason || s.rejectReason || '—', 'err');
  }

  // ========== 退回（paying -> payRejected 附件重传） ==========
  function openReturn(no) {
    currentReturnIds = [no];
    document.getElementById('returnNo').textContent = no;
    document.getElementById('returnReason').value = '';
    openModal('returnModal');
  }
  function openPayReturn(no) { openReturn(no); }
  function submitReturn() {
    var reason = document.getElementById('returnReason').value.trim();
    currentReturnIds.forEach(function (no) {
      var s = findSettle(no);
      if (!s) return;
      s.status = 'payRejected';
      s.rejectReason = reason;
      pushLog(s, '退回', s.payOwner || PAY_OPERATOR, { reason: reason });
    });
    closeModal('returnModal');
    selected = [];
    renderList();
    showToast('已退回，用户需重新提交', 'ok');
  }

  // ========== 操作记录 ==========
  function viewLog(no) {
    var s = findSettle(no);
    if (!s) return;
    var html = '<div class="log-list">';
    (s.logs || []).forEach(function (log) {
      html += '<div class="log-item">';
      html += '<div class="log-head"><span class="log-action">' + log.action + '</span><span class="log-time">' + log.time + '</span></div>';
      html += '<div class="log-meta">操作人：' + log.operator + '</div>';
      if (log.reason) html += '<div class="log-reason">退回原因：' + log.reason + '</div>';
      if (log.items) {
        html += '<div class="settle-scroll" style="margin-top:8px"><table class="table settle-table"><thead><tr>' +
          '<th style="width:150px">短剧名称</th><th style="width:130px">系统分成金额(美元)</th><th style="width:130px">系统应减税额(美元)</th><th style="width:130px">调整分成金额(美元)</th><th style="width:130px">调整应减税额(美元)</th>' +
          '</tr></thead><tbody>';
        log.items.forEach(function (it) {
          html += '<tr><td>' + it.workName + '</td><td class="mono">' + fmtUsd(it.shareAmount) + '</td><td class="mono">' + fmtUsd(it.tax) + '</td><td class="mono">' + fmtUsd(it.adjustShare != null ? it.adjustShare : it.shareAmount) + '</td><td class="mono">' + fmtUsd(it.adjustTax != null ? it.adjustTax : it.tax) + '</td></tr>';
        });
        html += '</tbody></table></div>';
      }
      html += '</div>';
    });
    html += '</div>';
    document.getElementById('logBody').innerHTML = html;
    openModal('logModal');
  }

  // ========== 批量操作 ==========
  function batchClaim() {
    var list = selectedSettles();
    if (!list.length) { showToast('请先选择要操作的数据', 'err'); return; }
    var n = 0;
    list.forEach(function (s) {
      if (s.status === 'paying') {
        if (!s.payOwner) { s.payOwner = PAY_OPERATOR; pushLog(s, '打款认领', PAY_OPERATOR); n++; }
      } else if (s.status === 'pending' || s.status === 'disputed') {
        if (!s.owner) { s.owner = CURRENT_OPERATOR; pushLog(s, '财务认领', CURRENT_OPERATOR); n++; }
      }
    });
    selected = [];
    renderList();
    showToast(n ? '已领取 ' + n + ' 项' : '所选数据无可领取项', n ? 'ok' : 'err');
  }
  function batchPush() {
    var list = selectedSettles().filter(function (s) { return s.status === 'pending' || s.status === 'disputed'; });
    if (!list.length) { showToast('请选择待审核或数据异议状态的结算单', 'err'); return; }
    list.forEach(function (s) { s.status = 'confirming'; pushLog(s, '财务推送', CURRENT_OPERATOR); });
    selected = [];
    renderList();
    showToast('已推送至用户确认', 'ok');
  }
  function batchPayReturn() {
    var list = selectedSettles().filter(function (s) { return s.status === 'paying'; });
    if (!list.length) { showToast('请选择待打款状态的结算单', 'err'); return; }
    currentReturnIds = list.map(function (s) { return s.no; });
    document.getElementById('returnNo').textContent = '已选 ' + currentReturnIds.length + ' 个结算单';
    openModal('returnModal');
  }
  function batchMarkPaid() {
    var list = selectedSettles().filter(function (s) { return s.status === 'paying'; });
    if (!list.length) { showToast('请选择待打款状态的结算单', 'err'); return; }
    list.forEach(function (s) { s.status = 'paid'; pushLog(s, '财务打款', s.payOwner || PAY_OPERATOR); });
    selected = [];
    renderList();
    showToast('已标记为已打款', 'ok');
  }

  // ========== 初始化 ==========
  function initView() {
    document.getElementById('statusWrap').style.display = 'flex';
    document.getElementById('reviewerWrap').style.display = 'flex';
    document.getElementById('pageTitle').textContent = '全部结算单';
    document.getElementById('pageDesc').textContent = '查看平台所有结算单';
    document.getElementById('sidebar-root').innerHTML = renderSidebar('settlement');
  }

  initView();
  renderStatus();
  renderAccount();
  renderList();

  applyI18n();
</script>
</body>
</html>
