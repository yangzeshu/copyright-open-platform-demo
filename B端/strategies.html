<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>分成策略 · 版权开放平台</title>
<style>/* ============================================================
   版权开放平台 · 公共样式 common.css
   品牌主色：粉红 #ff2e63，浅色背景，卡片式布局
   C 端与 B 端共享
   ============================================================ */

:root {
  --brand: #ff2e63;
  --brand-dark: #e0244f;
  --brand-light: #fff0f4;
  --brand-weak: rgba(255, 46, 99, 0.06);
  --brand-grad: linear-gradient(135deg, #ff5c8a 0%, #ff2e63 100%);

  --bg: #f7f8fa;
  --fill-1: #f7f8fa;
  --fill-2: #eef0f3;
  --card: #ffffff;
  --border: #eef0f3;
  --border-strong: #e2e5ea;

  --text: #1f2329;
  --text-2: #51565d;
  --text-3: #8a9199;
  --text-invert: #ffffff;

  --ok: #16b364;
  --warn: #f0a020;
  --danger: #e5484d;
  --info: #3b82f6;

  --radius-card: 12px;
  --radius-btn: 8px;
  --radius-input: 8px;
  --shadow-card: 0 2px 12px rgba(20, 24, 30, 0.06);
  --shadow-pop: 0 8px 30px rgba(20, 24, 30, 0.14);

  --sidebar-w: 220px;
  --topbar-h: 64px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei",
    "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  color: var(--text);
  background: var(--bg);
  font-size: 14px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}

a { color: inherit; text-decoration: none; }
ul, ol { list-style: none; }
button { font-family: inherit; cursor: pointer; border: none; background: none; }
input, select, textarea { font-family: inherit; font-size: 14px; }

/* ---------- 通用布局 ---------- */
.container { max-width: 1200px; margin: 0 auto; padding: 0 24px; }

/* ---------- 顶部栏 ---------- */
.topbar {
  position: sticky; top: 0; z-index: 100;
  background: #fff;
  height: var(--topbar-h);
  border-bottom: 1px solid var(--border);
}
.topbar-inner {
  max-width: 1440px; margin: 0 auto; padding: 0 24px;
  height: 100%; display: flex; align-items: center; justify-content: space-between;
}
.topbar-left { display: flex; align-items: center; gap: 12px; }
.topbar-logo {
  width: 30px; height: 30px; border-radius: 8px;
  background: var(--brand-grad);
  display: flex; align-items: center; justify-content: center;
  color: #fff; font-weight: 700; font-size: 16px;
}
.topbar-title { font-size: 15px; font-weight: 600; }
.topbar-divider { width: 1px; height: 16px; background: var(--border-strong); }
.topbar-sub { font-size: 13px; color: var(--text-3); }
.topbar-switch { display: inline-flex; align-items: center; height: 26px; padding: 0 12px; font-size: 13px; color: var(--brand); border: 1px solid var(--brand); border-radius: 4px; cursor: pointer; text-decoration: none; margin-left: 2px; }
.topbar-switch:hover { background: var(--brand); color: #fff; }

.topbar-right { display: flex; align-items: center; gap: 20px; }
.topbar-icon {
  width: 20px; height: 20px; color: var(--text-2);
  position: relative; display: flex; align-items: center;
}
.topbar-icon .dot {
  position: absolute; top: -2px; right: -2px;
  width: 7px; height: 7px; border-radius: 50%; background: var(--brand);
  border: 1.5px solid #fff;
}
.topbar-user { display: flex; align-items: center; gap: 8px; cursor: pointer; }
.topbar-avatar {
  width: 28px; height: 28px; border-radius: 50%;
  background: var(--brand-grad); color: #fff;
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; font-weight: 600;
}
.topbar-name { font-size: 14px; color: var(--text); }
.topbar-caret { width: 14px; height: 14px; color: var(--text-3); }

/* ---------- 主体框架：侧边菜单 + 内容 ---------- */
.layout {
  display: flex; min-height: calc(100vh - var(--topbar-h));
  max-width: 1440px; margin: 0 auto;
}
.sidebar {
  width: var(--sidebar-w); flex-shrink: 0;
  padding: 20px 12px;
}
.sidebar-item {
  display: flex; align-items: center; gap: 10px;
  padding: 11px 14px; margin-bottom: 4px;
  border-radius: 8px; color: var(--text-2);
  font-size: 14px; cursor: pointer;
  transition: background .15s, color .15s;
}
.sidebar-item:hover { background: var(--fill-2); color: var(--text); }
.sidebar-item.active {
  background: var(--brand-weak); color: var(--brand); font-weight: 600;
}
.sidebar-item svg { width: 18px; height: 18px; flex-shrink: 0; }
.sidebar-item .arrow { margin-left: auto; width: 14px; height: 14px; transition: transform .2s; }

/* 目录分组：子菜单默认收起，展开后箭头旋转 */
.sidebar-group .sidebar-sub { display: none; padding-left: 28px; }
.sidebar-group.open .sidebar-sub { display: block; }
.sidebar-group.open .arrow { transform: rotate(180deg); }
.sidebar-sub .sidebar-item { padding: 9px 14px; font-size: 13px; }

.content {
  flex: 1; min-width: 0;
  padding: 24px 32px 48px;
}

/* ---------- 页面标题 ---------- */
.page-head { margin-bottom: 20px; }
.page-title { font-size: 20px; font-weight: 700; }
.page-desc { font-size: 13px; color: var(--text-3); margin-top: 4px; }

/* ---------- 卡片 ---------- */
.card {
  background: var(--card); border-radius: var(--radius-card);
  box-shadow: var(--shadow-card);
  padding: 24px;
  margin-bottom: 20px;
}
.card-title { font-size: 16px; font-weight: 600; margin-bottom: 16px; }
.card + .card { margin-top: 0; }

/* ---------- 按钮 ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  padding: 9px 20px; border-radius: var(--radius-btn);
  font-size: 14px; font-weight: 500; line-height: 1;
  transition: all .15s; white-space: nowrap;
}
.btn-primary { background: var(--brand); color: #fff; }
.btn-primary:hover { background: var(--brand-dark); }
.btn-outline { border: 1px solid var(--border-strong); color: var(--text-2); background: #fff; }
.btn-outline:hover { border-color: var(--brand); color: var(--brand); }
.btn-text { color: var(--brand); padding: 9px 12px; }
.btn-text:hover { background: var(--brand-weak); }
.btn-danger { background: var(--danger); color: #fff; }
.btn-danger:hover { opacity: .9; }
.btn-plain { background: var(--fill-2); color: var(--text-2); }
.btn-plain:hover { background: var(--border-strong); }
.btn-ghost { color: var(--brand); }
.btn-block { width: 100%; }
.btn-lg { padding: 12px 28px; font-size: 15px; }
.btn-sm { padding: 6px 14px; font-size: 13px; }
.btn:disabled { opacity: .5; cursor: not-allowed; }

/* ---------- 表单 ---------- */
.form-item { margin-bottom: 18px; }
.form-label { display: block; font-size: 13px; color: var(--text-2); margin-bottom: 7px; }
.form-label .req { color: var(--danger); margin-left: 2px; }
.form-input {
  width: 100%; padding: 10px 14px;
  border: 1px solid var(--border-strong); border-radius: var(--radius-input);
  background: #fff; color: var(--text); outline: none;
  transition: border .15s, box-shadow .15s;
}
.form-input:focus { border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-weak); }
.form-input::placeholder { color: var(--text-3); }
textarea.form-input { resize: vertical; min-height: 90px; }
.form-row { display: flex; gap: 12px; }
.form-row > * { flex: 1; }
.form-hint { font-size: 12px; color: var(--text-3); margin-top: 6px; }

/* 验证码输入 */
.code-wrap { display: flex; gap: 10px; }
.code-wrap .form-input { flex: 1; }
.code-btn {
  flex-shrink: 0; min-width: 110px; padding: 0 14px;
  border: 1px solid var(--border-strong); border-radius: var(--radius-input);
  color: var(--brand); font-size: 13px; background: #fff;
}
.code-btn:disabled { color: var(--text-3); cursor: not-allowed; }

/* ---------- 状态徽标 ---------- */
.tag {
  display: inline-flex; align-items: center;
  padding: 3px 10px; border-radius: 6px;
  font-size: 12px; font-weight: 500; line-height: 1.5;
}
.tag-gray { background: #f0f1f3; color: #6b7280; }
.tag-blue { background: #e8f1ff; color: #2f6bdc; }
.tag-red { background: #fdeaea; color: #d13a3f; }
.tag-orange { background: #fff3e0; color: #e8840a; }
.tag-green { background: #e6f7ef; color: #149a5a; }
.tag-pink { background: var(--brand-light); color: var(--brand); }
.tag-dark { background: #3a3f45; color: #fff; }

/* ---------- 表格 ---------- */
.table { width: 100%; border-collapse: collapse; }
.table th, .table td {
  text-align: center; padding: 13px 14px;
  border-bottom: 1px solid var(--border);
  font-size: 13px;
}
.table th { color: var(--text-3); font-weight: 500; background: #fafbfc; white-space: nowrap; }
.table tr:last-child td { border-bottom: none; }
.table tbody tr:hover { background: #fafbfc; }
.table .cell-title { color: var(--text); font-weight: 500; }

/* 表格固定列（水平滚动时锁定） */
.table th.sticky-l, .table td.sticky-l { position: sticky; left: 0; z-index: 2; background: #fff; }
.table th.sticky-l2, .table td.sticky-l2 { position: sticky; left: 40px; z-index: 2; background: #fff; }
.table th.sticky-r, .table td.sticky-r { position: sticky; right: 0; z-index: 2; background: #fff; }
.table th.sticky-l, .table th.sticky-l2, .table th.sticky-r { background: #fafbfc; z-index: 3; }
.table tbody tr:hover td.sticky-l,
.table tbody tr:hover td.sticky-l2,
.table tbody tr:hover td.sticky-r { background: #fafbfc; }
.table td.sticky-l2 { box-shadow: 2px 0 4px rgba(0,0,0,.06); }
.table td.sticky-r, .table th.sticky-r { box-shadow: -2px 0 4px rgba(0,0,0,.06); }

/* ---------- 弹窗 ---------- */
.modal-mask {
  position: fixed; inset: 0; z-index: 200;
  background: rgba(20, 24, 30, 0.45);
  display: none; align-items: center; justify-content: center;
}
.modal-mask.show { display: flex; }
.modal {
  background: #fff; border-radius: 14px; width: 460px; max-width: 92vw;
  max-height: 88vh; display: flex; flex-direction: column;
  box-shadow: var(--shadow-pop);
  animation: pop .18s ease;
}
.modal-head {
  padding: 24px 24px 0; flex-shrink: 0;
  display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px;
}
.modal-body {
  padding: 0 24px; overflow-y: auto; flex: 1;
}
.modal-foot {
  padding: 16px 24px 24px; flex-shrink: 0;
  display: flex; justify-content: flex-end; gap: 10px; margin-top: 22px;
}
.modal-lg { width: 620px; }
@keyframes pop { from { transform: scale(.96); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.modal-title { font-size: 16px; font-weight: 600; }
.modal-close { width: 20px; height: 20px; color: var(--text-3); cursor: pointer; }

/* ---------- 空状态 / 提示 ---------- */
.empty {
  text-align: center; padding: 48px 20px; color: var(--text-3);
}
.empty .empty-icon { font-size: 40px; margin-bottom: 12px; opacity: .5; }
.empty .empty-text { font-size: 14px; }

/* ---------- 提示条 ---------- */
.notice {
  display: flex; align-items: flex-start; gap: 10px;
  padding: 14px 16px; border-radius: 10px; font-size: 13px;
  margin-bottom: 16px;
}
.notice-info { background: #e8f1ff; color: #2f6bdc; }
.notice-warn { background: #fff3e0; color: #e8840a; }
.notice-success { background: #e6f7ef; color: #149a5a; }
.notice svg { width: 18px; height: 18px; flex-shrink: 0; margin-top: 1px; }

/* ---------- 步骤条 ---------- */
.steps { display: flex; align-items: center; margin-bottom: 24px; }
.step { display: flex; align-items: center; gap: 8px; }
.step-dot {
  width: 26px; height: 26px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; font-weight: 600;
  background: var(--fill-2); color: var(--text-3);
}
.step.active .step-dot { background: var(--brand); color: #fff; }
.step.done .step-dot { background: var(--ok); color: #fff; }
.step-label { font-size: 13px; color: var(--text-3); }
.step.active .step-label { color: var(--text); font-weight: 600; }
.step.done .step-label { color: var(--text-2); }
.step-line { flex: 1; height: 2px; background: var(--border-strong); margin: 0 12px; }
.step-line.done { background: var(--ok); }

/* ---------- 辅助 ---------- */
.row { display: flex; align-items: center; gap: 12px; }
.between { display: flex; align-items: center; justify-content: space-between; }
.mt-8 { margin-top: 8px; } .mt-16 { margin-top: 16px; } .mt-24 { margin-top: 24px; }
.mb-8 { margin-bottom: 8px; } .mb-16 { margin-bottom: 16px; } .mb-24 { margin-bottom: 24px; }
.text-3 { color: var(--text-3); } .text-2 { color: var(--text-2); }
.text-brand { color: var(--brand); } .text-ok { color: var(--ok); } .text-danger { color: var(--danger); }
.fs-12 { font-size: 12px; } .fs-13 { font-size: 13px; }
.mono { font-variant-numeric: tabular-nums; }

/* 统计卡 */
.stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 20px; }
.stat-card { background: #fff; border-radius: var(--radius-card); box-shadow: var(--shadow-card); padding: 20px 22px; }
.stat-label { font-size: 13px; color: var(--text-3); }
.stat-value { font-size: 26px; font-weight: 700; margin-top: 6px; font-variant-numeric: tabular-nums; }
.stat-value .unit { font-size: 14px; font-weight: 400; color: var(--text-3); margin-left: 2px; }
.stat-trend { font-size: 12px; margin-top: 4px; }

/* 用户下拉菜单 */
.user-menu {
  position: absolute; top: var(--topbar-h); right: 24px; z-index: 150;
  background: #fff; border-radius: 10px; box-shadow: var(--shadow-pop);
  min-width: 140px; padding: 6px; overflow: hidden;
}
.user-menu a, .user-menu .logout-link {
  display: block; padding: 9px 14px; border-radius: 6px;
  font-size: 13px; color: var(--text-2);
}
.user-menu a:hover, .user-menu .logout-link:hover { background: var(--brand-weak); color: var(--brand); }

/* toast */
#toast {
  position: fixed; top: 80px; left: 50%; transform: translateX(-50%);
  z-index: 300; background: #fff; color: var(--text);
  padding: 10px 20px; border-radius: 8px; box-shadow: var(--shadow-pop);
  font-size: 14px; display: none;
}
#toast.show { display: block; animation: pop .2s ease; }

/* ===== 时间范围（高仿 antd RangePicker，公共组件） ===== */
.rp-wrap { position: relative; }
.rp-box {
  height: 32px; width: 320px; padding: 4px 11px; border: 1px solid #d9d9d9;
  border-radius: 6px; background: #fff; display: flex; align-items: center; cursor: pointer; transition: all .2s;
}
.rp-box:hover { border-color: var(--brand); }
.rp-box.open { border-color: var(--brand); box-shadow: 0 0 0 2px rgba(255,46,99,.1); }
.rp-val { flex: 1; font-size: 14px; color: var(--text); text-align: center; font-variant-numeric: tabular-nums; }
.rp-val.ph { color: #bfbfbf; }
.rp-sep { margin: 0 6px; color: var(--text-3); font-size: 14px; }
.rp-panel {
  position: absolute; top: calc(100% + 4px); left: 0; z-index: 60;
  background: #fff; border-radius: 8px; box-shadow: 0 6px 16px rgba(0,0,0,.12);
  display: none; overflow: hidden; width: 560px;
}
.rp-panel.show { display: flex; }
.rp-presets { width: 130px; border-right: 1px solid var(--border); padding: 8px 0; flex-shrink: 0; }
.rp-preset { padding: 8px 14px; font-size: 13px; color: var(--text-2); cursor: pointer; }
.rp-preset:hover { background: var(--brand-weak); color: var(--brand); }
.rp-main { flex: 1; padding: 12px; display: flex; flex-direction: column; }
.rp-inputs { display: flex; gap: 8px; margin-bottom: 12px; }
.rp-inputs input { flex: 1; height: 30px; padding: 0 8px; border: 1px solid #d9d9d9; border-radius: 6px; font-size: 13px; }
.rp-inputs input:focus { border-color: var(--brand); outline: none; box-shadow: 0 0 0 2px rgba(255,46,99,.1); }
.rp-cal-wrap { display: flex; gap: 16px; }
.rp-cal { flex: 1; }
.rp-cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.rp-cal-title { font-size: 13px; font-weight: 600; }
.rp-nav { display: flex; gap: 4px; }
.rp-nav button { width: 22px; height: 22px; border: none; background: none; cursor: pointer; color: var(--text-3); border-radius: 4px; font-size: 12px; }
.rp-nav button:hover { background: #f5f5f5; color: var(--text); }
.rp-week { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; font-size: 11px; color: var(--text-3); margin-bottom: 4px; }
.rp-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
.rp-day {
  height: 26px; display: flex; align-items: center; justify-content: center;
  font-size: 12px; color: var(--text); cursor: pointer; border-radius: 4px;
}
.rp-day:hover { background: var(--brand-weak); }
.rp-day.other { color: #bfbfbf; }
.rp-day.in-range { background: rgba(255,46,99,.1); }
.rp-day.start, .rp-day.end { background: var(--brand); color: #fff; }
.rp-day.disabled { color: #d9d9d9; cursor: not-allowed; }

/* ===== 筛选区折叠项 ===== */
.filter-extra { margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--border); }

/* ===== 联想输入 ===== */
.autocomplete { position: relative; }
.autocomplete .ac-panel {
  position: fixed; z-index: 400;
  background: #fff; border-radius: 8px; box-shadow: 0 6px 16px rgba(0,0,0,.12);
  border: 1px solid var(--border); max-height: 220px; overflow-y: auto; display: none;
}
.autocomplete .ac-panel.show { display: block; }
.ac-opt { padding: 8px 14px; font-size: 13px; color: var(--text-2); cursor: pointer; }
.ac-opt:hover { background: var(--brand-weak); color: var(--brand); }
.ac-opt .hl { color: var(--brand); font-weight: 600; }
.ac-empty { padding: 12px 14px; font-size: 13px; color: var(--text-3); }

/* ===== 列表多选框 ===== */
.cb-col { width: 40px; text-align: center; }
.cb-col input[type="checkbox"] { width: 15px; height: 15px; cursor: pointer; accent-color: var(--brand); }

/* ===== 下拉多选（高仿 antd Select multiple） ===== */
.ms-wrap { position: relative; }
.ms-box {
  min-height: 32px; width: 180px; padding: 2px 28px 2px 6px;
  border: 1px solid #d9d9d9; border-radius: 6px; background: #fff; cursor: pointer;
  display: flex; align-items: center; flex-wrap: wrap; gap: 3px; transition: all .2s;
  position: relative;
}
.ms-box:hover { border-color: var(--brand); }
.ms-box.open { border-color: var(--brand); box-shadow: 0 0 0 2px rgba(255,46,99,.1); }
.ms-placeholder { color: #bfbfbf; font-size: 14px; padding: 0 5px; }
.ms-tag {
  display: inline-flex; align-items: center; height: 24px; padding: 0 6px;
  background: #fafafa; border: 1px solid #d9d9d9; border-radius: 4px;
  font-size: 12px; color: var(--text-2); margin: 1px 0;
}
.ms-tag .ms-x { margin-left: 4px; color: #999; cursor: pointer; font-size: 12px; line-height: 1; }
.ms-tag .ms-x:hover { color: var(--brand); }
.ms-tag.more { background: #fff; border-style: dashed; color: var(--text-3); }
.ms-arrow { position: absolute; right: 9px; top: 50%; transform: translateY(-50%); color: #bfbfbf; pointer-events: none; transition: transform .2s; display: flex; }
.ms-box.open .ms-arrow { transform: translateY(-50%) rotate(180deg); }
.ms-panel {
  position: absolute; top: calc(100% + 4px); left: 0; z-index: 60; width: 100%;
  background: #fff; border-radius: 8px; box-shadow: 0 6px 16px rgba(0,0,0,.12);
  padding: 4px; display: none; max-height: 260px; overflow-y: auto;
}
.ms-panel.show { display: block; }
.ms-opt {
  display: flex; align-items: center; gap: 8px; padding: 7px 10px;
  border-radius: 4px; font-size: 14px; cursor: pointer; color: var(--text-2); transition: background .15s;
}
.ms-opt:hover { background: #f5f5f5; }
.ms-opt .opt-check { width: 16px; text-align: center; color: var(--brand); font-weight: 700; visibility: hidden; }
.ms-opt.checked .opt-check { visibility: visible; }
.ms-opt.checked { color: var(--brand); font-weight: 600; }

/* 操作列表头居中 */
.th-op { text-align: center; }

/* 响应式 */
@media (max-width: 900px) {
  .sidebar { display: none; }
  .stat-grid { grid-template-columns: repeat(2, 1fr); }
}

  /* ===== 分成策略 ===== */
  #spTable { width: 100%; }

  .sp-field { margin-bottom: 16px; }
  .sp-label { display: block; font-size: 13px; color: var(--text-2); margin-bottom: 6px; }
  .sp-label .req { color: var(--danger); margin-left: 2px; }
  .sp-input {
    width: 100%; height: 34px; padding: 0 10px; border: 1px solid #d9d9d9; border-radius: 6px;
    font-size: 13px; color: var(--text); background: #fff; outline: none; box-sizing: border-box; font-family: inherit;
  }
  .sp-input:focus { border-color: var(--brand); }
  .sp-input:disabled, select.sp-input:disabled { background: #f4f5f7; color: var(--text-2); cursor: not-allowed; }
  .sp-count { text-align: right; font-size: 12px; color: var(--text-3); margin-top: 4px; }

  /* 多选下拉 */
  .ms-wrap { position: relative; }
  .ms-box {
    width: 100%; box-sizing: border-box; min-height: 34px; display: flex; align-items: center; gap: 4px; flex-wrap: wrap;
    padding: 4px 10px; border: 1px solid #d9d9d9; border-radius: 6px; background: #fff; cursor: pointer;
  }
  .ms-box:hover { border-color: var(--brand); }
  .ms-ph { color: #bfbfbf; font-size: 13px; }
  .ms-tag {
    display: inline-flex; align-items: center; height: 22px; padding: 0 6px;
    background: #fafafa; border: 1px solid #e2e5ea; border-radius: 4px; font-size: 12px; color: var(--text-2);
  }
  .ms-x { margin-left: 4px; color: #999; cursor: pointer; }
  .ms-x:hover { color: var(--brand); }
  .ms-panel {
    position: absolute; left: 0; right: 0; top: calc(100% + 4px); z-index: 60;
    background: #fff; border: 1px solid var(--border-strong); border-radius: 8px;
    box-shadow: 0 6px 16px rgba(0,0,0,.1); display: none; max-height: 220px; overflow: auto; padding: 4px 0;
  }
  .ms-panel.show { display: block; }
  .ms-opt { padding: 8px 12px; font-size: 13px; color: var(--text-2); cursor: pointer; display: flex; align-items: center; gap: 8px; }
  .ms-opt:hover { background: #fafbfc; }
  .ms-opt.checked { color: var(--brand); background: var(--brand-weak); }
  .ms-check { visibility: hidden; font-size: 12px; }
  .ms-opt.checked .ms-check { visibility: visible; }

  /* 分成模式编辑区 */
  .sp-mode-box { border: 1px solid var(--border); border-radius: 8px; padding: 14px; }
  .sp-mode-head { margin-bottom: 10px; }
  .sp-mode-chk { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; cursor: pointer; }
  .sp-mode-chk input { width: 16px; height: 16px; accent-color: #2f6bdc; }
  .sp-mode-tag { display: inline-block; font-size: 12px; padding: 1px 8px; border-radius: 4px; }
  .tag-iap { background: #e8f1ff; color: #2f6bdc; }
  .tag-iaa { background: var(--brand-light); color: var(--brand); }
  .sp-mode-body { display: none; padding-left: 2px; }
  .sp-divider { border-top: 1px dashed var(--border-strong); margin: 14px 0; }
  .sp-chk-row, .sp-sub-chans { display: flex; gap: 18px; flex-wrap: wrap; }
  .sp-chk-row label, .sp-sub-chans label { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; cursor: pointer; }
  .sp-chk-row input, .sp-sub-chans input { accent-color: #2f6bdc; cursor: pointer; }
  .sp-sub-chans { display: none; margin-top: 10px; padding-left: 2px; }
  .sp-ratio-wrap { display: flex; align-items: center; gap: 8px; }
  .sp-ratio-input { flex: 1; }
  .sp-ratio-unit { width: 34px; height: 34px; line-height: 32px; text-align: center; border: 1px solid #d9d9d9; border-radius: 6px; color: var(--text-3); font-size: 13px; }

  /* 列表里的分成模式卡片 */
  .sp-modes-cell { text-align: left; }
  .sp-mode-card { background: #f5f7fa; border: 1px solid #e8ebf0; border-radius: 8px; padding: 8px 10px; margin-bottom: 8px; }
  .sp-mode-card:last-child { margin-bottom: 0; }
  .sp-mode-card.card-iaa { background: var(--brand-light); border-color: #ffe0e8; }
  .sp-mode-top { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .sp-mode-name { font-size: 11px; color: var(--text-3); }
  .sp-way { font-size: 13px; color: var(--text); }
  .sp-chan { font-size: 12px; padding: 1px 8px; border-radius: 4px; background: #e8f1ff; color: #2f6bdc; }
  .card-iaa .sp-chan { background: #fff; color: var(--brand); }
  .sp-ratio { font-size: 13px; color: var(--text-2); margin-top: 4px; }

  .sp-status { display: inline-block; padding: 2px 10px; border-radius: 12px; font-size: 12px; cursor: pointer; user-select: none; white-space: nowrap; }
  .sp-status.on { background: #e8f8ee; color: #16a34a; }
  .sp-status.off { background: #f0f1f3; color: #6b7280; }
  .sp-ops { white-space: nowrap; }
  .sp-ops .op-link { display: inline-block; margin-left: 8px; font-size: 12px; }
  .sp-ops .op-link:first-child { margin-left: 0; }
</style>
<style>  .page-tabs { display: flex; gap: 0; border-bottom: 1px solid var(--border); margin-bottom: 20px; }
  .page-tab { padding: 10px 20px; font-size: 14px; color: var(--text-3); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; transition: all .15s; }

  .page-tab:hover { color: var(--brand); }

  .page-tab.active .tab-count { background: var(--brand-weak); color: var(--brand); }

  .filter-box { background: #fafbfc; border: 1px solid var(--border); border-radius: 10px; padding: 16px 18px 4px; margin-bottom: 16px; }
  .filter-row { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }

  .table-wrap { overflow-x: auto; }

  .cert-block { border: 1px solid var(--border); border-radius: 10px; overflow: hidden; margin-bottom: 14px; }

  .cert-field { display: flex; padding: 7px 0; font-size: 13px; }

  .cert-field .f-value { flex: 1; color: var(--text); word-break: break-all; }
  .cert-empty { padding: 20px; text-align: center; color: var(--text-3); font-size: 13px; }
  .acct-info { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 20px; padding: 14px 16px; background: var(--fill-1); border-radius: 10px; margin-bottom: 16px; }
  .acct-info .ai-item { display: flex; font-size: 13px; }
  .acct-info .ai-label { width: 80px; color: var(--text-3); flex-shrink: 0; }
  .acct-info .ai-value { color: var(--text); font-weight: 500; }

  .form-item { margin-bottom: 16px; }
  .form-label { display: block; font-size: 13px; color: var(--text-2); margin-bottom: 7px; }
  .form-label .req { color: var(--danger); margin-left: 2px; }
  .char-count { text-align: right; font-size: 12px; color: var(--text-3); margin-top: 4px; }

  .batch-bar { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  .batch-bar .sel-info { font-size: 13px; color: var(--text-2); }
  .batch-bar .sel-info b { color: var(--brand); }

  /* ===== 人员配置页局部 ===== */
  .filter-box { padding-bottom: 18px; }
  .list-bar { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  .table { min-width: 0; }

  /* 分页 */
  .pager { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 18px; flex-wrap: wrap; }
  .pager .pg-total { font-size: 13px; color: var(--text-3); }
  .pager .pg-list { display: flex; align-items: center; gap: 6px; }
  .pg-btn {
    min-width: 32px; height: 32px; padding: 0 8px; display: inline-flex; align-items: center; justify-content: center;
    border: 1px solid var(--border-strong); border-radius: 6px; background: #fff; color: var(--text-2);
    font-size: 13px; cursor: pointer; transition: all .15s;
  }
  .pg-btn:hover { border-color: var(--brand); color: var(--brand); }
  .pg-btn.active { border-color: var(--brand); background: var(--brand); color: #fff; font-weight: 600; }
  .pg-btn:disabled { color: #c8ccd2; border-color: var(--border); cursor: not-allowed; background: #fafbfc; }
</style>
</head>
<body>
<div id="topbar-root"></div>
<div class="layout">
  <div id="sidebar-root"></div>
  <div class="content">
    <div class="page-head">
      <div class="page-title">分成策略</div>
      <div class="page-desc">统一维护分成策略：适用合作类型、商务团队与各模式的分成方式、比例、渠道</div>
    </div>

    <div class="card">
      <div class="filter-box">
        <div class="filter-row">
          <div class="search-panel">
            <div class="search-item">
              <label>策略ID</label>
              <input type="text" class="ant-input" id="searchId" placeholder="请输入策略ID" style="width:150px">
            </div>
            <div class="search-item">
              <label>策略名称</label>
              <input type="text" class="ant-input" id="searchName" placeholder="请输入策略名称" style="width:170px">
            </div>
            <div class="search-item">
              <label>适用合作类型</label>
              <select class="ant-input" id="searchCoop" style="width:150px">
                <option value="">全部</option>
              </select>
            </div>
            <div class="search-item">
              <label>适用商务团队</label>
              <select class="ant-input" id="searchTeam" style="width:140px">
                <option value="">全部</option>
              </select>
            </div>
            <div class="search-item">
              <label>状态</label>
              <select class="ant-input" id="searchStatus" style="width:110px">
                <option value="">全部</option>
                <option>开启</option>
                <option>关闭</option>
              </select>
            </div>
          </div>
          <div class="filter-actions" style="margin:0;padding:0;border:none">
            <button class="btn btn-primary" onclick="search()">查询</button>
            <button class="btn btn-outline" onclick="resetSearch()">重置</button>
          </div>
        </div>
      </div>

      <div class="list-bar">
        <button class="btn btn-primary" onclick="openAdd()">新建</button>
      </div>

      <div class="table-wrap">
        <table class="table" id="spTable">
          <thead>
            <tr>
              <th style="width:72px">策略ID</th>
              <th style="width:96px;white-space:normal">策略名称</th>
              <th style="width:92px;white-space:normal">适用合作类型</th>
              <th style="width:92px;white-space:normal">适用商务团队</th>
              <th style="width:200px">分成模式</th>
              <th style="width:52px">创建人</th>
              <th style="width:110px;white-space:normal">创建时间</th>
              <th style="width:52px">修改人</th>
              <th style="width:110px;white-space:normal">修改时间</th>
              <th style="width:76px">状态</th>
              <th style="width:156px">操作</th>
            </tr>
          </thead>
          <tbody id="spList"></tbody>
        </table>
      </div>

      <div class="pager" id="pager"></div>
    </div>
  </div>
</div>

<!-- 新建 / 编辑 / 详情 -->
<div class="modal-mask" id="spModal">
  <div class="modal" style="width:660px;max-width:94vw;max-height:92vh">
    <div class="modal-head">
      <div class="modal-title" id="spTitle">新建分成策略</div>
      <span class="modal-close" onclick="closeModal('spModal')"><svg viewBox="0 0 20 20" fill="none" width="20" height="20"><path d="m5 5 10 10M15 5 5 15" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></span>
    </div>

      <div class="sp-field">

        <div class="sp-count"><span id="spNameCount">0</span>/100</div>

      <div class="sp-field">
        <label class="sp-label">适用合作类型<span class="req">*</span></label>

          <div class="ms-panel" id="spCoopPanel"></div>

      <div class="sp-field" style="margin-bottom:0">

            <label class="sp-mode-chk"><input type="checkbox" id="spIapCheck" onchange="onModeToggle('iap')"> <span class="sp-mode-tag tag-iap">IAP</span></label>

              <label class="sp-label">分成比例</label>

              </div>
            </div>
            <div class="sp-field" style="margin-bottom:0">
              <label class="sp-label">分成渠道<span class="req">*</span></label>
              <div class="sp-chk-row" id="spIapChans">

                <label><input type="checkbox" value="NetToon"> NetToon</label>

            </div>
          </div>

          <div class="sp-divider"></div>

          <!-- IAA -->
          <div class="sp-mode-head">
            <label class="sp-mode-chk"><input type="checkbox" id="spIaaCheck" onchange="onModeToggle('iaa')"> <span class="sp-mode-tag tag-iaa">IAA</span></label>

          <div id="spIaaBlock" class="sp-mode-body">
            <div class="sp-field">
              <label class="sp-label">分成方式<span class="req">*</span></label>
              <select class="sp-input" id="spIaaWay">
                <option value="">请选择分成方式</option>
              </select>
            </div>
            <div class="sp-field">
              <label class="sp-label">分成比例</label>
              <div class="sp-ratio-wrap">
                <input type="number" class="sp-input sp-ratio-input" id="spIaaRatio" min="1" max="99" step="1" placeholder="请输入 1-99 的整数">
                <span class="sp-ratio-unit">%</span>
              </div>
            </div>
            <div class="sp-field" style="margin-bottom:0">
              <label class="sp-label">分成渠道<span class="req">*</span></label>
              <div class="sp-chk-row" id="spIaaChans">
                <label><input type="checkbox" value="APP" onchange="onChanToggle('iaa')"> APP</label>
                <label><input type="checkbox" value="TT小程序"> TT小程序</label>
                <label><input type="checkbox" value="H5"> H5</label>
              </div>
              <div class="sp-sub-chans" id="spIaaSubs">
                <label><input type="checkbox" value="NetShort"> NetShort</label>
                <label><input type="checkbox" value="FreeShort"> FreeShort</label>
                <label><input type="checkbox" value="HopReel"> HopReel</label>
                <label><input type="checkbox" value="NetToon"> NetToon</label>
                <label><input type="checkbox" value="FavorDrama"> FavorDrama</label>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-outline" onclick="closeModal('spModal')">取消</button>
      <button class="btn btn-primary" id="spSaveBtn" onclick="saveStrategy()">确定保存</button>
    </div>
  </div>
</div>

  '<div class="topbar">' +

        '</a>' +
        '<div class="topbar-divider"></div>' +
        '<span class="topbar-sub">运营后台</span>' +
        '<a class="topbar-switch" href="../workbench.html">内容合作方</a>' +
      '</div>' +
      '<div class="topbar-right">' +
        '<div class="topbar-user">' +
          '<div class="topbar-avatar">' + avatar + '</div>' +

  '</div>';
}

function renderSidebar(active) {
  var items = [
    { key: 'accounts', label: '主体认证', href: 'accounts.html' },
    { key: 'contracts', label: '合同列表', href: 'contracts.html' },
    { key: 'partners', label: '合作商管理', href: 'partners.html' },
    { key: 'strategies', label: '分成策略', href: 'strategies.html' },
    { key: 'earnings', label: '收益明细', href: 'earnings.html' },
    { key: 'config', label: '系统配置', sub: [
        { key: 'personnel', label: '人员配置', href: 'personnel.html' }
      ] }
  ];
  var html = '<div class="sidebar">';
  items.forEach(function (it) {
    var childActiveKey = null;
    if (it.sub) {
      it.sub.forEach(function (s) { if (s.key === active) childActiveKey = s.key; });
    }
    var isGroup = !!it.sub && it.sub.length;
    var isGroupOpen = childActiveKey !== null;
    if (isGroup) {
      html += '<div class="sidebar-group' + (isGroupOpen ? ' open' : '') + '">' +
        '<div class="sidebar-item' + (childActiveKey !== null ? ' active' : '') + '" onclick="toggleSidebarGroup(this)">' +
          icon(it.key) + '<span>' + it.label + '</span>' +
          '<span class="arrow">' + icon('down') + '</span>' +
        '</div>' +
        '<div class="sidebar-sub">' + it.sub.map(function (s) {
          return '<a class="sidebar-item' + (s.key === active ? ' active' : '') + '" href="' + s.href + '">' + s.label + '</a>';
        }).join('') + '</div>' +
      '</div>';
    } else {
      html += '<a class="sidebar-item' + (it.key === active ? ' active' : '') + '" href="' + it.href + '">' +
        icon(it.key) + '<span>' + it.label + '</span>' +
      '</a>';
    }
  });
  html += '</div>';
  return html;
}

function toggleSidebarGroup(el) {
  var group = el.parentElement;
  group.classList.toggle('open');
}

// ---------- Toast ----------
function showToast(msg, type) {
  var el = document.getElementById('toast');
  if (!el) {
    el = document.createElement('div');
    el.id = 'toast';
    document.body.appendChild(el);
  }
  el.textContent = msg;
  el.className = 'toast show' + (type === 'err' ? ' toast-err' : '');
  clearTimeout(el._tm);
  el._tm = setTimeout(function () { el.className = 'toast'; }, 2000);
}

// ---------- 弹窗 ----------
function openModal(id) { var m = document.getElementById(id); if (m) m.classList.add('show'); }
function closeModal(id) { var m = document.getElementById(id); if (m) m.classList.remove('show'); }

// 联想输入单选：acInput(inputId, panelId, hiddenId, options, emptyText)
function acInput(inputId, panelId, hiddenId, options, emptyText) {
  var input = document.getElementById(inputId);
  var panel = document.getElementById(panelId);
  var kw = input.value.trim();
  var matches = options.filter(function (o) { return o.indexOf(kw) !== -1; });

  if (matches.length === 0) {
    panel.innerHTML = '<div class="ac-empty">' + (emptyText || '无匹配项') + '</div>';
  } else {
    panel.innerHTML = matches.map(function (o) {
      var idx = o.indexOf(kw);
      var label = kw ? o.slice(0, idx) + '<span class="hl">' + o.slice(idx, idx + kw.length) + '</span>' + o.slice(idx + kw.length) : o;
      return '<div class="ac-opt" onclick="acSelect(\'' + inputId + '\',\'' + panelId + '\',\'' + hiddenId + '\',\'' + o + '\')">' + label + '</div>';
    }).join('');
  }

  var rect = input.getBoundingClientRect();
  panel.style.left = rect.left + 'px';
  panel.style.top = (rect.bottom + 4) + 'px';
  panel.style.width = rect.width + 'px';
  panel.classList.add('show');
}
function acSelect(inputId, panelId, hiddenId, value) {
  document.getElementById(inputId).value = value;
  if (hiddenId) document.getElementById(hiddenId).value = value;
  document.getElementById(panelId).classList.remove('show');
}
document.addEventListener('click', function (e) {
  if (!e.target.closest('.autocomplete')) document.querySelectorAll('.ac-panel').forEach(function (p) { p.classList.remove('show'); });
});</script>
<script>
  // ===================== 常量与数据层 =====================
  var PAGE_SIZE = 10;
  var currentPage = 1;
  var LS_KEY = 'cp_split_strategies';
  var COOP_TYPES = ['付费独家', '付费非独家', '免费独家', '免费非独家'];
  var TEAMS = ['冠军团队', '九天团队'];
  var WAYS = ['保底+净利润分成', '保底+流水分成', '保底+消耗分成', '保底+热度值分成'];
  var CHANNELS = ['APP', 'TT小程序', 'H5'];
  var APP_SUBS = ['NetShort', 'FreeShort', 'HopReel', 'NetToon', 'FavorDrama'];

  var SEED = [
    {
      id: 'SP1001', name: '制作分成标准A',
      coopTypes: ['付费独家', '付费非独家'], teams: ['冠军团队'],
      modes: {
        IAP: { way: '保底+净利润分成', ratio: 4, chans: ['APP'], subs: ['NetShort', 'FreeShort', 'HopReel', 'NetToon', 'FavorDrama'] },
        IAA: { way: '保底+流水分成', ratio: 5, chans: ['APP'], subs: ['NetShort'] }
      },
      status: '开启',
      creator: '春明', createTime: '2026-11-10 10:20:00',
      updater: '春明', updateTime: '2026-11-12 15:30:00'
    },
    {
      id: 'SP1002', name: '剧本分成标准B',
      coopTypes: ['免费独家', '免费非独家'], teams: ['九天团队'],
      modes: {
        IAP: { way: '保底+消耗分成', ratio: 8, chans: ['TT小程序'], subs: [] },
        IAA: { way: '保底+热度值分成', ratio: 12, chans: ['APP', 'H5'], subs: ['HopReel', 'NetToon'] }
      },
      status: '关闭',
      creator: '春明', createTime: '2026-11-11 09:05:00',
      updater: '禾呈', updateTime: '2026-11-13 11:12:00'
    }
  ];

  function clone(o) { return JSON.parse(JSON.stringify(o)); }
  function loadStrategies() {
    try {
      var raw = localStorage.getItem(LS_KEY);
      if (raw) {
        var arr = JSON.parse(raw);
        if (arr && arr.length) return arr;
      }
    } catch (e) {}
    return clone(SEED);
  }
  function persist(list) {
    try { localStorage.setItem(LS_KEY, JSON.stringify(list)); } catch (e) {}
  }

  var DEMO_SP = loadStrategies();
  var spState = { id: null, readonly: false, copy: false };

  // ===================== 展示工具 =====================
  function fmtWay(w) { return (w || '').replace('+', ' + '); }
  function chanLabel(c) {
    if (c === 'APP') return 'app';
    if (c === 'TT小程序') return 'tt小程序';
    if (c === 'H5') return 'h5';
    return c;
  }
  function modeCards(modes) {
    var out = '';
    ['IAP', 'IAA'].forEach(function (m) {
      var x = (modes || {})[m];
      if (!x) return;
      var tags = (x.chans || []).map(function (c) { return '<span class="sp-chan">' + chanLabel(c) + '</span>'; }).join('');
      out += '<div class="sp-mode-card ' + (m === 'IAP' ? 'card-iap' : 'card-iaa') + '">' +
        '<div class="sp-mode-top"><span class="sp-mode-name">' + m + '</span><span class="sp-way">' + fmtWay(x.way) + '</span>' + tags + '</div>' +
        '<div class="sp-ratio">' + x.ratio + '%</div>' +
      '</div>';
    });
    return out;
  }

  // ===================== 列表 =====================
  function filteredList() {
    var id = document.getElementById('searchId').value.trim();
    var name = document.getElementById('searchName').value.trim();
    var coop = document.getElementById('searchCoop').value;
    var team = document.getElementById('searchTeam').value;
    var st = document.getElementById('searchStatus').value;
    return DEMO_SP.filter(function (p) {
      if (id && p.id !== id) return false;
      if (name && p.name.indexOf(name) === -1) return false;
      if (coop && (p.coopTypes || []).indexOf(coop) === -1) return false;
      if (team && (p.teams || []).indexOf(team) === -1) return false;
      if (st && p.status !== st) return false;
      return true;
    });
  }

  function renderList() {
    var list = filteredList();
    var pages = Math.max(1, Math.ceil(list.length / PAGE_SIZE));
    if (currentPage > pages) currentPage = pages;
    var start = (currentPage - 1) * PAGE_SIZE;
    var pageList = list.slice(start, start + PAGE_SIZE);

    var tbody = document.getElementById('spList');
    if (pageList.length === 0) {
      tbody.innerHTML = '<tr><td colspan="11"><div class="empty"><div class="empty-text">暂无分成策略</div></div></td></tr>';
    } else {
      tbody.innerHTML = pageList.map(function (p) {
        return '<tr>' +
          '<td class="mono">' + p.id + '</td>' +
          '<td>' + p.name + '</td>' +
          '<td>' + (p.coopTypes || []).join('、') + '</td>' +
          '<td>' + (p.teams || []).join('、') + '</td>' +
          '<td class="sp-modes-cell">' + modeCards(p.modes) + '</td>' +
          '<td>' + p.creator + '</td>' +
          '<td class="mono text-2">' + p.createTime + '</td>' +
          '<td>' + p.updater + '</td>' +
          '<td class="mono text-2">' + p.updateTime + '</td>' +
          '<td><span class="sp-status ' + (p.status === '开启' ? 'on' : 'off') + '" onclick="toggleStatus(\'' + p.id + '\')">' + p.status + '</span></td>' +
          '<td class="sp-ops">' +
            '<span class="op-link" onclick="openEdit(\'' + p.id + '\')">编辑</span>' +
            '<span class="op-link" onclick="openDetail(\'' + p.id + '\')">详情</span>' +
            '<span class="op-link" onclick="openCopy(\'' + p.id + '\')">复制</span>' +
            '<span class="op-link" onclick="delStrategy(\'' + p.id + '\')">删除</span>' +
          '</td>' +
        '</tr>';
      }).join('');
    }
    renderPager(list.length, pages);
  }

  function renderPager(total, pages) {
    var html = '<div class="pg-total">共 ' + total + ' 条</div><div class="pg-list">';
    html += '<button class="pg-btn" ' + (currentPage === 1 ? 'disabled' : '') + ' onclick="goPage(' + (currentPage - 1) + ')">上一页</button>';
    for (var i = 1; i <= pages; i++) {
      html += '<button class="pg-btn' + (i === currentPage ? ' active' : '') + '" onclick="goPage(' + i + ')">' + i + '</button>';
    }
    html += '<button class="pg-btn" ' + (currentPage === pages ? 'disabled' : '') + ' onclick="goPage(' + (currentPage + 1) + ')">下一页</button>';
    html += '</div>';
    document.getElementById('pager').innerHTML = html;
  }

  function goPage(n) {
    var total = filteredList().length;
    var pages = Math.max(1, Math.ceil(total / PAGE_SIZE));
    if (n < 1 || n > pages) return;
    currentPage = n;
    renderList();
  }

  function search() { currentPage = 1; renderList(); }
  function resetSearch() {
    ['searchId', 'searchName'].forEach(function (id) { document.getElementById(id).value = ''; });
    ['searchCoop', 'searchTeam', 'searchStatus'].forEach(function (id) { document.getElementById(id).value = ''; });
    currentPage = 1;
    renderList();
  }

  function toggleStatus(id) {
    var p = DEMO_SP.filter(function (x) { return x.id === id; })[0];
    if (!p) return;
    p.status = p.status === '开启' ? '关闭' : '开启';
    p.updater = '春明';
    p.updateTime = nowStr();
    persist(DEMO_SP);
    renderList();
    showToast('策略已' + p.status, 'ok');
  }

  function delStrategy(id) {
    showToast('已有合同绑定了该策略，删除失败', 'err');
  }

  // ===================== 多选下拉 =====================
  var msState = { coop: [], team: [] };

  function renderMs(kind) {
    var sel = msState[kind];
    var box = document.getElementById(kind === 'coop' ? 'spCoopBox' : 'spTeamBox');
    var panel = document.getElementById(kind === 'coop' ? 'spCoopPanel' : 'spTeamPanel');
    var options = kind === 'coop' ? COOP_TYPES : TEAMS;

    if (!sel.length) {
      box.innerHTML = '<span class="ms-ph">' + (kind === 'coop' ? '请选择合作类型' : '请选择商务团队') + '</span>';
    } else {
      box.innerHTML = sel.map(function (v) {
        return '<span class="ms-tag">' + v + '<span class="ms-x" onclick="removeMs(\'' + kind + '\',\'' + v + '\',event)">×</span></span>';
      }).join('');
    }
    panel.innerHTML = options.map(function (o) {
      var on = sel.indexOf(o) !== -1;
      return '<div class="ms-opt' + (on ? ' checked' : '') + '" onclick="pickMs(\'' + kind + '\',\'' + o + '\',event)">' +
        '<span class="ms-check">✓</span>' + o + '</div>';
    }).join('');
  }

  function toggleMs(kind, e) {
    e.stopPropagation();
    if (spState.readonly) return;
    var panel = document.getElementById(kind === 'coop' ? 'spCoopPanel' : 'spTeamPanel');
    var open = panel.classList.contains('show');
    closeAllMs();
    if (!open) panel.classList.add('show');
  }

  function closeAllMs() {
    ['spCoopPanel', 'spTeamPanel'].forEach(function (id) {
      var el = document.getElementById(id);
      if (el) el.classList.remove('show');
    });
  }

  function pickMs(kind, val, e) {
    e.stopPropagation();
    var i = msState[kind].indexOf(val);
    if (i === -1) msState[kind].push(val); else msState[kind].splice(i, 1);
    renderMs(kind);
  }

  function removeMs(kind, val, e) {
    e.stopPropagation();
    if (spState.readonly) return;
    var i = msState[kind].indexOf(val);
    if (i !== -1) msState[kind].splice(i, 1);
    renderMs(kind);
  }

  document.addEventListener('click', function (e) {
    if (!e.target.closest('.ms-wrap')) closeAllMs();
  });

  // ===================== 分成模式编辑 =====================
  function onModeToggle(which) {
    var on = document.getElementById(which === 'iap' ? 'spIapCheck' : 'spIaaCheck').checked;
    document.getElementById(which === 'iap' ? 'spIapBlock' : 'spIaaBlock').style.display = on ? 'block' : 'none';
  }

  function onChanToggle(which) {
    var box = document.getElementById(which === 'iap' ? 'spIapChans' : 'spIaaChans');
    var subs = document.getElementById(which === 'iap' ? 'spIapSubs' : 'spIaaSubs');
    var appOn = false;
    Array.prototype.forEach.call(box.querySelectorAll('input'), function (i) {
      if (i.value === 'APP' && i.checked) appOn = true;
    });
    subs.style.display = appOn ? 'flex' : 'none';
    if (!appOn) Array.prototype.forEach.call(subs.querySelectorAll('input'), function (i) { i.checked = false; });
  }

  function checkedVals(boxId) {
    var out = [];
    Array.prototype.forEach.call(document.querySelectorAll('#' + boxId + ' input:checked'), function (i) { out.push(i.value); });
    return out;
  }
  function setVals(boxId, list) {
    Array.prototype.forEach.call(document.querySelectorAll('#' + boxId + ' input'), function (i) {
      i.checked = (list || []).indexOf(i.value) !== -1;
    });
  }

  function resetForm() {
    document.getElementById('spName').value = '';
    document.getElementById('spNameCount').textContent = '0';
    msState = { coop: [], team: [] };
    renderMs('coop'); renderMs('team');
    ['spIapCheck', 'spIaaCheck'].forEach(function (id) { document.getElementById(id).checked = false; });
    document.getElementById('spIapWay').value = '';
    document.getElementById('spIaaWay').value = '';
    document.getElementById('spIapRatio').value = '';
    document.getElementById('spIaaRatio').value = '';
    setVals('spIapChans', []); setVals('spIaaChans', []);
    setVals('spIapSubs', []); setVals('spIaaSubs', []);
    onModeToggle('iap'); onModeToggle('iaa');
    onChanToggle('iap'); onChanToggle('iaa');
  }

  function fillForm(p) {
    document.getElementById('spName').value = p.name;
    document.getElementById('spNameCount').textContent = p.name.length;
    msState = { coop: (p.coopTypes || []).slice(), team: (p.teams || []).slice() };
    renderMs('coop'); renderMs('team');
    var iap = (p.modes || {}).IAP, iaa = (p.modes || {}).IAA;
    document.getElementById('spIapCheck').checked = !!iap;
    document.getElementById('spIaaCheck').checked = !!iaa;
    if (iap) {
      document.getElementById('spIapWay').value = iap.way || '';
      document.getElementById('spIapRatio').value = iap.ratio || '';
      setVals('spIapChans', iap.chans || []);
      setVals('spIapSubs', iap.subs || []);
    } else {
      document.getElementById('spIapWay').value = '';
      document.getElementById('spIapRatio').value = '';
      setVals('spIapChans', []); setVals('spIapSubs', []);
    }
    if (iaa) {
      document.getElementById('spIaaWay').value = iaa.way || '';
      document.getElementById('spIaaRatio').value = iaa.ratio || '';
      setVals('spIaaChans', iaa.chans || []);
      setVals('spIaaSubs', iaa.subs || []);
    } else {
      document.getElementById('spIaaWay').value = '';
      document.getElementById('spIaaRatio').value = '';
      setVals('spIaaChans', []); setVals('spIaaSubs', []);
    }
    onModeToggle('iap'); onModeToggle('iaa');
    onChanToggle('iap'); onChanToggle('iaa');
  }

  function setReadonly(on) {
    spState.readonly = on;
    var box = document.getElementById('spModal');
    Array.prototype.forEach.call(box.querySelectorAll('input, select, textarea'), function (el) { el.disabled = on; });
    box.querySelector('.ms-box').style.pointerEvents = on ? 'none' : '';
    document.getElementById('spSaveBtn').style.display = on ? 'none' : '';
    box.querySelector('.modal').classList.toggle('sp-readonly', on);
  }

  function openAdd() {
    spState = { id: null, readonly: false, copy: false };
    resetForm();
    setReadonly(false);
    document.getElementById('spTitle').textContent = '新建分成策略';
    openModal('spModal');
  }

  function openEdit(id) {
    var p = DEMO_SP.filter(function (x) { return x.id === id; })[0];
    if (!p) return;
    spState = { id: id, readonly: false, copy: false };
    fillForm(p);
    setReadonly(false);
    document.getElementById('spTitle').textContent = '编辑分成策略';
    openModal('spModal');
  }

  function openCopy(id) {
    var p = DEMO_SP.filter(function (x) { return x.id === id; })[0];
    if (!p) return;
    spState = { id: null, readonly: false, copy: true };
    fillForm(p);
    setReadonly(false);
    document.getElementById('spTitle').textContent = '新建分成策略（复制自 ' + id + '）';
    openModal('spModal');
  }

  function openDetail(id) {
    var p = DEMO_SP.filter(function (x) { return x.id === id; })[0];
    if (!p) return;
    spState = { id: id, readonly: true, copy: false };
    fillForm(p);
    document.getElementById('spTitle').textContent = '分成策略详情';
    openModal('spModal');
    setReadonly(true);
  }

  function collectMode(which) {
    var on = document.getElementById(which === 'iap' ? 'spIapCheck' : 'spIaaCheck').checked;
    if (!on) return null;
    return {
      way: document.getElementById(which === 'iap' ? 'spIapWay' : 'spIaaWay').value,
      ratio: document.getElementById(which === 'iap' ? 'spIapRatio' : 'spIaaRatio').value,
      chans: checkedVals(which === 'iap' ? 'spIapChans' : 'spIaaChans'),
      subs: checkedVals(which === 'iap' ? 'spIapSubs' : 'spIaaSubs'),
      label: which === 'iap' ? 'IAP' : 'IAA'
    };
  }

  function saveStrategy() {
    var name = document.getElementById('spName').value.trim();
    if (!name) { showToast('请输入策略名称', 'err'); return; }
    if (name.length > 100) { showToast('策略名称最多 100 个字符', 'err'); return; }
    if (!msState.coop.length) { showToast('请选择适用合作类型', 'err'); return; }
    if (!msState.team.length) { showToast('请选择适用商务团队', 'err'); return; }

    var iap = collectMode('iap');
    var iaa = collectMode('iaa');
    if (!iap && !iaa) { showToast('请至少勾选一个分成模式', 'err'); return; }

    var bad = null;
    [iap, iaa].forEach(function (m) {
      if (!m || bad) return;
      if (!m.way) { bad = '请选择 ' + m.label + ' 分成方式'; return; }
      var r = Number(m.ratio);
      if (!m.ratio || !isFinite(r) || r !== Math.floor(r) || r <= 0 || r >= 100) { bad = m.label + ' 分成比例需为小于 100 的正整数'; return; }
      if (!m.chans.length) { bad = '请选择 ' + m.label + ' 分成渠道'; return; }
      if (m.chans.indexOf('APP') !== -1 && !m.subs.length) { bad = '请选择 ' + m.label + ' APP 下的二级渠道'; return; }
    });
    if (bad) { showToast(bad, 'err'); return; }

    var modes = {};
    [iap, iaa].forEach(function (m) {
      if (!m) return;
      modes[m.label] = { way: m.way, ratio: Number(m.ratio), chans: m.chans, subs: m.subs };
    });

    if (spState.id) {
      var p = DEMO_SP.filter(function (x) { return x.id === spState.id; })[0];
      p.name = name;
      p.coopTypes = msState.coop.slice();
      p.teams = msState.team.slice();
      p.modes = modes;
      p.updater = '春明';
      p.updateTime = nowStr();
      showToast('已保存修改', 'ok');
    } else {
      var maxId = 1000;
      DEMO_SP.forEach(function (x) { maxId = Math.max(maxId, parseInt(String(x.id).replace(/\D/g, ''), 10) || 0); });
      DEMO_SP.unshift({
        id: 'SP' + (maxId + 1),
        name: name,
        coopTypes: msState.coop.slice(),
        teams: msState.team.slice(),
        modes: modes,
        status: '开启',
        creator: '春明', createTime: nowStr(),
        updater: '春明', updateTime: nowStr()
      });
      currentPage = 1;
      showToast('已新建分成策略', 'ok');
    }
    persist(DEMO_SP);
    closeModal('spModal');
    renderList();
  }

  function nowStr() {
    var d = new Date();
    function p(n) { return (n < 10 ? '0' : '') + n; }
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' +
      p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds());
  }

  // ===================== 初始化 =====================
  document.getElementById('topbar-root').innerHTML = renderTopbar({});
  document.getElementById('sidebar-root').innerHTML = renderSidebar('strategies');

  // 下拉枚举
  document.getElementById('searchCoop').innerHTML = '<option value="">全部</option>' +
    COOP_TYPES.map(function (c) { return '<option>' + c + '</option>'; }).join('');
  document.getElementById('searchTeam').innerHTML = '<option value="">全部</option>' +
    TEAMS.map(function (t) { return '<option>' + t + '</option>'; }).join('');
  ['spIapWay', 'spIaaWay'].forEach(function (id) {
    document.getElementById(id).innerHTML = '<option value="">请选择分成方式</option>' +
      WAYS.map(function (w) { return '<option>' + w + '</option>'; }).join('');
  });

  document.getElementById('spName').addEventListener('input', function () {
    document.getElementById('spNameCount').textContent = this.value.length;
  });

  persist(DEMO_SP);
  renderMs('coop'); renderMs('team');
  renderList();
</script>
</body>
</html>
