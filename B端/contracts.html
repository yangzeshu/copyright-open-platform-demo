<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>合同管理 · 版权开放平台</title>
<style>/* ============================================================
   版权开放平台 · 公共样式 common.css
   品牌主色：粉红 #ff2e63，浅色背景，卡片式布局
   C 端与 B 端共享
   ============================================================ */

:root {
  --brand: #ff2e63;
  --brand-dark: #e0244f;
  --brand-light: #fff0f4;
  --brand-weak: rgba(255, 46, 99, 0.06);
  --brand-grad: linear-gradient(135deg, #ff5c8a 0%, #ff2e63 100%);

  --bg: #f7f8fa;
  --fill-1: #f7f8fa;
  --fill-2: #eef0f3;
  --card: #ffffff;
  --border: #eef0f3;
  --border-strong: #e2e5ea;

  --text: #1f2329;
  --text-2: #51565d;
  --text-3: #8a9199;
  --text-invert: #ffffff;

  --ok: #16b364;
  --warn: #f0a020;
  --danger: #e5484d;
  --info: #3b82f6;

  --radius-card: 12px;
  --radius-btn: 8px;
  --radius-input: 8px;
  --shadow-card: 0 2px 12px rgba(20, 24, 30, 0.06);
  --shadow-pop: 0 8px 30px rgba(20, 24, 30, 0.14);

  --sidebar-w: 220px;
  --topbar-h: 64px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei",
    "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  color: var(--text);
  background: var(--bg);
  font-size: 14px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}

a { color: inherit; text-decoration: none; }
ul, ol { list-style: none; }
button { font-family: inherit; cursor: pointer; border: none; background: none; }
input, select, textarea { font-family: inherit; font-size: 14px; }

/* ---------- 通用布局 ---------- */
.container { max-width: 1200px; margin: 0 auto; padding: 0 24px; }

/* ---------- 顶部栏 ---------- */
.topbar {
  position: sticky; top: 0; z-index: 100;
  background: #fff;
  height: var(--topbar-h);
  border-bottom: 1px solid var(--border);
}
.topbar-inner {
  max-width: 1440px; margin: 0 auto; padding: 0 24px;
  height: 100%; display: flex; align-items: center; justify-content: space-between;
}
.topbar-left { display: flex; align-items: center; gap: 12px; }
.topbar-logo {
  width: 30px; height: 30px; border-radius: 8px;
  background: var(--brand-grad);
  display: flex; align-items: center; justify-content: center;
  color: #fff; font-weight: 700; font-size: 16px;
}
.topbar-title { font-size: 15px; font-weight: 600; }
.topbar-divider { width: 1px; height: 16px; background: var(--border-strong); }
.topbar-sub { font-size: 13px; color: var(--text-3); }
.topbar-switch { display: inline-flex; align-items: center; height: 26px; padding: 0 12px; font-size: 13px; color: var(--brand); border: 1px solid var(--brand); border-radius: 4px; cursor: pointer; text-decoration: none; margin-left: 2px; }
.topbar-switch:hover { background: var(--brand); color: #fff; }

.topbar-right { display: flex; align-items: center; gap: 20px; }
.topbar-icon {
  width: 20px; height: 20px; color: var(--text-2);
  position: relative; display: flex; align-items: center;
}
.topbar-icon .dot {
  position: absolute; top: -2px; right: -2px;
  width: 7px; height: 7px; border-radius: 50%; background: var(--brand);
  border: 1.5px solid #fff;
}
.topbar-user { display: flex; align-items: center; gap: 8px; cursor: pointer; }
.topbar-avatar {
  width: 28px; height: 28px; border-radius: 50%;
  background: var(--brand-grad); color: #fff;
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; font-weight: 600;
}
.topbar-name { font-size: 14px; color: var(--text); }
.topbar-caret { width: 14px; height: 14px; color: var(--text-3); }

/* ---------- 主体框架：侧边菜单 + 内容 ---------- */
.layout {
  display: flex; min-height: calc(100vh - var(--topbar-h));
  max-width: 1440px; margin: 0 auto;
}
.sidebar {
  width: var(--sidebar-w); flex-shrink: 0;
  padding: 20px 12px;
}
.sidebar-item {
  display: flex; align-items: center; gap: 10px;
  padding: 11px 14px; margin-bottom: 4px;
  border-radius: 8px; color: var(--text-2);
  font-size: 14px; cursor: pointer;
  transition: background .15s, color .15s;
}
.sidebar-item:hover { background: var(--fill-2); color: var(--text); }
.sidebar-item.active {
  background: var(--brand-weak); color: var(--brand); font-weight: 600;
}
.sidebar-item svg { width: 18px; height: 18px; flex-shrink: 0; }
.sidebar-item .arrow { margin-left: auto; width: 14px; height: 14px; transition: transform .2s; }

/* 目录分组：子菜单默认收起，展开后箭头旋转 */
.sidebar-group .sidebar-sub { display: none; padding-left: 28px; }
.sidebar-group.open .sidebar-sub { display: block; }
.sidebar-group.open .arrow { transform: rotate(180deg); }
.sidebar-sub .sidebar-item { padding: 9px 14px; font-size: 13px; }

.content {
  flex: 1; min-width: 0;
  padding: 24px 32px 48px;
}

/* ---------- 页面标题 ---------- */
.page-head { margin-bottom: 20px; }
.page-title { font-size: 20px; font-weight: 700; }
.page-desc { font-size: 13px; color: var(--text-3); margin-top: 4px; }

/* ---------- 卡片 ---------- */
.card {
  background: var(--card); border-radius: var(--radius-card);
  box-shadow: var(--shadow-card);
  padding: 24px;
  margin-bottom: 20px;
}
.card-title { font-size: 16px; font-weight: 600; margin-bottom: 16px; }
.card + .card { margin-top: 0; }

/* ---------- 按钮 ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  padding: 9px 20px; border-radius: var(--radius-btn);
  font-size: 14px; font-weight: 500; line-height: 1;
  transition: all .15s; white-space: nowrap;
}
.btn-primary { background: var(--brand); color: #fff; }
.btn-primary:hover { background: var(--brand-dark); }
.btn-outline { border: 1px solid var(--border-strong); color: var(--text-2); background: #fff; }
.btn-outline:hover { border-color: var(--brand); color: var(--brand); }
.btn-text { color: var(--brand); padding: 9px 12px; }
.btn-text:hover { background: var(--brand-weak); }
.btn-danger { background: var(--danger); color: #fff; }
.btn-danger:hover { opacity: .9; }
.btn-plain { background: var(--fill-2); color: var(--text-2); }
.btn-plain:hover { background: var(--border-strong); }
.btn-ghost { color: var(--brand); }
.btn-block { width: 100%; }
.btn-lg { padding: 12px 28px; font-size: 15px; }
.btn-sm { padding: 6px 14px; font-size: 13px; }
.btn:disabled { opacity: .5; cursor: not-allowed; }

/* ---------- 表单 ---------- */
.form-item { margin-bottom: 18px; }
.form-label { display: block; font-size: 13px; color: var(--text-2); margin-bottom: 7px; }
.form-label .req { color: var(--danger); margin-left: 2px; }
.form-input {
  width: 100%; padding: 10px 14px;
  border: 1px solid var(--border-strong); border-radius: var(--radius-input);
  background: #fff; color: var(--text); outline: none;
  transition: border .15s, box-shadow .15s;
}
.form-input:focus { border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-weak); }
.form-input::placeholder { color: var(--text-3); }
textarea.form-input { resize: vertical; min-height: 90px; }
.form-row { display: flex; gap: 12px; }
.form-row > * { flex: 1; }
.form-hint { font-size: 12px; color: var(--text-3); margin-top: 6px; }

/* 验证码输入 */
.code-wrap { display: flex; gap: 10px; }
.code-wrap .form-input { flex: 1; }
.code-btn {
  flex-shrink: 0; min-width: 110px; padding: 0 14px;
  border: 1px solid var(--border-strong); border-radius: var(--radius-input);
  color: var(--brand); font-size: 13px; background: #fff;
}
.code-btn:disabled { color: var(--text-3); cursor: not-allowed; }

/* ---------- 状态徽标 ---------- */
.tag {
  display: inline-flex; align-items: center;
  padding: 3px 10px; border-radius: 6px;
  font-size: 12px; font-weight: 500; line-height: 1.5;
}
.tag-gray { background: #f0f1f3; color: #6b7280; }
.tag-blue { background: #e8f1ff; color: #2f6bdc; }
.tag-red { background: #fdeaea; color: #d13a3f; }
.tag-orange { background: #fff3e0; color: #e8840a; }
.tag-green { background: #e6f7ef; color: #149a5a; }
.tag-pink { background: var(--brand-light); color: var(--brand); }
.tag-dark { background: #3a3f45; color: #fff; }

/* ---------- 表格 ---------- */
.table { width: 100%; border-collapse: collapse; }
.table th, .table td {
  text-align: center; padding: 13px 14px;
  border-bottom: 1px solid var(--border);
  font-size: 13px;
}
.table th { color: var(--text-3); font-weight: 500; background: #fafbfc; white-space: nowrap; }
.table tr:last-child td { border-bottom: none; }
.table tbody tr:hover { background: #fafbfc; }
.table .cell-title { color: var(--text); font-weight: 500; }

/* 表格固定列（水平滚动时锁定） */
.table th.sticky-l, .table td.sticky-l { position: sticky; left: 0; z-index: 2; background: #fff; }
.table th.sticky-l2, .table td.sticky-l2 { position: sticky; left: 40px; z-index: 2; background: #fff; }
.table th.sticky-r, .table td.sticky-r { position: sticky; right: 0; z-index: 2; background: #fff; }
.table th.sticky-l, .table th.sticky-l2, .table th.sticky-r { background: #fafbfc; z-index: 3; }
.table tbody tr:hover td.sticky-l,
.table tbody tr:hover td.sticky-l2,
.table tbody tr:hover td.sticky-r { background: #fafbfc; }
.table td.sticky-l2 { box-shadow: 2px 0 4px rgba(0,0,0,.06); }
.table td.sticky-r, .table th.sticky-r { box-shadow: -2px 0 4px rgba(0,0,0,.06); }

/* ---------- 弹窗 ---------- */
.modal-mask {
  position: fixed; inset: 0; z-index: 200;
  background: rgba(20, 24, 30, 0.45);
  display: none; align-items: center; justify-content: center;
}
.modal-mask.show { display: flex; }
.modal {
  background: #fff; border-radius: 14px; width: 460px; max-width: 92vw;
  max-height: 88vh; display: flex; flex-direction: column;
  box-shadow: var(--shadow-pop);
  animation: pop .18s ease;
}
.modal-head {
  padding: 24px 24px 0; flex-shrink: 0;
  display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px;
}
.modal-body {
  padding: 0 24px; overflow-y: auto; flex: 1;
}
.modal-foot {
  padding: 16px 24px 24px; flex-shrink: 0;
  display: flex; justify-content: flex-end; gap: 10px; margin-top: 22px;
}
.modal-lg { width: 620px; }
@keyframes pop { from { transform: scale(.96); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.modal-title { font-size: 16px; font-weight: 600; }
.modal-close { width: 20px; height: 20px; color: var(--text-3); cursor: pointer; }

/* ---------- 空状态 / 提示 ---------- */
.empty {
  text-align: center; padding: 48px 20px; color: var(--text-3);
}
.empty .empty-icon { font-size: 40px; margin-bottom: 12px; opacity: .5; }
.empty .empty-text { font-size: 14px; }

/* ---------- 提示条 ---------- */
.notice {
  display: flex; align-items: flex-start; gap: 10px;
  padding: 14px 16px; border-radius: 10px; font-size: 13px;
  margin-bottom: 16px;
}
.notice-info { background: #e8f1ff; color: #2f6bdc; }
.notice-warn { background: #fff3e0; color: #e8840a; }
.notice-success { background: #e6f7ef; color: #149a5a; }
.notice svg { width: 18px; height: 18px; flex-shrink: 0; margin-top: 1px; }

/* ---------- 步骤条 ---------- */
.steps { display: flex; align-items: center; margin-bottom: 24px; }
.step { display: flex; align-items: center; gap: 8px; }
.step-dot {
  width: 26px; height: 26px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; font-weight: 600;
  background: var(--fill-2); color: var(--text-3);
}
.step.active .step-dot { background: var(--brand); color: #fff; }
.step.done .step-dot { background: var(--ok); color: #fff; }
.step-label { font-size: 13px; color: var(--text-3); }
.step.active .step-label { color: var(--text); font-weight: 600; }
.step.done .step-label { color: var(--text-2); }
.step-line { flex: 1; height: 2px; background: var(--border-strong); margin: 0 12px; }
.step-line.done { background: var(--ok); }

/* ---------- 辅助 ---------- */
.row { display: flex; align-items: center; gap: 12px; }
.between { display: flex; align-items: center; justify-content: space-between; }
.mt-8 { margin-top: 8px; } .mt-16 { margin-top: 16px; } .mt-24 { margin-top: 24px; }
.mb-8 { margin-bottom: 8px; } .mb-16 { margin-bottom: 16px; } .mb-24 { margin-bottom: 24px; }
.text-3 { color: var(--text-3); } .text-2 { color: var(--text-2); }
.text-brand { color: var(--brand); } .text-ok { color: var(--ok); } .text-danger { color: var(--danger); }
.fs-12 { font-size: 12px; } .fs-13 { font-size: 13px; }
.mono { font-variant-numeric: tabular-nums; }

/* 统计卡 */
.stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 20px; }
.stat-card { background: #fff; border-radius: var(--radius-card); box-shadow: var(--shadow-card); padding: 20px 22px; }
.stat-label { font-size: 13px; color: var(--text-3); }
.stat-value { font-size: 26px; font-weight: 700; margin-top: 6px; font-variant-numeric: tabular-nums; }
.stat-value .unit { font-size: 14px; font-weight: 400; color: var(--text-3); margin-left: 2px; }
.stat-trend { font-size: 12px; margin-top: 4px; }

/* 用户下拉菜单 */
.user-menu {
  position: absolute; top: var(--topbar-h); right: 24px; z-index: 150;
  background: #fff; border-radius: 10px; box-shadow: var(--shadow-pop);
  min-width: 140px; padding: 6px; overflow: hidden;
}
.user-menu a, .user-menu .logout-link {
  display: block; padding: 9px 14px; border-radius: 6px;
  font-size: 13px; color: var(--text-2);
}
.user-menu a:hover, .user-menu .logout-link:hover { background: var(--brand-weak); color: var(--brand); }

/* toast */
#toast {
  position: fixed; top: 80px; left: 50%; transform: translateX(-50%);
  z-index: 300; background: #fff; color: var(--text);
  padding: 10px 20px; border-radius: 8px; box-shadow: var(--shadow-pop);
  font-size: 14px; display: none;
}
#toast.show { display: block; animation: pop .2s ease; }

/* ===== 时间范围（高仿 antd RangePicker，公共组件） ===== */
.rp-wrap { position: relative; }
.rp-box {
  height: 32px; width: 320px; padding: 4px 11px; border: 1px solid #d9d9d9;
  border-radius: 6px; background: #fff; display: flex; align-items: center; cursor: pointer; transition: all .2s;
}
.rp-box:hover { border-color: var(--brand); }
.rp-box.open { border-color: var(--brand); box-shadow: 0 0 0 2px rgba(255,46,99,.1); }
.rp-val { flex: 1; font-size: 14px; color: var(--text); text-align: center; font-variant-numeric: tabular-nums; }
.rp-val.ph { color: #bfbfbf; }
.rp-sep { margin: 0 6px; color: var(--text-3); font-size: 14px; }
.rp-panel {
  position: absolute; top: calc(100% + 4px); left: 0; z-index: 60;
  background: #fff; border-radius: 8px; box-shadow: 0 6px 16px rgba(0,0,0,.12);
  display: none; overflow: hidden; width: 560px;
}
.rp-panel.show { display: flex; }
.rp-presets { width: 130px; border-right: 1px solid var(--border); padding: 8px 0; flex-shrink: 0; }
.rp-preset { padding: 8px 14px; font-size: 13px; color: var(--text-2); cursor: pointer; }
.rp-preset:hover { background: var(--brand-weak); color: var(--brand); }
.rp-main { flex: 1; padding: 12px; display: flex; flex-direction: column; }
.rp-inputs { display: flex; gap: 8px; margin-bottom: 12px; }
.rp-inputs input { flex: 1; height: 30px; padding: 0 8px; border: 1px solid #d9d9d9; border-radius: 6px; font-size: 13px; }
.rp-inputs input:focus { border-color: var(--brand); outline: none; box-shadow: 0 0 0 2px rgba(255,46,99,.1); }
.rp-cal-wrap { display: flex; gap: 16px; }
.rp-cal { flex: 1; }
.rp-cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.rp-cal-title { font-size: 13px; font-weight: 600; }
.rp-nav { display: flex; gap: 4px; }
.rp-nav button { width: 22px; height: 22px; border: none; background: none; cursor: pointer; color: var(--text-3); border-radius: 4px; font-size: 12px; }
.rp-nav button:hover { background: #f5f5f5; color: var(--text); }
.rp-week { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; font-size: 11px; color: var(--text-3); margin-bottom: 4px; }
.rp-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
.rp-day {
  height: 26px; display: flex; align-items: center; justify-content: center;
  font-size: 12px; color: var(--text); cursor: pointer; border-radius: 4px;
}
.rp-day:hover { background: var(--brand-weak); }
.rp-day.other { color: #bfbfbf; }
.rp-day.in-range { background: rgba(255,46,99,.1); }
.rp-day.start, .rp-day.end { background: var(--brand); color: #fff; }
.rp-day.disabled { color: #d9d9d9; cursor: not-allowed; }

/* ===== 筛选区折叠项 ===== */
.filter-extra { margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--border); }

/* ===== 联想输入 ===== */
.autocomplete { position: relative; }
.autocomplete .ac-panel {
  position: fixed; z-index: 400;
  background: #fff; border-radius: 8px; box-shadow: 0 6px 16px rgba(0,0,0,.12);
  border: 1px solid var(--border); max-height: 220px; overflow-y: auto; display: none;
}
.autocomplete .ac-panel.show { display: block; }
.ac-opt { padding: 8px 14px; font-size: 13px; color: var(--text-2); cursor: pointer; }
.ac-opt:hover { background: var(--brand-weak); color: var(--brand); }
.ac-opt .hl { color: var(--brand); font-weight: 600; }
.ac-empty { padding: 12px 14px; font-size: 13px; color: var(--text-3); }

/* ===== 列表多选框 ===== */
.cb-col { width: 40px; text-align: center; }
.cb-col input[type="checkbox"] { width: 15px; height: 15px; cursor: pointer; accent-color: var(--brand); }

/* ===== 下拉多选（高仿 antd Select multiple） ===== */
.ms-wrap { position: relative; }
.ms-box {
  min-height: 32px; width: 180px; padding: 2px 28px 2px 6px;
  border: 1px solid #d9d9d9; border-radius: 6px; background: #fff; cursor: pointer;
  display: flex; align-items: center; flex-wrap: wrap; gap: 3px; transition: all .2s;
  position: relative;
}
.ms-box:hover { border-color: var(--brand); }
.ms-box.open { border-color: var(--brand); box-shadow: 0 0 0 2px rgba(255,46,99,.1); }
.ms-placeholder { color: #bfbfbf; font-size: 14px; padding: 0 5px; }
.ms-tag {
  display: inline-flex; align-items: center; height: 24px; padding: 0 6px;
  background: #fafafa; border: 1px solid #d9d9d9; border-radius: 4px;
  font-size: 12px; color: var(--text-2); margin: 1px 0;
}
.ms-tag .ms-x { margin-left: 4px; color: #999; cursor: pointer; font-size: 12px; line-height: 1; }
.ms-tag .ms-x:hover { color: var(--brand); }
.ms-tag.more { background: #fff; border-style: dashed; color: var(--text-3); }
.ms-arrow { position: absolute; right: 9px; top: 50%; transform: translateY(-50%); color: #bfbfbf; pointer-events: none; transition: transform .2s; display: flex; }
.ms-box.open .ms-arrow { transform: translateY(-50%) rotate(180deg); }
.ms-panel {
  position: absolute; top: calc(100% + 4px); left: 0; z-index: 60; width: 100%;
  background: #fff; border-radius: 8px; box-shadow: 0 6px 16px rgba(0,0,0,.12);
  padding: 4px; display: none; max-height: 260px; overflow-y: auto;
}
.ms-panel.show { display: block; }
.ms-opt {
  display: flex; align-items: center; gap: 8px; padding: 7px 10px;
  border-radius: 4px; font-size: 14px; cursor: pointer; color: var(--text-2); transition: background .15s;
}
.ms-opt:hover { background: #f5f5f5; }
.ms-opt .opt-check { width: 16px; text-align: center; color: var(--brand); font-weight: 700; visibility: hidden; }
.ms-opt.checked .opt-check { visibility: visible; }
.ms-opt.checked { color: var(--brand); font-weight: 600; }

/* 操作列表头居中 */
.th-op { text-align: center; }

/* 响应式 */
@media (max-width: 900px) {
  .sidebar { display: none; }
  .stat-grid { grid-template-columns: repeat(2, 1fr); }
}
</style>
<style>
  .page-tabs { display: flex; gap: 0; border-bottom: 1px solid var(--border); margin-bottom: 20px; }
  .page-tab { padding: 10px 20px; font-size: 14px; color: var(--text-3); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; transition: all .15s; }
  .page-tab.active { color: var(--brand); font-weight: 600; border-bottom-color: var(--brand); }
  .page-tab:hover { color: var(--brand); }
  .page-tab .tab-count { display: inline-block; min-width: 18px; height: 18px; padding: 0 5px; margin-left: 6px; background: var(--fill-2); border-radius: 9px; font-size: 12px; line-height: 18px; text-align: center; color: var(--text-3); }
  .page-tab.active .tab-count { background: var(--brand-weak); color: var(--brand); }

  .filter-box { background: #fafbfc; border: 1px solid var(--border); border-radius: 10px; padding: 16px 18px 6px; margin-bottom: 18px; }
  .filter-row { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .search-panel { display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-end; }
  .search-item { display: flex; flex-direction: column; gap: 6px; }
  .search-item label { font-size: 12px; color: var(--text-3); }
  .ant-input { height: 32px; padding: 4px 11px; border: 1px solid #d9d9d9; border-radius: 6px; font-size: 14px; color: var(--text); outline: none; background: #fff; transition: all .2s; }
  .ant-input:hover { border-color: var(--brand); }
  .ant-input:focus { border-color: var(--brand); box-shadow: 0 0 0 2px rgba(255,46,99,.1); }
  .ant-input::placeholder { color: #bfbfbf; }
  textarea.ant-input { height: auto; padding: 8px 11px; resize: vertical; min-height: 80px; width: 100%; }
  .filter-actions { display: flex; align-items: center; justify-content: flex-end; gap: 12px; flex-shrink: 0; margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--border); padding-bottom: 18px; }

  .op-link { font-size: 13px; color: var(--brand); cursor: pointer; margin-right: 12px; }
  .op-link:hover { text-decoration: underline; }
  .op-link.danger { color: var(--danger); }
  .op-link.ok { color: var(--ok); }
  .op-link.gray { color: var(--text-3); }
  .op-col { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .op-col .op-link { margin-right: 0; white-space: nowrap; }

  .cell-main { font-size: 14px; font-weight: 500; color: var(--text); }
  .cell-sub { font-size: 12px; color: var(--text-3); margin-top: 2px; font-variant-numeric: tabular-nums; }
  .account-cell { cursor: pointer; }
  .account-cell .cell-main { color: var(--brand); }
  .account-cell:hover .cell-main { text-decoration: underline; }
  .status-cell .reason-link { font-size: 12px; color: var(--danger); cursor: pointer; display: block; margin-top: 3px; }
  .status-cell .reason-link:hover { text-decoration: underline; }

  .table-wrap { overflow-x: auto; }
  .table { min-width: 1180px; }

  .desc-row { display: flex; padding: 9px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
  .desc-row:last-child { border-bottom: none; }
  .desc-label { width: 130px; color: var(--text-3); flex-shrink: 0; }
  .desc-value { flex: 1; color: var(--text); word-break: break-all; }
  .group-title { font-size: 13px; font-weight: 600; color: var(--text); padding: 12px 0 4px; margin-top: 4px; border-bottom: 1px solid var(--border-strong); }

  .form-item { margin-bottom: 16px; }
  .form-label { display: block; font-size: 13px; color: var(--text-2); margin-bottom: 7px; }
  .form-label .req { color: var(--danger); margin-left: 2px; }
  .char-count { text-align: right; font-size: 12px; color: var(--text-3); margin-top: 4px; }

  .batch-bar { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .batch-bar .sel-info { font-size: 13px; color: var(--text-2); }
  .batch-bar .sel-info b { color: var(--brand); }

  /* 手动上传合同 */
  .list-bar { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .radio-cards { display: flex; gap: 10px; flex-wrap: wrap; }
  .radio-card {
    display: inline-flex; align-items: center; gap: 8px; padding: 9px 16px;
    border: 1px solid var(--border-strong); border-radius: 8px; background: #fff;
    font-size: 13px; color: var(--text-2); cursor: pointer; transition: all .15s;
  }
  .radio-card:hover { border-color: var(--brand); color: var(--brand); }
  .radio-card.active { border-color: var(--brand); background: var(--brand-weak); color: var(--brand); font-weight: 600; }
  .radio-card input { accent-color: var(--brand); cursor: pointer; }
  .file-drop {
    display: flex; align-items: center; gap: 10px; padding: 12px 14px; background: #fafbfc;
    border: 1px dashed var(--border-strong); border-radius: 8px; font-size: 13px; color: var(--text-3);
    cursor: pointer; transition: all .15s;
  }
  .file-drop:hover { border-color: var(--brand); color: var(--brand); }
  .file-drop.has { border-style: solid; background: #fff; color: var(--text); }
  .file-drop .fd-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .file-drop .fd-del { color: var(--text-3); flex-shrink: 0; }
  .file-drop .fd-del:hover { color: var(--danger); }

  /* 合同预览文档 */
  .doc-wrap { background: #fff; border: 1px solid var(--border-strong); border-radius: 10px; padding: 32px 36px; }
  .doc-title { font-size: 18px; font-weight: 700; text-align: center; color: var(--text); }
  .doc-no { text-align: center; font-size: 12px; color: var(--text-3); margin-top: 6px; font-variant-numeric: tabular-nums; }
  .doc-line { text-align: center; font-size: 13px; color: var(--text-2); margin-top: 16px; }
  .doc-h2 { font-size: 14px; font-weight: 600; color: var(--text); margin-top: 22px; }
  .doc-p { font-size: 13px; color: var(--text-2); line-height: 1.9; margin-top: 6px; }
  .doc-clause { font-size: 13px; color: var(--text-2); line-height: 1.9; margin-top: 2px; }
  .doc-sign { display: flex; justify-content: space-between; margin-top: 40px; font-size: 13px; color: var(--text-2); }
  .doc-sign div { line-height: 2.2; }

  /* 合同模板 tab 切换 */
  .doc-tabs { display: flex; gap: 8px; margin-bottom: 16px; }
  .doc-tab {
    padding: 8px 18px; border: 1px solid var(--border-strong); border-radius: 8px;
    background: #fff; color: var(--text-2); font-size: 13px; cursor: pointer; transition: all .15s;
  }
  .doc-tab.active { border-color: var(--brand); background: var(--brand-weak); color: var(--brand); font-weight: 600; }

  /* 下载合同多选组 */
  .dl-group { display: flex; flex-direction: column; gap: 10px; }
  .dl-item {
    display: flex; align-items: center; gap: 10px;
    padding: 12px 14px; border: 1px solid var(--border-strong); border-radius: 8px; cursor: pointer; transition: all .15s;
  }
  .dl-item:hover { border-color: var(--brand); }
  .dl-item.checked { border-color: var(--brand); background: var(--brand-weak); }
  .dl-item input[type="checkbox"] { accent-color: var(--brand); width: 16px; height: 16px; cursor: pointer; }
  .dl-item .dl-name { flex: 1; font-size: 14px; color: var(--text); }
  .dl-item .dl-type { font-size: 12px; color: var(--text-3); }
</style>
</head>
<body>
<div id="topbar-root"></div>
<div class="layout">
  <div id="sidebar-root"></div>
  <div class="content">
    <div class="page-head">
      <div class="page-title" id="pageTitle">合同审核</div>
      <div class="page-desc" id="pageDesc">审核生产方提交的合同，控制合同签署流程</div>
    </div>

    <div class="card">
      <div class="filter-box">
        <div class="filter-row">
          <div class="search-panel">
            <!-- 默认外显：合同编号、用户账号、合同类型、审核状态(仅全部) -->
            <div class="search-item">
              <label>合同编号</label>
              <input type="text" class="ant-input" id="searchNo" placeholder="请输入合同编号" style="width:160px">
            </div>
            <div class="search-item">
              <label>用户账号</label>
              <div class="autocomplete">
                <input type="text" class="ant-input" id="searchAccount" placeholder="输入账号名称/ID" style="width:170px" autocomplete="off" oninput="acInput('searchAccount','searchAccountPanel','searchAccountHidden', accountOptions(), '无匹配的账号')" onfocus="acInput('searchAccount','searchAccountPanel','searchAccountHidden', accountOptions(), '无匹配的账号')">
                <input type="hidden" id="searchAccountHidden" value="">
                <div class="ac-panel" id="searchAccountPanel"></div>
              </div>
            </div>
            <div class="search-item">
              <label>授权主体</label>
              <input type="text" class="ant-input" id="searchSubjectName" placeholder="请输入授权主体" style="width:170px">
            </div>
            <!-- 审核状态（仅全部子页，默认外显） -->
            <div class="search-item" id="statusWrap" style="display:none">
              <label>审核状态</label>
              <div class="ms-wrap">
                <div class="ms-box" id="statusBox" onclick="toggleMsPanel('statusPanel','statusBox',event)">
                  <div id="statusContent" style="display:flex;align-items:center;flex-wrap:wrap;gap:3px"></div>
                  <span class="ms-arrow"><svg viewBox="0 0 20 20" fill="none" width="14" height="14"><path d="m5 8 5 5 5-5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
                </div>
                <div class="ms-panel" id="statusPanel"></div>
              </div>
            </div>
          </div>
          <span class="op-link" id="expandToggle" onclick="toggleExpand()">展开筛选 ▾</span>
        </div>

        <!-- 折叠筛选项 -->
        <div class="search-panel filter-extra" id="expandPanel" style="display:none">
          <div class="search-item">
            <label>合同名称</label>
            <input type="text" class="ant-input" id="searchName" placeholder="请输入合同名称" style="width:180px">
          </div>
          <div class="search-item">
            <label>合同类型</label>
            <div class="ms-wrap">
              <div class="ms-box" id="typeBox" onclick="toggleMsPanel('typePanel','typeBox',event)">
                <div id="typeContent" style="display:flex;align-items:center;flex-wrap:wrap;gap:3px"></div>
                <span class="ms-arrow"><svg viewBox="0 0 20 20" fill="none" width="14" height="14"><path d="m5 8 5 5 5-5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
              </div>
              <div class="ms-panel" id="typePanel"></div>
            </div>
          </div>
          <div class="search-item">
            <label>手机号</label>
            <input type="text" class="ant-input" id="searchPhone" placeholder="请输入手机号" style="width:160px">
          </div>
          <div class="search-item">
            <label>商务</label>
            <select class="ant-input" id="searchBusiness" style="width:120px">
              <option value="">全部</option>
              <option>枥文</option>
              <option>冰雨</option>
              <option>禾呈</option>
              <option>芋头</option>
              <option>泰瑞</option>
              <option>大料</option>
            </select>
          </div>
          <div class="search-item">
            <label>提交时间</label>
            <div class="rp-wrap" id="rpSubmitWrap"></div>
          </div>
          <!-- 审核人（仅全部子页） -->
          <div class="search-item" id="reviewerWrap" style="display:none">
            <label>审核人</label>
            <div class="autocomplete">
              <input type="text" class="ant-input" id="searchReviewer" placeholder="输入审核人" style="width:140px" autocomplete="off" oninput="acInput('searchReviewer','searchReviewerPanel','searchReviewerHidden', REVIEWERS, '无匹配的审核人')" onfocus="acInput('searchReviewer','searchReviewerPanel','searchReviewerHidden', REVIEWERS, '无匹配的审核人')">
              <input type="hidden" id="searchReviewerHidden" value="">
              <div class="ac-panel" id="searchReviewerPanel"></div>
            </div>
          </div>
          <!-- 审核时间（仅全部子页） -->
          <div class="search-item" id="reviewTimeWrap" style="display:none">
            <label>审核时间</label>
            <div class="rp-wrap" id="rpReviewWrap"></div>
          </div>
          <!-- 签约时间（仅全部子页） -->
          <div class="search-item" id="signTimeWrap" style="display:none">
            <label>签约时间</label>
            <div class="rp-wrap" id="rpSignWrap"></div>
          </div>
        </div>
        <div class="filter-actions">
          <button class="btn btn-primary" onclick="renderList()">搜索</button>
          <button class="btn btn-outline" onclick="resetSearch()">重置</button>
        </div>
      </div>

      <!-- 批量操作栏 -->
      <div class="list-bar">
        <button class="btn btn-primary btn-sm" onclick="openManualUpload()">手动上传</button>
        <button class="btn btn-primary btn-sm" onclick="batchPass()">批量通过</button>
        <button class="btn btn-danger btn-sm" onclick="batchReject()">批量驳回</button>
      </div>

      <div class="batch-bar">
        <span class="sel-info">已选 <b id="selCount">0</b> 项</span>
      </div>

      <div class="table-wrap">
        <table class="table">
          <thead id="tableHead"></thead>
          <tbody id="contractList"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<!-- 合同详情弹窗（含通过/驳回操作） -->
<div class="modal-mask" id="detailModal">
  <div class="modal modal-lg" style="width:640px">
    <div class="modal-head">
      <div class="modal-title">合同详情</div>
      <span class="modal-close" onclick="closeModal('detailModal')"><svg viewBox="0 0 20 20" fill="none" width="20" height="20"><path d="m5 5 10 10M15 5 5 15" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></span>
    </div>
    <div class="modal-body" id="detailBody"></div>
    <div class="modal-foot" id="detailFoot"></div>
  </div>
</div>

<!-- 手动上传合同弹窗 -->
<div class="modal-mask" id="manualModal">
  <div class="modal" style="width:560px">
    <div class="modal-head">
      <div class="modal-title">手动上传合同</div>
      <span class="modal-close" onclick="closeManualUpload()"><svg viewBox="0 0 20 20" fill="none" width="20" height="20"><path d="m5 5 10 10M15 5 5 15" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></span>
    </div>
    <div class="modal-body">
      <div class="form-item">
        <label class="form-label">主体<span class="req">*</span></label>
        <div class="autocomplete">
          <input type="text" class="ant-input" id="muSubject" placeholder="请选择或输入主体名称" autocomplete="off" style="width:100%"
            oninput="acInput('muSubject','muSubjectPanel','muSubjectValue', MU_SUBJECT_NAMES, '无匹配的主体')"
            onfocus="acInput('muSubject','muSubjectPanel','muSubjectValue', MU_SUBJECT_NAMES, '无匹配的主体')">
          <input type="hidden" id="muSubjectValue" value="">
          <div class="ac-panel" id="muSubjectPanel"></div>
        </div>
        <div class="form-hint" style="font-size:12px;color:var(--text-3);margin-top:6px">仅可选认证状态为「已认证」的主体</div>
      </div>

      <!-- 甲方信息（随合同一起落库） -->
      <div class="group-title" style="margin-top:0">甲方信息</div>
      <div class="form-row">
        <div class="form-item">
          <label class="form-label">联系人<span class="req">*</span></label>
          <input type="text" class="ant-input" id="muPaContact" placeholder="请输入联系人" style="width:100%">
        </div>
        <div class="form-item">
          <label class="form-label">联系电话<span class="req">*</span></label>
          <input type="text" class="ant-input" id="muPaPhone" placeholder="请输入联系电话" style="width:100%">
        </div>
      </div>
      <div class="form-row">
        <div class="form-item">
          <label class="form-label">联系邮箱<span class="req">*</span></label>
          <input type="text" class="ant-input" id="muPaEmail" placeholder="请输入联系邮箱" style="width:100%">
        </div>
        <div class="form-item">
          <label class="form-label">合作期限<span class="req">*</span></label>
          <input type="text" class="ant-input" id="muPaTerm" placeholder="如：1 年 / 24 个月" style="width:100%">
        </div>
      </div>

      <div class="form-item">
        <label class="form-label">合同文件<span class="req">*</span></label>
        <div class="radio-cards">
          <label class="radio-card active" id="muTypeEsign" onclick="setMuType('esign')">
            <input type="radio" name="muType" value="esign" checked>e签宝合同
          </label>
          <label class="radio-card" id="muTypeOffline" onclick="setMuType('offline')">
            <input type="radio" name="muType" value="offline">线下合同
          </label>
        </div>
      </div>

      <!-- e签宝：单行输入合同名称 / 合同ID -->
      <div id="muEsignBlock">
        <div class="form-item">
          <label class="form-label">授权入驻合同<span class="req">*</span></label>
          <input type="text" class="ant-input" id="muFw" placeholder="请输入授权入驻合同的合同名称 / 合同ID" style="width:100%">
        </div>
        <div class="form-item" style="margin-bottom:0">
          <label class="form-label">保密协议<span class="req">*</span></label>
          <input type="text" class="ant-input" id="muNda" placeholder="请输入保密协议的合同名称 / 合同ID" style="width:100%">
        </div>
      </div>

      <!-- 线下合同：上传 PDF -->
      <div id="muOfflineBlock" style="display:none">
        <div class="form-item">
          <label class="form-label">授权入驻合同（PDF）<span class="req">*</span></label>
          <div class="file-drop" id="muFwDrop" onclick="pickMuFile('framework')"></div>
        </div>
        <div class="form-item" style="margin-bottom:0">
          <label class="form-label">保密协议（PDF）<span class="req">*</span></label>
          <div class="file-drop" id="muNdaDrop" onclick="pickMuFile('nda')"></div>
        </div>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-outline" onclick="closeManualUpload()">取消</button>
      <button class="btn btn-primary" onclick="submitManualUpload()">确定</button>
    </div>
  </div>
</div>

<!-- 模板预览弹窗 -->
<div class="modal-mask" id="previewModal">
  <div class="modal modal-lg" style="width:760px">
    <div class="modal-head">
      <div class="modal-title">模板预览</div>
      <span class="modal-close" onclick="closeModal('previewModal')"><svg viewBox="0 0 20 20" fill="none" width="20" height="20"><path d="m5 5 10 10M15 5 5 15" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></span>
    </div>
    <div class="modal-body">
      <div class="doc-tabs" id="previewTabs"></div>
      <div id="previewModalBody"></div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-outline" onclick="closeModal('previewModal')">关闭</button>
    </div>
  </div>
</div>

<!-- 下载合同弹窗（多选） -->
<div class="modal-mask" id="downloadModal">
  <div class="modal" style="width:440px">
    <div class="modal-head">
      <div class="modal-title">下载合同</div>
      <span class="modal-close" onclick="closeModal('downloadModal')"><svg viewBox="0 0 20 20" fill="none" width="20" height="20"><path d="m5 5 10 10M15 5 5 15" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></span>
    </div>
    <div class="modal-body">
      <div class="dl-group" id="downloadGroup"></div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-outline" onclick="closeModal('downloadModal')">取消</button>
      <button class="btn btn-primary" onclick="confirmDownload()">下载</button>
    </div>
  </div>
</div>

<!-- 审核通过：填写甲方信息 -->
<div class="modal-mask" id="bizModal">
  <div class="modal" style="width:520px">
    <div class="modal-head">
      <div class="modal-title">甲方信息</div>
      <span class="modal-close" onclick="closeModal('bizModal')"><svg viewBox="0 0 20 20" fill="none" width="20" height="20"><path d="m5 5 10 10M15 5 5 15" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></span>
    </div>
    <div class="modal-body">
      <div style="font-size:12px;color:var(--text-3);margin:0 0 16px">审核通过前，请补全甲方（平台方）信息，填写完成后提交进入下一环节。</div>
      <div class="form-item">
        <label class="form-label">联系人<span class="req">*</span></label>
        <input type="text" class="ant-input" id="paContact" placeholder="请输入联系人" style="width:100%">
      </div>
      <div class="form-item">
        <label class="form-label">联系电话<span class="req">*</span></label>
        <input type="text" class="ant-input" id="paPhone" placeholder="请输入联系电话" maxlength="11" style="width:100%">
      </div>
      <div class="form-item">
        <label class="form-label">联系邮箱<span class="req">*</span></label>
        <input type="text" class="ant-input" id="paEmail" placeholder="请输入联系邮箱" style="width:100%">
      </div>
      <div class="form-item" style="margin-bottom:0">
        <label class="form-label">合作期限<span class="req">*</span></label>
        <input type="text" class="ant-input" id="paTerm" placeholder="如：1 年 / 24 个月" style="width:100%">
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-outline" onclick="closeModal('bizModal')">取消</button>
      <button class="btn btn-primary" onclick="confirmBiz()">提交</button>
    </div>
  </div>
</div>

<!-- 驳回原因弹窗 -->
<div class="modal-mask" id="rejectModal">
  <div class="modal">
    <div class="modal-head">
      <div class="modal-title">驳回</div>
      <span class="modal-close" onclick="closeModal('rejectModal')"><svg viewBox="0 0 20 20" fill="none" width="20" height="20"><path d="m5 5 10 10M15 5 5 15" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></span>
    </div>
    <div class="modal-body">
      <div class="desc-row"><div class="desc-label">合同</div><div class="desc-value" id="rejectContractName"></div></div>
      <div class="form-item" style="margin-top:14px;margin-bottom:0">

// ============================================================
// 通用时间范围选择器（精确到秒 / 精确到日），C 端、B 端共用
// 用法：var p = createRangePicker('wrapId', { dateOnly:false });
//   p.get() 返回 {start,end}；p.reset() 清空
// ============================================================
function dateStr(d) {
  function p(n) { return (n < 10 ? '0' : '') + n; }
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
}

var RP_PRESETS = [
  { label: '今日', get: function () { var d = new Date(); return [dateStr(d), dateStr(d)]; } },
  { label: '昨日', get: function () { var d = new Date(); d.setDate(d.getDate() - 1); return [dateStr(d), dateStr(d)]; } },
  { label: '本周', get: function () { var s = new Date(); s.setDate(s.getDate() - s.getDay()); var e = new Date(s); e.setDate(e.getDate() + 6); return [dateStr(s), dateStr(e)]; } },
  { label: '本月', get: function () { var s = new Date(); s.setDate(1); var e = new Date(s.getFullYear(), s.getMonth() + 1, 0); return [dateStr(s), dateStr(e)]; } },
  { label: '今年', get: function () { var s = new Date(); s.setMonth(0, 1); var e = new Date(s.getFullYear(), 11, 31); return [dateStr(s), dateStr(e)]; } }
];

var _rpRegistry = {};

function createRangePicker(wrapId, opts) {
  opts = opts || {};
  var dateOnly = !!opts.dateOnly;
  var self = {
    wrapId: wrapId, dateOnly: dateOnly,
    start: null, end: null, focusCal: 'start',
    calStartDate: new Date(), calEndDate: new Date()
  };
  _rpRegistry[wrapId] = self;

  self.render = function () {
    var ph = dateOnly ? 'YYYY-MM-DD' : 'YYYY-MM-DD HH:mm:ss';
    document.getElementById(wrapId).innerHTML =
      '<div class="rp-box" id="' + wrapId + 'Box" onclick="rpToggle(\'' + wrapId + '\',event)">' +
        '<span class="rp-val ph" id="' + wrapId + 'StartVal">' + t('开始时间') + '</span>' +
        '<span class="rp-sep">→</span>' +
        '<span class="rp-val ph" id="' + wrapId + 'EndVal">' + t('结束时间') + '</span>' +
      '</div>' +
      '<div class="rp-panel" id="' + wrapId + 'Panel">' +
        '<div class="rp-presets" id="' + wrapId + 'Presets"></div>' +
        '<div class="rp-main">' +
          '<div class="rp-inputs">' +
            '<input type="text" id="' + wrapId + 'StartInput" placeholder="' + ph + '" readonly onclick="rpFocus(\'' + wrapId + '\',\'start\')">' +
            '<input type="text" id="' + wrapId + 'EndInput" placeholder="' + ph + '" readonly onclick="rpFocus(\'' + wrapId + '\',\'end\')">' +
          '</div>' +
          '<div class="rp-cal-wrap">' +
            '<div class="rp-cal" id="' + wrapId + 'CalStart"></div>' +
            '<div class="rp-cal" id="' + wrapId + 'CalEnd"></div>' +
          '</div>' +
        '</div>' +
      '</div>';
    self.renderPresets();
    self.renderCals();
    self.sync();
  };

  self.renderPresets = function () {
    var html = RP_PRESETS.map(function (p, i) {
      return '<div class="rp-preset" onclick="rpApplyPreset(\'' + wrapId + '\',' + i + ')">' + t(p.label) + '</div>';
    }).join('');
    document.getElementById(wrapId + 'Presets').innerHTML = html;
  };

  self.applyPreset = function (i) {
    var r = RP_PRESETS[i].get();
    self.start = dateOnly ? r[0] : r[0] + ' 00:00:00';
    self.end = dateOnly ? r[1] : r[1] + ' 23:59:59';
    self.sync();
  };

  self.togglePanel = function (e) {
    if (e) e.stopPropagation();
    var panel = document.getElementById(wrapId + 'Panel');
    var box = document.getElementById(wrapId + 'Box');
    var open = panel.classList.contains('show');
    panel.classList.toggle('show', !open);
    box.classList.toggle('open', !open);
    if (!open) self.renderCals();
  };

  self.sync = function () {
    document.getElementById(wrapId + 'StartInput').value = self.start || '';
    document.getElementById(wrapId + 'EndInput').value = self.end || '';
    var sv = document.getElementById(wrapId + 'StartVal');
    var ev = document.getElementById(wrapId + 'EndVal');
    if (self.start) { sv.textContent = self.start; sv.classList.remove('ph'); } else { sv.textContent = t('开始时间'); sv.classList.add('ph'); }
    if (self.end) { ev.textContent = self.end; ev.classList.remove('ph'); } else { ev.textContent = t('结束时间'); ev.classList.add('ph'); }
    self.renderCals();
  };

  self.renderCal = function (containerId, viewDate) {
    var y = viewDate.getFullYear(), m = viewDate.getMonth();
    var first = new Date(y, m, 1);
    var startDay = first.getDay();
    var daysInMonth = new Date(y, m + 1, 0).getDate();
    var daysInPrev = new Date(y, m, 0).getDate();
    var cells = [];
    for (var i = 0; i < 42; i++) {
      var dnum, cls = 'rp-day', dayObj;
      if (i < startDay) {
        dnum = daysInPrev - startDay + 1 + i; cls += ' other';
        dayObj = new Date(y, m - 1, dnum);
      } else if (i >= startDay + daysInMonth) {
        dnum = i - startDay - daysInMonth + 1; cls += ' other';
        dayObj = new Date(y, m + 1, dnum);
      } else {
        dnum = i - startDay + 1;
        dayObj = new Date(y, m, dnum);
      }
      var ds = dateStr(dayObj);
      if (self.start && ds === self.start.slice(0, 10)) cls += ' start';
      if (self.end && ds === self.end.slice(0, 10)) cls += ' end';
      if (self.start && self.end) {
        var sd = self.start.slice(0, 10), ed = self.end.slice(0, 10);
        if (ds > sd && ds < ed) cls += ' in-range';
      }
      cells.push('<div class="' + cls + '" onclick="rpPickDay(\'' + wrapId + '\',\'' + ds + '\')">' + dnum + '</div>');
    }
    var weekArr = isEnglish() ? ['Su','Mo','Tu','We','Th','Fr','Sa'] : ['日','一','二','三','四','五','六'];
    var weekHtml = weekArr.map(function (w) { return '<div>' + w + '</div>'; }).join('');
    var monthNames = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    var calTitle = isEnglish() ? (monthNames[m] + ' ' + y) : (y + ' 年 ' + (m + 1) + ' 月');
    document.getElementById(containerId).innerHTML =
      '<div class="rp-cal-head"><div class="rp-cal-title">' + calTitle + '</div>' +
      '<div class="rp-nav"><button onclick="rpNavCal(\'' + wrapId + '\',\'' + containerId + '\',-1,event)">‹</button><button onclick="rpNavCal(\'' + wrapId + '\',\'' + containerId + '\',1,event)">›</button></div></div>' +
      '<div class="rp-week">' + weekHtml + '</div>' +
      '<div class="rp-grid">' + cells.join('') + '</div>';
  };

  self.renderCals = function () {
    self.renderCal(wrapId + 'CalStart', self.calStartDate);
    self.renderCal(wrapId + 'CalEnd', self.calEndDate);
  };

  self.navCal = function (cid, delta) {
    if (cid === wrapId + 'CalStart') self.calStartDate.setMonth(self.calStartDate.getMonth() + delta);
    else self.calEndDate.setMonth(self.calEndDate.getMonth() + delta);
    self.renderCals();
  };

  self.pickDay = function (ds) {
    if (self.focusCal === 'start') {
      self.start = dateOnly ? ds : ds + ' 00:00:00';
      self.focusCal = 'end';
    } else {
      self.end = dateOnly ? ds : ds + ' 23:59:59';
      self.focusCal = 'start';
    }
    if (self.start && self.end && self.start > self.end) {
      var t2 = self.start; self.start = self.end; self.end = t2;
    }
    self.sync();
  };

  self.reset = function () { self.start = null; self.end = null; self.sync(); };
  self.get = function () { return { start: self.start, end: self.end }; };

  self.render();
  return self;
}

// options 为字符串数组；点击选项写入 input 显示值 + hidden 存值
function acInput(inputId, panelId, hiddenId, options, emptyText) {
  var input = document.getElementById(inputId);
  var panel = document.getElementById(panelId);
  var kw = input.value.trim();
  var matches = options.filter(function (o) { return o.indexOf(kw) !== -1; });

  if (matches.length === 0) {
    panel.innerHTML = '<div class="ac-empty">' + (emptyText || '无匹配项') + '</div>';
  } else {
    panel.innerHTML = matches.map(function (o) {
      var idx = o.indexOf(kw);
      var label = kw ? o.slice(0, idx) + '<span class="hl">' + o.slice(idx, idx + kw.length) + '</span>' + o.slice(idx + kw.length) : o;
      return '<div class="ac-opt" onclick="acSelect(\'' + inputId + '\',\'' + panelId + '\',\'' + hiddenId + '\',\'' + o + '\')">' + label + '</div>';
    }).join('');
  }

  var rect = input.getBoundingClientRect();
  panel.style.left = rect.left + 'px';
  panel.style.top = (rect.bottom + 4) + 'px';
  panel.style.width = rect.width + 'px';
  panel.classList.add('show');
}
function acSelect(inputId, panelId, hiddenId, value) {
  document.getElementById(inputId).value = value;
  document.getElementById(hiddenId).value = value;
  document.getElementById(panelId).classList.remove('show');
}

// 下拉多选渲染：renderMsMulti(options, selected, contentId, panelId, toggleFn, removeFn, placeholder)
function renderMsMulti(options, selected, contentId, panelId, toggleFn, removeFn, placeholder) {
  var c = document.getElementById(contentId);
  var MAX_TAGS = 2;
  if (selected.length === 0) {
    c.innerHTML = '<span class="ms-placeholder">' + (placeholder || '全部') + '</span>';
  } else {
    var html = '';
    var shown = selected.slice(0, MAX_TAGS);
    shown.forEach(function (k) {
      var label = labelOfOpt(options, k);
      html += '<span class="ms-tag">' + label + '<span class="ms-x" onclick="' + removeFn + '(\'' + escQ(k) + '\', event)">×</span></span>';
    });
    if (selected.length > MAX_TAGS) html += '<span class="ms-tag more">+ ' + (selected.length - MAX_TAGS) + '</span>';
    c.innerHTML = html;
  }
  var panel = document.getElementById(panelId);
  panel.innerHTML = options.map(function (s) {
    var key = s.key !== undefined ? s.key : s;
    var label = s.label !== undefined ? s.label : s;
    var checked = selected.indexOf(key) !== -1;
    return '<div class="ms-opt' + (checked ? ' checked' : '') + '" onclick="' + toggleFn + '(\'' + escQ(key) + '\', event)">' +
      '<span class="opt-check">✓</span>' + label + '</div>';
  }).join('');
}
function labelOfOpt(options, k) {
  var o = options.find(function (x) { return (x.key !== undefined ? x.key : x) === k; });
  if (!o) return k;
  return o.label !== undefined ? o.label : o;
}
function escQ(s) { return String(s).replace(/\\/g, '\\\\').replace(/'/g, "\\'"); }
function toggleMsPanel(panelId, boxId, e) {
  e.stopPropagation();
  var panel = document.getElementById(panelId);
  var box = document.getElementById(boxId);
  var open = panel.classList.contains('show');
  panel.classList.toggle('show', !open);
  box.classList.toggle('open', !open);
}
function toggleInArr(arr, k) {
  var i = arr.indexOf(k);
  if (i === -1) arr.push(k); else arr.splice(i, 1);
}

// 可搜索多选：内容区显示 tag，面板含搜索框 + 过滤选项
// searchMultiRender(contentId, panelId, searchInputId, options, selected, toggleFn, removeFn, placeholder)
function searchMultiRender(contentId, panelId, searchInputId, options, selected, toggleFn, removeFn, placeholder) {
  var c = document.getElementById(contentId);
  var MAX_TAGS = 3;
  if (selected.length === 0) {
    c.innerHTML = '<span class="ms-placeholder">' + (placeholder || '请选择') + '</span>';
  } else {
    var html = '';
    var shown = selected.slice(0, MAX_TAGS);
    shown.forEach(function (k) {
      html += '<span class="ms-tag">' + labelOfOpt(options, k) + '<span class="ms-x" onclick="' + removeFn + '(\'' + escQ(k) + '\', event)">×</span></span>';
    });
    if (selected.length > MAX_TAGS) html += '<span class="ms-tag more">+ ' + (selected.length - MAX_TAGS) + '</span>';
    c.innerHTML = html;
  }
  searchMultiFilter(panelId, searchInputId, options, selected, toggleFn);
}
function searchMultiFilter(panelId, searchInputId, options, selected, toggleFn) {
  var panel = document.getElementById(panelId);
  var kw = (document.getElementById(searchInputId).value || '').trim().toLowerCase();
  var list = options.filter(function (o) {
    var label = (o.label !== undefined ? o.label : o).toLowerCase();
    var key = String(o.key !== undefined ? o.key : o).toLowerCase();
    return !kw || label.indexOf(kw) !== -1 || key.indexOf(kw) !== -1;
  });
  panel.innerHTML = list.map(function (s) {
    var key = s.key !== undefined ? s.key : s;
    var label = s.label !== undefined ? s.label : s;
    var checked = selected.indexOf(key) !== -1;
    return '<div class="ms-opt' + (checked ? ' checked' : '') + '" onclick="' + toggleFn + '(\'' + escQ(key) + '\', event)">' +
      '<span class="opt-check">✓</span>' + label + '</div>';
  }).join('');
  if (list.length === 0) panel.innerHTML = '<div class="ac-empty">无匹配项</div>';
}

  function nextContractNo() {
    var d = new Date();
    var ym = d.getFullYear() + ('0' + (d.getMonth() + 1)).slice(-2);
    var prefix = 'HT' + ym + '-';
    var max = 0;
    DEMO_CONTRACTS.forEach(function (c) {
      if (c.no.indexOf(prefix) === 0) {
        var n = parseInt(c.no.slice(prefix.length), 10);
        if (!isNaN(n) && n > max) max = n;
      }
    });
    return prefix + ('00' + (max + 1)).slice(-3);
  }

  function submitManualUpload() {
    var subjName = document.getElementById('muSubject').value.trim();
    var subj = null;
    MU_SUBJECTS.forEach(function (x) { if (x.company === subjName) subj = x; });
    if (!subj) { showToast('请从下拉列表中选择主体', 'err'); return; }

    var paContact = document.getElementById('muPaContact').value.trim();
    var paPhone = document.getElementById('muPaPhone').value.trim();
    var paEmail = document.getElementById('muPaEmail').value.trim();
    var paTerm = document.getElementById('muPaTerm').value.trim();
    if (!paContact) { showToast('请输入联系人', 'err'); return; }
    if (!paPhone) { showToast('请输入联系电话', 'err'); return; }
    if (!paEmail) { showToast('请输入联系邮箱', 'err'); return; }
    if (!paTerm) { showToast('请输入合作期限', 'err'); return; }

    var docsInfo = null;
    if (MU_TYPE === 'esign') {
      var fw = document.getElementById('muFw').value.trim();
      var nda = document.getElementById('muNda').value.trim();
      if (!fw) { showToast('请输入授权入驻合同的合同名称 / 合同ID', 'err'); return; }
      if (!nda) { showToast('请输入保密协议的合同名称 / 合同ID', 'err'); return; }
      docsInfo = { type: 'esign', framework: fw, nda: nda };
    } else {
      if (!MU_FILES.framework) { showToast('请上传授权入驻合同 PDF', 'err'); return; }
      if (!MU_FILES.nda) { showToast('请上传保密协议 PDF', 'err'); return; }
      docsInfo = { type: 'offline', framework: MU_FILES.framework, nda: MU_FILES.nda };
    }

    var now = nowStr();
    var rec = {
      no: nextContractNo(),
      company: subj.company,
      docs: ['framework', 'nda'],
      status: 'done',
      accountName: subj.accountName, accountId: subj.accountId,
      subjectName: subj.subjectName, subjectId: subj.subjectId, subjectType: 'company',
      contactName: subj.contactName, contactPhone: subj.contactPhone,
      business: subj.business,
      generateTime: now, signTime: now,
      reviewer: CURRENT_OPERATOR, reviewStage: '', reviewTime: now,
      partyAInfo: { contact: paContact, phone: paPhone, email: paEmail, term: paTerm, submitTime: now },
      partyB: pb(subj.company, subj.contactAddr, subj.contactName, subj.contactPhone, subj.contactEmail, subj.company, subj.bankAccount, subj.bankEn),
      refillReason: '',
      manualDocs: docsInfo
    };
    DEMO_CONTRACTS.unshift(rec);
    closeManualUpload();
    renderList();
    showToast('已新增已签署合同：' + rec.no, 'ok');
  }

  function filteredContracts() {
    var no = document.getElementById('searchNo').value.trim();
    var name = document.getElementById('searchName').value.trim();
    var account = document.getElementById('searchAccountHidden').value;
    var subjectName = document.getElementById('searchSubjectName').value.trim();
    var phone = document.getElementById('searchPhone').value.trim();
    var business = document.getElementById('searchBusiness').value;
    var reviewer = document.getElementById('searchReviewerHidden').value;
    var sign = signPicker.get();
    var rv = reviewPicker.get();
    var sb = submitPicker.get();
    return DEMO_CONTRACTS.filter(function (c) {
      if (no && c.no.indexOf(no) === -1) return false;
      var fullName = c.company + ' 授权入驻合同';
      if (name && fullName.indexOf(name) === -1) return false;
      if (account && (c.accountName + '(' + c.accountId + ')') !== account) return false;
      if (subjectName && c.company.indexOf(subjectName) === -1) return false;
      if (phone && c.contactPhone.indexOf(phone) === -1) return false;
      if (business && c.business !== business) return false;
      if (sb.start && (!c.generateTime || c.generateTime < sb.start)) return false;
      if (sb.end && (!c.generateTime || c.generateTime > sb.end)) return false;
      if (selectedTypes.length > 0 && selectedTypes.indexOf('settle') === -1) return false;
      if (VIEW === 'all') {
        if (selectedStatus.length > 0 && selectedStatus.indexOf(c.status) === -1) return false;
        if (reviewer && c.reviewer !== reviewer) return false;
        if (sign.start && (!c.signTime || c.signTime < sign.start)) return false;
        if (sign.end && (!c.signTime || c.signTime > sign.end)) return false;
        if (rv.start && (!c.reviewTime || c.reviewTime < rv.start)) return false;
        if (rv.end && (!c.reviewTime || c.reviewTime > rv.end)) return false;
      }
      return true;
    });
  }

  function resetSearch() {
    document.getElementById('searchNo').value = '';
    document.getElementById('searchName').value = '';
    document.getElementById('searchAccount').value = '';
    document.getElementById('searchAccountHidden').value = '';
    document.getElementById('searchSubjectName').value = '';
    document.getElementById('searchPhone').value = '';
    document.getElementById('searchBusiness').value = '';
    document.getElementById('searchReviewer').value = '';
    document.getElementById('searchReviewerHidden').value = '';
    selectedTypes = []; selectedStatus = [];
    signPicker.reset(); reviewPicker.reset(); submitPicker.reset();
    renderType(); renderStatus();
    selected = [];
    renderList();
  }

  function renderHead() {
    var cols = [['', '40px'], ['合同', '250px'], ['用户账号', '185px'], ['授权主体', '230px'], ['姓名', '100px'], ['手机号', '130px'], ['商务', '80px'], ['合同类型', '132px'], ['审核状态', '110px'], ['审核人', '80px'], ['提交时间', '160px'], ['审核时间', '160px'], ['签约时间', '160px'], ['操作', '200px']];
    document.getElementById('tableHead').innerHTML = '<tr>' + cols.map(function (c) {
      if (c[0] === '') return '<th class="cb-col sticky-l" style="width:' + c[1] + '"><input type="checkbox" id="checkAll" onchange="toggleCheckAll()"></th>';
      if (c[0] === '合同') return '<th class="sticky-l2" style="width:' + c[1] + '">' + c[0] + '</th>';
      if (c[0] === '操作') return '<th class="th-op sticky-r" style="width:' + c[1] + '">' + c[0] + '</th>';
      return '<th style="width:' + c[1] + '">' + c[0] + '</th>';
    }).join('') + '</tr>';
  }

  function renderStatusCell(c) {
    if (c.status === 'refill') {
      return '<div class="status-cell">' + contractStatusTag(c.status) +
        '<span class="reason-link" onclick="viewRejectReason(\'' + c.no + '\')">查看原因</span></div>';
    }
    return contractStatusTag(c.status);
  }

  // 操作列：详情 + 模板预览 + 合同下载（仅已签署）
  function renderOps(c) {
    var ops = [];
    ops.push('<span class="op-link" onclick="viewDetail(\'' + c.no + '\')">详情</span>');
    // 已签署合同不再展示「模板预览」
    if (c.status !== 'done') {
      ops.push('<span class="op-link" onclick="previewContract(\'' + c.no + '\')">模板预览</span>');
    }
    if (c.status === 'done') {
      ops.push('<span class="op-link" onclick="downloadContract(\'' + c.no + '\')">合同下载</span>');
    }
    return '<div class="op-col">' + ops.join('') + '</div>';
  }

  function renderList() {
    var list = filteredContracts();
    renderHead();
    document.getElementById('checkAll').checked = false;

    var tbody = document.getElementById('contractList');
    var colSpan = 14;
    if (list.length === 0) {
      tbody.innerHTML = '<tr><td colspan="' + colSpan + '"><div class="empty"><div class="empty-text">暂无相关合同</div></div></td></tr>';
      return;
    }
    tbody.innerHTML = list.map(function (c) {
      var checked = selected.indexOf(c.no) !== -1;
      var accountCell = '<div class="account-cell" onclick="viewAccount(\'' + c.accountId + '\')">' +
        '<div class="cell-main" style="white-space:nowrap">' + c.accountName + '（' + c.accountId + '）</div>' +
        '<div class="cell-sub">' + (c.subjectName || '—') + '</div>' +
      '</div>';
      var row = '<tr>' +
        '<td class="cb-col sticky-l"><input type="checkbox" ' + (checked ? 'checked' : '') + ' onchange="toggleSelect(\'' + c.no + '\')"></td>' +
        '<td class="sticky-l2"><div class="cell-main">' + c.company + ' 授权入驻合同</div><div class="cell-sub">' + c.no + '</div></td>' +
        '<td>' + accountCell + '</td>' +
        '<td>' + (c.company || '—') + '</td>' +
        '<td>' + (c.contactName || '—') + '</td>' +
        '<td class="mono text-2">' + (c.contactPhone || '—') + '</td>' +
        '<td>' + (c.business || '—') + '</td>' +
        '<td style="white-space:nowrap">授权入驻合同</td>';
      if (VIEW === 'all') {
        row += '<td>' + renderStatusCell(c) + '</td>' +
          '<td>' + (c.reviewer || '—') + '</td>';
      }
      row += '<td class="mono text-2">' + (c.generateTime || '—') + '</td>';
      if (VIEW === 'all') {
        row += '<td class="mono text-2">' + (c.reviewTime || '—') + '</td>' +
          '<td class="mono text-2">' + (c.signTime || '—') + '</td>';
      }
      row += '<td class="sticky-r">' + renderOps(c) + '</td></tr>';
      return row;
    }).join('');
  }

  // ========== 多选 ==========
  function toggleSelect(no) { toggleInArr(selected, no); renderList(); }
  function toggleCheckAll() {
    var all = document.getElementById('checkAll').checked;
    var list = filteredContracts();
    if (all) list.forEach(function (c) { if (selected.indexOf(c.no) === -1) selected.push(c.no); });
    else { var ids = list.map(function (c) { return c.no; }); selected = selected.filter(function (no) { return ids.indexOf(no) === -1; }); }
    renderList();
  }
  function selectedContracts() { return selected.map(findContract).filter(Boolean); }

  // ========== 详情（含通过/驳回） ==========
  function viewDetail(no) {
    var c = findContract(no);
    currentContractNo = no;
    var html = '';

    // 乙方信息
    html += '<div class="group-title" style="margin-top:0">乙方信息</div>';
    c.partyB.forEach(function (f) { html += fieldRow(f.label, f.value || '—'); });

    // 甲方信息（审核通过时填写的四项）
    var pa = c.partyAInfo || {};
    html += '<div class="group-title">甲方信息</div>';
    html += fieldRow('联系人', pa.contact || '—');
    html += fieldRow('联系电话', pa.phone || '—');
    html += fieldRow('联系邮箱', pa.email || '—');
    html += fieldRow('合作期限', pa.term || '—');

    document.getElementById('detailBody').innerHTML = html;

    // footer：generating 通过+驳回；refill 仅通过；其余仅关闭
    var canPass = (c.status === 'generating' || c.status === 'refill');
    var canReject = (c.status === 'generating');
    var foot = '<button class="btn btn-outline" onclick="closeModal(\'detailModal\')">关闭</button>';
    if (canReject) foot += '<button class="btn btn-danger" onclick="certReject()">驳回</button>';
    if (canPass) foot += '<button class="btn btn-primary" onclick="certPass()">通过</button>';
    document.getElementById('detailFoot').innerHTML = foot;
    openModal('detailModal');
  }
  function fieldRow(label, value) {
    return '<div class="desc-row"><div class="desc-label">' + label + '</div><div class="desc-value">' + value + '</div></div>';
  }
  function viewRejectReason(no) {
    var c = findContract(no);
    document.getElementById('detailBody').innerHTML = '<div class="notice notice-warn" style="margin:0"><svg viewBox="0 0 20 20" fill="none"><path d="M10 3 2.5 16h15L10 3Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M10 8v3.5M10 14v.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg><div>' + (c.refillReason || '无') + '</div></div>';
    document.getElementById('detailFoot').innerHTML = '<button class="btn btn-primary" onclick="closeModal(\'detailModal\')">关闭</button>';
    document.getElementById('detailModal').querySelector('.modal-title').textContent = '查看原因';
    openModal('detailModal');
    setTimeout(function () { document.getElementById('detailModal').querySelector('.modal-title').textContent = '合同详情'; }, 100);
  }

  // 详情弹窗内通过/驳回
  function certPass() {
    currentBizNos = [currentContractNo];
    openPassForm();
  }
  // 打开「甲方信息」表单（通过前必填）
  function openPassForm() {
    ['paContact', 'paPhone', 'paEmail', 'paTerm'].forEach(function (id) {
      var el = document.getElementById(id);
      if (el) el.value = '';
    });
    openModal('bizModal');
  }
  function confirmBiz() {
    var contact = document.getElementById('paContact').value.trim();
    var phone = document.getElementById('paPhone').value.trim();
    var email = document.getElementById('paEmail').value.trim();
    var term = document.getElementById('paTerm').value.trim();
    if (!contact) { showToast('请输入联系人', 'err'); return; }
    if (!phone) { showToast('请输入联系电话', 'err'); return; }
    if (!email) { showToast('请输入联系邮箱', 'err'); return; }
    if (!term) { showToast('请输入合作期限', 'err'); return; }

    // 记录甲方信息到对应合同
    var info = { contact: contact, phone: phone, email: email, term: term, submitTime: nowStr() };
    currentBizNos.forEach(function (no) {
      var c = findContract(no);
      if (c) c.partyAInfo = info;
    });

    closeModal('bizModal');
    closeModal('detailModal');
    doPass(currentBizNos);
  }
  function certReject() {
    currentRejectIds = [currentContractNo];
    var c = findContract(currentContractNo);
    document.getElementById('rejectContractName').textContent = c.company + ' 授权入驻合同';
    document.getElementById('rejectReasonInput').value = '';
    updateRejectCount();
    openModal('rejectModal');
  }

  // ========== 领取 ==========
  function claimOne(no) {
    var c = findContract(no);
    if (c) { c.reviewStage = 'claimed'; c.reviewer = CURRENT_OPERATOR; }
    renderList();
    viewDetail(no);
    showToast('已领取，展开详情', 'ok');
  }

  // ========== 批量操作 ==========
  function batchPass() {
    var list = selectedContracts();
    if (!list.length) { showToast('请先选择要操作的数据', 'err'); return; }
    currentBizNos = list.map(function (c) { return c.no; });
    openPassForm();
  }
  function doPass(nos) {
    nos.forEach(function (no) {
      var c = findContract(no);
      if (!c) return;
      c.status = 'pending'; c.reviewStage = ''; c.reviewer = CURRENT_OPERATOR; c.reviewTime = nowStr();
    });
    selected = [];
    renderList();
    showToast('已通过', 'ok');
  }
  function batchReject() {
    var list = selectedContracts();
    if (!list.length) { showToast('请先选择要操作的数据', 'err'); return; }
    currentRejectIds = list.map(function (c) { return c.no; });
    document.getElementById('rejectContractName').textContent = '已选 ' + currentRejectIds.length + ' 个合同';
    document.getElementById('rejectReasonInput').value = '';
    updateRejectCount();
    openModal('rejectModal');
  }

  // ========== 驳回 ==========
  function updateRejectCount() {
    var el = document.getElementById('rejectReasonInput');
    var cnt = document.getElementById('rejectCount');
    if (el && cnt) cnt.textContent = el.value.length + ' / 500';
  }
  function confirmReject() {
    var reason = document.getElementById('rejectReasonInput').value.trim();
    if (!reason) { showToast('请填写驳回原因', 'err'); return; }
    currentRejectIds.forEach(function (no) {
      var c = findContract(no);
      if (!c) return;
      c.status = 'refill'; c.reviewStage = ''; c.reviewer = CURRENT_OPERATOR; c.reviewTime = nowStr(); c.refillReason = reason;
    });
    closeModal('rejectModal');
    closeModal('detailModal');
    selected = [];
    renderList();
    showToast('已驳回', 'ok');
  }

  // ========== 两份合同模板定义（模板预览 tab） ==========
  var CONTRACT_DOCS = [
    { key: 'framework', title: '微短剧合作框架协议', clauses: ['定义', '合作内容', '双方权利与义务', '知识产权', '保密', '收益分配与结算', '违约责任', '争议解决', '协议生效'] },
    { key: 'nda', title: '保密协议', clauses: ['定义', '保密信息', '保密责任', '知识产权', '保密文件的归还', '期限', '违约责任', '非弃权声明', '适用法律', '争议解决', '协议生效', '份数', '特别约定'] }
  ];

  function contractNameOf(c, key) { return c.company + ' 授权入驻合同'; }

  function renderContractBody(c, key) {
    var doc = CONTRACT_DOCS.find(function (d) { return d.key === key; });
    var html = '';
    html += '<div class="doc-title">' + doc.title + '</div>';
    html += '<div class="doc-no">合同编号：' + c.no + '</div>';
    html += '<div class="doc-line">甲方：NETSTORY PTE. LTD.（平台方）</div>';
    html += '<div class="doc-line">乙方：' + (c.partyB[0].value || '（待填写）') + '</div>';
    html += '<div class="doc-h2">乙方（生产方）</div>';
    c.partyB.forEach(function (f) { html += '<div class="doc-p">' + f.label + '：' + (f.value || '—') + '</div>'; });
    doc.clauses.forEach(function (cl, i) {
      html += '<div class="doc-h2">第 ' + (i + 1) + ' 条 ' + cl + '</div>';
      html += '<div class="doc-clause">（' + cl + '条款内容，以法务定稿为准）……</div>';
    });
    html += '<div class="doc-sign">' +
      '<div>甲方（盖章）：______________<br>签署日期：____年__月__日</div>' +
      '<div>乙方（盖章）：______________<br>签署日期：____年__月__日</div>' +
    '</div>';
    return html;
  }

  var previewKey = 'framework';
  function renderPreviewTabs() {
    document.getElementById('previewTabs').innerHTML = CONTRACT_DOCS.map(function (d) {
      return '<span class="doc-tab' + (d.key === previewKey ? ' active' : '') + '" onclick="switchPreviewTab(\'' + d.key + '\')">' + CONTRACT_TYPE[d.key].label + '</span>';
    }).join('');
  }
  function switchPreviewTab(key) {
    previewKey = key;
    renderPreviewTabs();
    var c = findContract(currentContractNo);
    document.getElementById('previewModalBody').innerHTML = '<div class="doc-wrap">' + renderContractBody(c, previewKey) + '</div>';
  }
  function previewContract(no) {
    currentContractNo = no;
    previewKey = 'framework';
    renderPreviewTabs();
    var c = findContract(no);
    document.getElementById('previewModalBody').innerHTML = '<div class="doc-wrap">' + renderContractBody(c, previewKey) + '</div>';
    openModal('previewModal');
  }

  var downloadSelected = {};
  function renderDownloadGroup() {
    var c = findContract(currentContractNo);
    document.getElementById('downloadGroup').innerHTML = CONTRACT_DOCS.map(function (d) {
      var checked = downloadSelected[d.key];
      return '<label class="dl-item' + (checked ? ' checked' : '') + '" onclick="toggleDownload(\'' + d.key + '\', event)">' +
        '<input type="checkbox"' + (checked ? ' checked' : '') + '>' +
        '<span class="dl-name">' + contractNameOf(c, d.key) + '</span>' +
        '<span class="dl-type">' + CONTRACT_TYPE[d.key].label + '</span>' +
      '</label>';
    }).join('');
  }
  function toggleDownload(key, e) {
    if (e) e.stopPropagation();
    downloadSelected[key] = !downloadSelected[key];
    renderDownloadGroup();
  }
  function downloadContract(no) {
    currentContractNo = no;
    downloadSelected = { framework: true, nda: true };
    renderDownloadGroup();
    openModal('downloadModal');
  }
  function buildContractDoc(c, key) {
    var body = renderContractBody(c, key);
    return '<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><title>' + contractNameOf(c, key) + '</title>' +
      '<style>body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:#1f2329;padding:40px 48px;line-height:1.8;max-width:820px;margin:0 auto}' +
      '.doc-title{font-size:20px;font-weight:700;text-align:center}' +
      '.doc-no{text-align:center;font-size:13px;color:#8a9199;margin-top:8px}' +
      '.doc-line{text-align:center;font-size:14px;margin-top:18px}' +
      '.doc-h2{font-size:15px;font-weight:600;margin-top:26px}' +
      '.doc-p,.doc-clause{font-size:14px;margin-top:6px}' +
      '.doc-sign{display:flex;justify-content:space-between;margin-top:48px;font-size:14px}' +
      '.doc-sign div{line-height:2.4}' +
      '</style></head><body>' + body + '</body></html>';
  }
  function confirmDownload() {
    var keys = CONTRACT_DOCS.map(function (d) { return d.key; }).filter(function (k) { return downloadSelected[k]; });
    if (keys.length === 0) { showToast('请选择要下载的合同', 'err'); return; }
    var c = findContract(currentContractNo);
    closeModal('downloadModal');
    keys.forEach(function (key) {
      var html = buildContractDoc(c, key);
      var blob = new Blob([html], { type: 'text/html;charset=utf-8' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = contractNameOf(c, key) + '（' + CONTRACT_TYPE[key].label + '）.html';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    });
    showToast('合同已下载（演示）', 'ok');
  }

  function nowStr() {
    var d = new Date();
    function p(n) { return (n < 10 ? '0' : '') + n; }
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds());
  }

  // 点击外部关闭下拉
  document.addEventListener('click', function (e) {
    if (!e.target.closest('.autocomplete')) document.querySelectorAll('.ac-panel').forEach(function (p) { p.classList.remove('show'); });
    if (!e.target.closest('#typeBox') && !e.target.closest('#typePanel')) { document.getElementById('typePanel').classList.remove('show'); document.getElementById('typeBox').classList.remove('open'); }
    if (!e.target.closest('#statusBox') && !e.target.closest('#statusPanel')) { document.getElementById('statusPanel').classList.remove('show'); document.getElementById('statusBox').classList.remove('open'); }
    if (!e.target.closest('#rpSignWrap')) { document.getElementById('rpSignWrapPanel').classList.remove('show'); document.getElementById('rpSignWrapBox').classList.remove('open'); }
    if (!e.target.closest('#rpReviewWrap')) { document.getElementById('rpReviewWrapPanel').classList.remove('show'); document.getElementById('rpReviewWrapBox').classList.remove('open'); }
  });

  // 初始化
  initView();
  renderType();
  renderStatus();
  renderList();

</script>
</body>
</html>
