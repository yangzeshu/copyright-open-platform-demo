<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>个人中心 · 版权开放平台</title>
<style>/* ============================================================
   版权开放平台 · 公共样式 common.css
   品牌主色：粉红 #ff2e63，浅色背景，卡片式布局
   C 端与 B 端共享
   ============================================================ */

:root {
  --brand: #ff2e63;
  --brand-dark: #e0244f;
  --brand-light: #fff0f4;
  --brand-weak: rgba(255, 46, 99, 0.06);
  --brand-grad: linear-gradient(135deg, #ff5c8a 0%, #ff2e63 100%);

  --bg: #f7f8fa;
  --fill-1: #f7f8fa;
  --fill-2: #eef0f3;
  --card: #ffffff;
  --border: #eef0f3;
  --border-strong: #e2e5ea;

  --text: #1f2329;
  --text-2: #51565d;
  --text-3: #8a9199;
  --text-invert: #ffffff;

  --ok: #16b364;
  --warn: #f0a020;
  --danger: #e5484d;
  --info: #3b82f6;

  --radius-card: 12px;
  --radius-btn: 8px;
  --radius-input: 8px;
  --shadow-card: 0 2px 12px rgba(20, 24, 30, 0.06);
  --shadow-pop: 0 8px 30px rgba(20, 24, 30, 0.14);

  --sidebar-w: 220px;
  --topbar-h: 64px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei",
    "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  color: var(--text);
  background: var(--bg);
  font-size: 14px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}

a { color: inherit; text-decoration: none; }
ul, ol { list-style: none; }
button { font-family: inherit; cursor: pointer; border: none; background: none; }
input, select, textarea { font-family: inherit; font-size: 14px; }

/* ---------- 通用布局 ---------- */
.container { max-width: 1200px; margin: 0 auto; padding: 0 24px; }

/* ---------- 顶部栏 ---------- */
.topbar {
  position: sticky; top: 0; z-index: 100;
  background: #fff;
  height: var(--topbar-h);
  border-bottom: 1px solid var(--border);
}
.topbar-inner {
  max-width: 1440px; margin: 0 auto; padding: 0 24px;
  height: 100%; display: flex; align-items: center; justify-content: space-between;
}
.topbar-left { display: flex; align-items: center; gap: 12px; }
.topbar-logo {
  width: 30px; height: 30px; border-radius: 8px;
  background: var(--brand-grad);
  display: flex; align-items: center; justify-content: center;
  color: #fff; font-weight: 700; font-size: 16px;
}
.topbar-title { font-size: 15px; font-weight: 600; }
.topbar-divider { width: 1px; height: 16px; background: var(--border-strong); }
.topbar-sub { font-size: 13px; color: var(--text-3); }
.topbar-switch { display: inline-flex; align-items: center; height: 26px; padding: 0 12px; font-size: 13px; color: var(--brand); border: 1px solid var(--brand); border-radius: 4px; cursor: pointer; text-decoration: none; margin-left: 2px; }
.topbar-switch:hover { background: var(--brand); color: #fff; }

.topbar-right { display: flex; align-items: center; gap: 20px; }
.topbar-icon {
  width: 20px; height: 20px; color: var(--text-2);
  position: relative; display: flex; align-items: center;
}
.topbar-icon .dot {
  position: absolute; top: -2px; right: -2px;
  width: 7px; height: 7px; border-radius: 50%; background: var(--brand);
  border: 1.5px solid #fff;
}
.topbar-user { display: flex; align-items: center; gap: 8px; cursor: pointer; }
.topbar-avatar {
  width: 28px; height: 28px; border-radius: 50%;
  background: var(--brand-grad); color: #fff;
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; font-weight: 600;
}
.topbar-name { font-size: 14px; color: var(--text); }
.topbar-caret { width: 14px; height: 14px; color: var(--text-3); }

/* ---------- 主体框架：侧边菜单 + 内容 ---------- */
.layout {
  display: flex; min-height: calc(100vh - var(--topbar-h));
  max-width: 1440px; margin: 0 auto;
}
.sidebar {
  width: var(--sidebar-w); flex-shrink: 0;
  padding: 20px 12px;
}
.sidebar-item {
  display: flex; align-items: center; gap: 10px;
  padding: 11px 14px; margin-bottom: 4px;
  border-radius: 8px; color: var(--text-2);
  font-size: 14px; cursor: pointer;
  transition: background .15s, color .15s;
}
.sidebar-item:hover { background: var(--fill-2); color: var(--text); }
.sidebar-item.active {
  background: var(--brand-weak); color: var(--brand); font-weight: 600;
}
.sidebar-item svg { width: 18px; height: 18px; flex-shrink: 0; }
.sidebar-item .arrow { margin-left: auto; width: 14px; height: 14px; transition: transform .2s; }

/* 目录分组：子菜单默认收起，展开后箭头旋转 */
.sidebar-group .sidebar-sub { display: none; padding-left: 28px; }
.sidebar-group.open .sidebar-sub { display: block; }
.sidebar-group.open .arrow { transform: rotate(180deg); }
.sidebar-sub .sidebar-item { padding: 9px 14px; font-size: 13px; }

.content {
  flex: 1; min-width: 0;
  padding: 24px 32px 48px;
}

/* ---------- 页面标题 ---------- */
.page-head { margin-bottom: 20px; }
.page-title { font-size: 20px; font-weight: 700; }
.page-desc { font-size: 13px; color: var(--text-3); margin-top: 4px; }

/* ---------- 卡片 ---------- */
.card {
  background: var(--card); border-radius: var(--radius-card);
  box-shadow: var(--shadow-card);
  padding: 24px;
  margin-bottom: 20px;
}
.card-title { font-size: 16px; font-weight: 600; margin-bottom: 16px; }
.card + .card { margin-top: 0; }

/* ---------- 按钮 ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  padding: 9px 20px; border-radius: var(--radius-btn);
  font-size: 14px; font-weight: 500; line-height: 1;
  transition: all .15s; white-space: nowrap;
}
.btn-primary { background: var(--brand); color: #fff; }
.btn-primary:hover { background: var(--brand-dark); }
.btn-outline { border: 1px solid var(--border-strong); color: var(--text-2); background: #fff; }
.btn-outline:hover { border-color: var(--brand); color: var(--brand); }
.btn-text { color: var(--brand); padding: 9px 12px; }
.btn-text:hover { background: var(--brand-weak); }
.btn-danger { background: var(--danger); color: #fff; }
.btn-danger:hover { opacity: .9; }
.btn-plain { background: var(--fill-2); color: var(--text-2); }
.btn-plain:hover { background: var(--border-strong); }
.btn-ghost { color: var(--brand); }
.btn-block { width: 100%; }
.btn-lg { padding: 12px 28px; font-size: 15px; }
.btn-sm { padding: 6px 14px; font-size: 13px; }
.btn:disabled { opacity: .5; cursor: not-allowed; }

/* ---------- 表单 ---------- */
.form-item { margin-bottom: 18px; }
.form-label { display: block; font-size: 13px; color: var(--text-2); margin-bottom: 7px; }
.form-label .req { color: var(--danger); margin-left: 2px; }
.form-input {
  width: 100%; padding: 10px 14px;
  border: 1px solid var(--border-strong); border-radius: var(--radius-input);
  background: #fff; color: var(--text); outline: none;
  transition: border .15s, box-shadow .15s;
}
.form-input:focus { border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-weak); }
.form-input::placeholder { color: var(--text-3); }
textarea.form-input { resize: vertical; min-height: 90px; }
.form-row { display: flex; gap: 12px; }
.form-row > * { flex: 1; }
.form-hint { font-size: 12px; color: var(--text-3); margin-top: 6px; }

/* 验证码输入 */
.code-wrap { display: flex; gap: 10px; }
.code-wrap .form-input { flex: 1; }
.code-btn {
  flex-shrink: 0; min-width: 110px; padding: 0 14px;
  border: 1px solid var(--border-strong); border-radius: var(--radius-input);
  color: var(--brand); font-size: 13px; background: #fff;
}
.code-btn:disabled { color: var(--text-3); cursor: not-allowed; }

/* ---------- 状态徽标 ---------- */
.tag {
  display: inline-flex; align-items: center;
  padding: 3px 10px; border-radius: 6px;
  font-size: 12px; font-weight: 500; line-height: 1.5;
}
.tag-gray { background: #f0f1f3; color: #6b7280; }
.tag-blue { background: #e8f1ff; color: #2f6bdc; }
.tag-red { background: #fdeaea; color: #d13a3f; }
.tag-orange { background: #fff3e0; color: #e8840a; }
.tag-green { background: #e6f7ef; color: #149a5a; }
.tag-pink { background: var(--brand-light); color: var(--brand); }
.tag-dark { background: #3a3f45; color: #fff; }

/* ---------- 表格 ---------- */
.table { width: 100%; border-collapse: collapse; }
.table th, .table td {
  text-align: center; padding: 13px 14px;
  border-bottom: 1px solid var(--border);
  font-size: 13px;
}
.table th { color: var(--text-3); font-weight: 500; background: #fafbfc; white-space: nowrap; }
.table tr:last-child td { border-bottom: none; }
.table tbody tr:hover { background: #fafbfc; }
.table .cell-title { color: var(--text); font-weight: 500; }

/* 表格固定列（水平滚动时锁定） */
.table th.sticky-l, .table td.sticky-l { position: sticky; left: 0; z-index: 2; background: #fff; }
.table th.sticky-l2, .table td.sticky-l2 { position: sticky; left: 40px; z-index: 2; background: #fff; }
.table th.sticky-r, .table td.sticky-r { position: sticky; right: 0; z-index: 2; background: #fff; }
.table th.sticky-l, .table th.sticky-l2, .table th.sticky-r { background: #fafbfc; z-index: 3; }
.table tbody tr:hover td.sticky-l,
.table tbody tr:hover td.sticky-l2,
.table tbody tr:hover td.sticky-r { background: #fafbfc; }
.table td.sticky-l2 { box-shadow: 2px 0 4px rgba(0,0,0,.06); }
.table td.sticky-r, .table th.sticky-r { box-shadow: -2px 0 4px rgba(0,0,0,.06); }

/* ---------- 弹窗 ---------- */
.modal-mask {
  position: fixed; inset: 0; z-index: 200;
  background: rgba(20, 24, 30, 0.45);
  display: none; align-items: center; justify-content: center;
}
.modal-mask.show { display: flex; }
.modal {
  background: #fff; border-radius: 14px; width: 460px; max-width: 92vw;
  max-height: 88vh; display: flex; flex-direction: column;
  box-shadow: var(--shadow-pop);
  animation: pop .18s ease;
}
.modal-head {
  padding: 24px 24px 0; flex-shrink: 0;
  display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px;
}
.modal-body {
  padding: 0 24px; overflow-y: auto; flex: 1;
}
.modal-foot {
  padding: 16px 24px 24px; flex-shrink: 0;
  display: flex; justify-content: flex-end; gap: 10px; margin-top: 22px;
}
.modal-lg { width: 620px; }
@keyframes pop { from { transform: scale(.96); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.modal-title { font-size: 16px; font-weight: 600; }
.modal-close { width: 20px; height: 20px; color: var(--text-3); cursor: pointer; }

/* ---------- 空状态 / 提示 ---------- */
.empty {
  text-align: center; padding: 48px 20px; color: var(--text-3);
}
.empty .empty-icon { font-size: 40px; margin-bottom: 12px; opacity: .5; }
.empty .empty-text { font-size: 14px; }

/* ---------- 提示条 ---------- */
.notice {
  display: flex; align-items: flex-start; gap: 10px;
  padding: 14px 16px; border-radius: 10px; font-size: 13px;
  margin-bottom: 16px;
}
.notice-info { background: #e8f1ff; color: #2f6bdc; }
.notice-warn { background: #fff3e0; color: #e8840a; }
.notice-success { background: #e6f7ef; color: #149a5a; }
.notice svg { width: 18px; height: 18px; flex-shrink: 0; margin-top: 1px; }

/* ---------- 步骤条 ---------- */
.steps { display: flex; align-items: center; margin-bottom: 24px; }
.step { display: flex; align-items: center; gap: 8px; }
.step-dot {
  width: 26px; height: 26px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; font-weight: 600;
  background: var(--fill-2); color: var(--text-3);
}
.step.active .step-dot { background: var(--brand); color: #fff; }
.step.done .step-dot { background: var(--ok); color: #fff; }
.step-label { font-size: 13px; color: var(--text-3); }
.step.active .step-label { color: var(--text); font-weight: 600; }
.step.done .step-label { color: var(--text-2); }
.step-line { flex: 1; height: 2px; background: var(--border-strong); margin: 0 12px; }
.step-line.done { background: var(--ok); }

/* ---------- 辅助 ---------- */
.row { display: flex; align-items: center; gap: 12px; }
.between { display: flex; align-items: center; justify-content: space-between; }
.mt-8 { margin-top: 8px; } .mt-16 { margin-top: 16px; } .mt-24 { margin-top: 24px; }
.mb-8 { margin-bottom: 8px; } .mb-16 { margin-bottom: 16px; } .mb-24 { margin-bottom: 24px; }
.text-3 { color: var(--text-3); } .text-2 { color: var(--text-2); }
.text-brand { color: var(--brand); } .text-ok { color: var(--ok); } .text-danger { color: var(--danger); }
.fs-12 { font-size: 12px; } .fs-13 { font-size: 13px; }
.mono { font-variant-numeric: tabular-nums; }

/* 统计卡 */
.stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 20px; }
.stat-card { background: #fff; border-radius: var(--radius-card); box-shadow: var(--shadow-card); padding: 20px 22px; }
.stat-label { font-size: 13px; color: var(--text-3); }
.stat-value { font-size: 26px; font-weight: 700; margin-top: 6px; font-variant-numeric: tabular-nums; }
.stat-value .unit { font-size: 14px; font-weight: 400; color: var(--text-3); margin-left: 2px; }
.stat-trend { font-size: 12px; margin-top: 4px; }

/* 用户下拉菜单 */
.user-menu {
  position: absolute; top: var(--topbar-h); right: 24px; z-index: 150;
  background: #fff; border-radius: 10px; box-shadow: var(--shadow-pop);
  min-width: 140px; padding: 6px; overflow: hidden;
}
.user-menu a, .user-menu .logout-link {
  display: block; padding: 9px 14px; border-radius: 6px;
  font-size: 13px; color: var(--text-2);
}
.user-menu a:hover, .user-menu .logout-link:hover { background: var(--brand-weak); color: var(--brand); }

/* toast */
#toast {
  position: fixed; top: 80px; left: 50%; transform: translateX(-50%);
  z-index: 300; background: #fff; color: var(--text);
  padding: 10px 20px; border-radius: 8px; box-shadow: var(--shadow-pop);
  font-size: 14px; display: none;
}
#toast.show { display: block; animation: pop .2s ease; }

/* ===== 时间范围（高仿 antd RangePicker，公共组件） ===== */
.rp-wrap { position: relative; }
.rp-box {
  height: 32px; width: 320px; padding: 4px 11px; border: 1px solid #d9d9d9;
  border-radius: 6px; background: #fff; display: flex; align-items: center; cursor: pointer; transition: all .2s;
}
.rp-box:hover { border-color: var(--brand); }
.rp-box.open { border-color: var(--brand); box-shadow: 0 0 0 2px rgba(255,46,99,.1); }
.rp-val { flex: 1; font-size: 14px; color: var(--text); text-align: center; font-variant-numeric: tabular-nums; }
.rp-val.ph { color: #bfbfbf; }
.rp-sep { margin: 0 6px; color: var(--text-3); font-size: 14px; }
.rp-panel {
  position: absolute; top: calc(100% + 4px); left: 0; z-index: 60;
  background: #fff; border-radius: 8px; box-shadow: 0 6px 16px rgba(0,0,0,.12);
  display: none; overflow: hidden; width: 560px;
}
.rp-panel.show { display: flex; }
.rp-presets { width: 130px; border-right: 1px solid var(--border); padding: 8px 0; flex-shrink: 0; }
.rp-preset { padding: 8px 14px; font-size: 13px; color: var(--text-2); cursor: pointer; }
.rp-preset:hover { background: var(--brand-weak); color: var(--brand); }
.rp-main { flex: 1; padding: 12px; display: flex; flex-direction: column; }
.rp-inputs { display: flex; gap: 8px; margin-bottom: 12px; }
.rp-inputs input { flex: 1; height: 30px; padding: 0 8px; border: 1px solid #d9d9d9; border-radius: 6px; font-size: 13px; }
.rp-inputs input:focus { border-color: var(--brand); outline: none; box-shadow: 0 0 0 2px rgba(255,46,99,.1); }
.rp-cal-wrap { display: flex; gap: 16px; }
.rp-cal { flex: 1; }
.rp-cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.rp-cal-title { font-size: 13px; font-weight: 600; }
.rp-nav { display: flex; gap: 4px; }
.rp-nav button { width: 22px; height: 22px; border: none; background: none; cursor: pointer; color: var(--text-3); border-radius: 4px; font-size: 12px; }
.rp-nav button:hover { background: #f5f5f5; color: var(--text); }
.rp-week { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; font-size: 11px; color: var(--text-3); margin-bottom: 4px; }
.rp-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
.rp-day {
  height: 26px; display: flex; align-items: center; justify-content: center;
  font-size: 12px; color: var(--text); cursor: pointer; border-radius: 4px;
}
.rp-day:hover { background: var(--brand-weak); }
.rp-day.other { color: #bfbfbf; }
.rp-day.in-range { background: rgba(255,46,99,.1); }
.rp-day.start, .rp-day.end { background: var(--brand); color: #fff; }
.rp-day.disabled { color: #d9d9d9; cursor: not-allowed; }

/* ===== 筛选区折叠项 ===== */
.filter-extra { margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--border); }

/* ===== 联想输入 ===== */
.autocomplete { position: relative; }
.autocomplete .ac-panel {
  position: fixed; z-index: 400;
  background: #fff; border-radius: 8px; box-shadow: 0 6px 16px rgba(0,0,0,.12);
  border: 1px solid var(--border); max-height: 220px; overflow-y: auto; display: none;
}
.autocomplete .ac-panel.show { display: block; }
.ac-opt { padding: 8px 14px; font-size: 13px; color: var(--text-2); cursor: pointer; }
.ac-opt:hover { background: var(--brand-weak); color: var(--brand); }
.ac-opt .hl { color: var(--brand); font-weight: 600; }
.ac-empty { padding: 12px 14px; font-size: 13px; color: var(--text-3); }

/* ===== 列表多选框 ===== */
.cb-col { width: 40px; text-align: center; }
.cb-col input[type="checkbox"] { width: 15px; height: 15px; cursor: pointer; accent-color: var(--brand); }

/* ===== 下拉多选（高仿 antd Select multiple） ===== */
.ms-wrap { position: relative; }
.ms-box {
  min-height: 32px; width: 180px; padding: 2px 28px 2px 6px;
  border: 1px solid #d9d9d9; border-radius: 6px; background: #fff; cursor: pointer;
  display: flex; align-items: center; flex-wrap: wrap; gap: 3px; transition: all .2s;
  position: relative;
}
.ms-box:hover { border-color: var(--brand); }
.ms-box.open { border-color: var(--brand); box-shadow: 0 0 0 2px rgba(255,46,99,.1); }
.ms-placeholder { color: #bfbfbf; font-size: 14px; padding: 0 5px; }
.ms-tag {
  display: inline-flex; align-items: center; height: 24px; padding: 0 6px;
  background: #fafafa; border: 1px solid #d9d9d9; border-radius: 4px;
  font-size: 12px; color: var(--text-2); margin: 1px 0;
}
.ms-tag .ms-x { margin-left: 4px; color: #999; cursor: pointer; font-size: 12px; line-height: 1; }
.ms-tag .ms-x:hover { color: var(--brand); }
.ms-tag.more { background: #fff; border-style: dashed; color: var(--text-3); }
.ms-arrow { position: absolute; right: 9px; top: 50%; transform: translateY(-50%); color: #bfbfbf; pointer-events: none; transition: transform .2s; display: flex; }
.ms-box.open .ms-arrow { transform: translateY(-50%) rotate(180deg); }
.ms-panel {
  position: absolute; top: calc(100% + 4px); left: 0; z-index: 60; width: 100%;
  background: #fff; border-radius: 8px; box-shadow: 0 6px 16px rgba(0,0,0,.12);
  padding: 4px; display: none; max-height: 260px; overflow-y: auto;
}
.ms-panel.show { display: block; }
.ms-opt {
  display: flex; align-items: center; gap: 8px; padding: 7px 10px;
  border-radius: 4px; font-size: 14px; cursor: pointer; color: var(--text-2); transition: background .15s;
}
.ms-opt:hover { background: #f5f5f5; }
.ms-opt .opt-check { width: 16px; text-align: center; color: var(--brand); font-weight: 700; visibility: hidden; }
.ms-opt.checked .opt-check { visibility: visible; }
.ms-opt.checked { color: var(--brand); font-weight: 600; }

/* 操作列表头居中 */
.th-op { text-align: center; }

/* 响应式 */
@media (max-width: 900px) {
  .sidebar { display: none; }
  .stat-grid { grid-template-columns: repeat(2, 1fr); }
}
</style>

<script>/* ============================================================
   版权开放平台 · 公共脚本 common.js
   提供：toast 提示、演示数据、状态映射、SVG 图标
   ============================================================ */

var __cpMem = {};
function __safeGet(k) { try { return localStorage.getItem(k); } catch (e) { return __cpMem[k] || null; } }
function __safeSet(k, v) { __cpMem[k] = v; try { localStorage.setItem(k, v); } catch (e) {} }
function isEnglish() { return false; }
function t(key) { return key; }
function applyI18n() {}

// ---------- Toast ----------
function showToast(msg, type) {
  var t = document.getElementById('toast');
  if (!t) {
    t = document.createElement('div');
    t.id = 'toast';
    document.body.appendChild(t);
  }
  t.textContent = msg;
  t.className = 'show';
  if (type === 'ok') t.style.color = 'var(--ok)';
  else if (type === 'err') t.style.color = 'var(--danger)';
  else t.style.color = 'var(--text)';
  clearTimeout(t._timer);
  t._timer = setTimeout(function () { t.className = ''; }, 2200);
}

// ---------- 弹窗 ----------
function openModal(id) { var m = document.getElementById(id); if (m) m.classList.add('show'); }
function closeModal(id) { var m = document.getElementById(id); if (m) m.classList.remove('show'); }

// 点击遮罩关闭
document.addEventListener('click', function (e) {
  if (e.target.classList && e.target.classList.contains('modal-mask')) {
    e.target.classList.remove('show');
  }
});

// ---------- 状态映射（短剧） ----------
// C 端状态机（2026-09-12 重构）：待提交 → 审核中 → 驳回 / 审核通过 → 已上架；任意状态可被 B 端下架
// 合同签署中、合同信息重填 两态已删除；「合作中」改名「已上架」，「停止合作」改名「已下架」
var WORK_STATUS = {
  draft:       { label: '待提交',   cls: 'tag-gray' },
  reviewing:   { label: '审核中',   cls: 'tag-blue' },
  rejected:    { label: '审核驳回', cls: 'tag-red' },
  approved:    { label: '审核通过', cls: 'tag-green' },
  cooperating: { label: '已上架',   cls: 'tag-green' },
  stopped:     { label: '已下架',   cls: 'tag-dark' }
};

      videoNoSub: prefix + '_EP' + ep + '.mp4',
      videoSub: (i % 2 === 1) ? (prefix + '_EP' + ep + '_字幕.mp4') : '',
      srt: prefix + '_EP' + ep + '.srt',
      duration: (Math.floor(Math.random() * 60) + 90) + 's',
      size: (Math.random() * 300 + 120).toFixed(1) + 'MB'
    });
  }
  return arr;
}

// ============================================================
// 通用时间范围选择器（精确到秒 / 精确到日），C 端、B 端共用
// 用法：var p = createRangePicker('wrapId', { dateOnly:false });
//   p.get() 返回 {start,end}；p.reset() 清空
// ============================================================
function dateStr(d) {
  function p(n) { return (n < 10 ? '0' : '') + n; }
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
}

var RP_PRESETS = [
  { label: '今日', get: function () { var d = new Date(); return [dateStr(d), dateStr(d)]; } },
  { label: '昨日', get: function () { var d = new Date(); d.setDate(d.getDate() - 1); return [dateStr(d), dateStr(d)]; } },
  { label: '本周', get: function () { var s = new Date(); s.setDate(s.getDate() - s.getDay()); var e = new Date(s); e.setDate(e.getDate() + 6); return [dateStr(s), dateStr(e)]; } },
  { label: '本月', get: function () { var s = new Date(); s.setDate(1); var e = new Date(s.getFullYear(), s.getMonth() + 1, 0); return [dateStr(s), dateStr(e)]; } },
  { label: '今年', get: function () { var s = new Date(); s.setMonth(0, 1); var e = new Date(s.getFullYear(), 11, 31); return [dateStr(s), dateStr(e)]; } }
];

var _rpRegistry = {};

function createRangePicker(wrapId, opts) {
  opts = opts || {};
  var dateOnly = !!opts.dateOnly;
  var self = {
    wrapId: wrapId, dateOnly: dateOnly,
    start: null, end: null, focusCal: 'start',
    calStartDate: new Date(), calEndDate: new Date()
  };
  _rpRegistry[wrapId] = self;

  self.render = function () {
    var ph = dateOnly ? 'YYYY-MM-DD' : 'YYYY-MM-DD HH:mm:ss';
    document.getElementById(wrapId).innerHTML =
      '<div class="rp-box" id="' + wrapId + 'Box" onclick="rpToggle(\'' + wrapId + '\',event)">' +
        '<span class="rp-val ph" id="' + wrapId + 'StartVal">' + t('开始时间') + '</span>' +
        '<span class="rp-sep">→</span>' +
        '<span class="rp-val ph" id="' + wrapId + 'EndVal">' + t('结束时间') + '</span>' +
      '</div>' +
      '<div class="rp-panel" id="' + wrapId + 'Panel">' +
        '<div class="rp-presets" id="' + wrapId + 'Presets"></div>' +
        '<div class="rp-main">' +
          '<div class="rp-inputs">' +
            '<input type="text" id="' + wrapId + 'StartInput" placeholder="' + ph + '" readonly onclick="rpFocus(\'' + wrapId + '\',\'start\')">' +
            '<input type="text" id="' + wrapId + 'EndInput" placeholder="' + ph + '" readonly onclick="rpFocus(\'' + wrapId + '\',\'end\')">' +
          '</div>' +
          '<div class="rp-cal-wrap">' +
            '<div class="rp-cal" id="' + wrapId + 'CalStart"></div>' +
            '<div class="rp-cal" id="' + wrapId + 'CalEnd"></div>' +
          '</div>' +
        '</div>' +
      '</div>';
    self.renderPresets();
    self.renderCals();
    self.sync();
  };

  self.renderPresets = function () {
    var html = RP_PRESETS.map(function (p, i) {
      return '<div class="rp-preset" onclick="rpApplyPreset(\'' + wrapId + '\',' + i + ')">' + t(p.label) + '</div>';
    }).join('');
    document.getElementById(wrapId + 'Presets').innerHTML = html;
  };

  self.applyPreset = function (i) {
    var r = RP_PRESETS[i].get();
    self.start = dateOnly ? r[0] : r[0] + ' 00:00:00';
    self.end = dateOnly ? r[1] : r[1] + ' 23:59:59';
    self.sync();
  };

  self.togglePanel = function (e) {
    if (e) e.stopPropagation();
    var panel = document.getElementById(wrapId + 'Panel');
    var box = document.getElementById(wrapId + 'Box');
    var open = panel.classList.contains('show');
    panel.classList.toggle('show', !open);
    box.classList.toggle('open', !open);
    if (!open) self.renderCals();
  };

  self.sync = function () {
    document.getElementById(wrapId + 'StartInput').value = self.start || '';
    document.getElementById(wrapId + 'EndInput').value = self.end || '';
    var sv = document.getElementById(wrapId + 'StartVal');
    var ev = document.getElementById(wrapId + 'EndVal');
    if (self.start) { sv.textContent = self.start; sv.classList.remove('ph'); } else { sv.textContent = t('开始时间'); sv.classList.add('ph'); }
    if (self.end) { ev.textContent = self.end; ev.classList.remove('ph'); } else { ev.textContent = t('结束时间'); ev.classList.add('ph'); }
    self.renderCals();
  };

  self.renderCal = function (containerId, viewDate) {
    var y = viewDate.getFullYear(), m = viewDate.getMonth();
    var first = new Date(y, m, 1);
    var startDay = first.getDay();
    var daysInMonth = new Date(y, m + 1, 0).getDate();
    var daysInPrev = new Date(y, m, 0).getDate();
    var cells = [];
    for (var i = 0; i < 42; i++) {
      var dnum, cls = 'rp-day', dayObj;
      if (i < startDay) {
        dnum = daysInPrev - startDay + 1 + i; cls += ' other';
        dayObj = new Date(y, m - 1, dnum);
      } else if (i >= startDay + daysInMonth) {
        dnum = i - startDay - daysInMonth + 1; cls += ' other';
        dayObj = new Date(y, m + 1, dnum);
      } else {
        dnum = i - startDay + 1;
        dayObj = new Date(y, m, dnum);
      }
      var ds = dateStr(dayObj);
      if (self.start && ds === self.start.slice(0, 10)) cls += ' start';
      if (self.end && ds === self.end.slice(0, 10)) cls += ' end';
      if (self.start && self.end) {
        var sd = self.start.slice(0, 10), ed = self.end.slice(0, 10);
        if (ds > sd && ds < ed) cls += ' in-range';
      }
      cells.push('<div class="' + cls + '" onclick="rpPickDay(\'' + wrapId + '\',\'' + ds + '\')">' + dnum + '</div>');
    }
    var weekArr = isEnglish() ? ['Su','Mo','Tu','We','Th','Fr','Sa'] : ['日','一','二','三','四','五','六'];
    var weekHtml = weekArr.map(function (w) { return '<div>' + w + '</div>'; }).join('');
    var monthNames = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    var calTitle = isEnglish() ? (monthNames[m] + ' ' + y) : (y + ' 年 ' + (m + 1) + ' 月');
    document.getElementById(containerId).innerHTML =
      '<div class="rp-cal-head"><div class="rp-cal-title">' + calTitle + '</div>' +
      '<div class="rp-nav"><button onclick="rpNavCal(\'' + wrapId + '\',\'' + containerId + '\',-1,event)">‹</button><button onclick="rpNavCal(\'' + wrapId + '\',\'' + containerId + '\',1,event)">›</button></div></div>' +
      '<div class="rp-week">' + weekHtml + '</div>' +
      '<div class="rp-grid">' + cells.join('') + '</div>';
  };

  self.renderCals = function () {
    self.renderCal(wrapId + 'CalStart', self.calStartDate);
    self.renderCal(wrapId + 'CalEnd', self.calEndDate);
  };

  self.navCal = function (cid, delta) {
    if (cid === wrapId + 'CalStart') self.calStartDate.setMonth(self.calStartDate.getMonth() + delta);
    else self.calEndDate.setMonth(self.calEndDate.getMonth() + delta);
    self.renderCals();
  };

  self.pickDay = function (ds) {
    if (self.focusCal === 'start') {
      self.start = dateOnly ? ds : ds + ' 00:00:00';
      self.focusCal = 'end';
    } else {
      self.end = dateOnly ? ds : ds + ' 23:59:59';
      self.focusCal = 'start';
    }
    if (self.start && self.end && self.start > self.end) {
      var t2 = self.start; self.start = self.end; self.end = t2;
    }
    self.sync();
  };

  self.reset = function () { self.start = null; self.end = null; self.sync(); };
  self.get = function () { return { start: self.start, end: self.end }; };

  self.render();
  return self;
}

// 内联 onclick 全局分发
function rpToggle(id, e) { _rpRegistry[id].togglePanel(e); }
function rpFocus(id, which) { _rpRegistry[id].focusCal = which; }
function rpApplyPreset(id, i) { _rpRegistry[id].applyPreset(i); }
function rpNavCal(id, cid, delta, e) { e.stopPropagation(); _rpRegistry[id].navCal(cid, delta); }
function rpPickDay(id, ds) { _rpRegistry[id].pickDay(ds); }

  '</div>';
}

function renderSidebar(active) {
  var items = [
    { key: 'workbench', label: t('工作台'), href: 'workbench.html' },
    { key: 'contract',  label: t('合同管理'), href: 'contracts.html' },
    { key: 'works',     label: t('作品管理'), sub: [{ key: 'works', label: t('成品剧'), href: 'work.html' }] },
    { key: 'earnings',  label: t('收益管理'), sub: [
        { key: 'earnings',   label: t('收益明细'), href: 'earnings.html' },
        { key: 'settlement', label: t('结算单'),   href: 'settlement.html' }
      ] }
  ];
  var html = '<div class="sidebar">';
  items.forEach(function (it) {
    // 判断该目录是否包含当前 active 的子项
    var childActiveKey = null;
    if (it.sub) {
      it.sub.forEach(function (s) { if (s.key === active) childActiveKey = s.key; });
    }
    var isGroup = !!it.sub && it.sub.length;
    var isGroupOpen = childActiveKey !== null;

    if (isGroup) {
      // 目录：点击展开/收起，不跳转
      html += '<div class="sidebar-group' + (isGroupOpen ? ' open' : '') + '">' +
        '<div class="sidebar-item' + (childActiveKey !== null ? ' active' : '') + '" onclick="toggleSidebarGroup(this)">' +
          icon(it.key) + '<span>' + it.label + '</span>' +
          '<span class="arrow">' + icon('down') + '</span>' +
        '</div>' +
        '<div class="sidebar-sub">' + it.sub.map(function (s) {
          return '<a class="sidebar-item' + (s.key === active ? ' active' : '') + '" href="' + s.href + '">' + s.label + '</a>';
        }).join('') + '</div>' +
      '</div>';
    } else {
      html += '<a class="sidebar-item' + (it.key === active ? ' active' : '') + '" href="' + it.href + '">' +
        icon(it.key) + '<span>' + it.label + '</span>' +
      '</a>';
    }
  });
  html += '</div>';
  return html;
}

// 点击目录展开/收起子菜单
function toggleSidebarGroup(el) {
  var group = el.parentElement;
  group.classList.toggle('open');
}

function toggleUserMenu() {
  var m = document.getElementById('userMenu');
  if (m) m.style.display = m.style.display === 'none' ? 'block' : 'none';
}
document.addEventListener('click', function (e) {
  var m = document.getElementById('userMenu');
  if (m && !e.target.closest('.topbar-user') && !e.target.closest('.user-menu')) {
    m.style.display = 'none';
  }
});
</script>
<script>
  document.getElementById('topbar-root').innerHTML = renderTopbar({ unread: 2 });
  document.getElementById('sidebar-root').innerHTML = renderSidebar('');

  /* ============================================================
     个人中心 · 基础信息 / 联系方式 / 主体管理
     ------------------------------------------------------------
     模块划分（真实产品设计）：
       · 基础信息（头像 + 昵称 + 简介一起修改）→ 提交后进入审核：
         - 审核中：主体展示生效中的信息（不变更），标题旁「审核中」标识
           +【刷新】按钮，隐藏【修改】入口（审核中不允许再次提交）。
         - 审核驳回：展示【查看详情】（提交快照 + 驳回原因）+ 恢复【修改】。
         - 审核通过：主体页面信息才变更为提交内容，仅保留【修改】。
       · 联系方式（邮箱 / 手机号两个字段单独更换）→ 新值需通过验证码
         验证，验证通过后立即生效（不走审核）。
       · 主体管理（多开票主体）→ 展示现有主体（含审核状态），支持新增主体：
         新增 → 填新主体认证信息 → B 端审核 → 通过后签署授权合同 → 主体添加完毕。
     demo 模拟（非真实逻辑）：
       · 基础信息【刷新】按钮模拟「查询运营后台审核结果」；本次演示规则
         为第 1 次刷新 → 驳回、第 2 次刷新 → 通过。真实由运营后台决定。
       · 主体管理【刷新】按钮模拟 B 端认证审核通过（真实由运营后台决定）。
       · 验证码：demo 以 toast 展示演示验证码，真实通过短信 / 邮箱下发。
       · 头像上传：FileReader 本地预览（内存态，不落盘）。
       · 内存态，页面刷新即还原初始数据。
     ============================================================ */

  var ID_TEXT = 'ID：DramaWave_1024';

  // 生效中数据（主体页展示）；basicPending = 基础信息待审核快照
  var PROFILE = {
    live: {
      nick: '光影工场',
      intro: '专注精品短剧创作的内容工作室',
      avatar: '',
      email: 'contact@guangying.com',
      phone: '13800006688'
    },
    basicPending: null,      // 基础信息待审核的提交快照
    basicState: 'normal',    // normal | reviewing | rejected | approved
    auditCount: 0            // demo 模拟用：累计审核次数（第 2 次审核即通过）
  };

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  // 纯数字长账号展示时打码（6222 **** **** 6688）
  function maskAccount(no) {
    var s = String(no || '').replace(/\s+/g, '');
    if (/^\d{9,}$/.test(s)) return s.slice(0, 4) + ' **** **** ' + s.slice(-4);
    return String(no || '');
  }

  // 手机号打码（138****6688）
  function maskPhone(p) {
    var s = String(p || '').replace(/\s+/g, '');
    if (/^\d{11}$/.test(s)) return s.slice(0, 3) + '****' + s.slice(-4);
    return String(p || '');
  }

  // 头像展示（图片头像或文字头像）
  function avatarHtml(avatar, nick) {
    if (avatar) return '<img src="' + avatar + '" alt="">';
    return esc(String(nick || '光').slice(0, 1));
  }

  /* ================= 基础信息（头像 / 昵称 / 简介，审核流） =================
     状态展示：审核中 | 审核驳回 | 审核通过（标识在模块标题旁） */
  function basicStatusHtml() {
    var st = PROFILE.basicState;
    if (st === 'reviewing') {
      return {
        tag: '<span class="tag tag-orange review-tag">' + icon('clock') + t('审核中') + '</span>',
        ops: '<button class="btn btn-outline btn-sm btn-refresh" id="basicRefreshBtn" onclick="refreshBasic()">' +
               icon('refresh') + t('刷新') + '</button>'
      };
    }
    if (st === 'rejected') {
      return {
        tag: '<span class="tag tag-red review-tag">' + t('审核驳回') + '</span>',
        ops: '<button class="btn btn-outline btn-sm" onclick="openBasicDetail()">' + t('查看详情') + '</button>' +
             '<span class="edit-link" onclick="openBasicModal()">' + t('修改') + '</span>'
      };
    }
    var tag = st === 'approved'
      ? '<span class="tag tag-green review-tag">' + t('审核通过') + '</span>'
      : '';
    return {
      tag: tag,
      ops: '<span class="edit-link" onclick="openBasicModal()">' + t('修改') + '</span>'
    };
  }

  function renderBasicCard() {
    var d = PROFILE.live;
    var st = basicStatusHtml();
    var mainSubj = SUBJECTS.find(function (x) { return x.isDefault; }) || SUBJECTS[0] || {};
    document.getElementById('basicCard').innerHTML =
      '<div class="mod-head">' +
        '<div class="section-divider">' + t('基础信息') + st.tag + '</div>' +
        '<div class="mod-ops">' + st.ops + '</div>' +
      '</div>' +
      '<div class="profile-header-row" style="margin-bottom:16px;padding-bottom:16px">' +
        '<div class="avatar-lg">' + avatarHtml(d.avatar, d.nick) + '</div>' +
        '<div>' +
          '<div class="p-name">' + esc(d.nick) + '</div>' +
          '<div class="p-id">' + ID_TEXT + '</div>' +
        '</div>' +
      '</div>' +
      '<div class="field-grid">' +
        '<div class="field-row">' +
          '<div class="field-label-cell">' + t('昵称') + '</div>' +
          '<div class="field-value-cell">' + esc(d.nick) + '</div>' +
        '</div>' +
        '<div class="field-row">' +
          '<div class="field-label-cell">' + t('简介') + '</div>' +
          '<div class="field-value-cell">' + esc(d.intro) + '</div>' +
        '</div>' +
        '<div class="field-row">' +
          '<div class="field-label-cell">' + t('国内公司名称') + '</div>' +
          '<div class="field-value-cell">' + esc(mainSubj.domesticCompanyName) + '</div>' +
        '</div>' +
        '<div class="field-row">' +
          '<div class="field-label-cell">' + t('营业执照') + '</div>' +
          '<div class="field-value-cell"><span class="op-link" onclick="viewBizLicense()">' + t('查看') + '</span></div>' +
        '</div>' +
        '<div class="field-row">' +
          '<div class="field-label-cell">' + t('商务') + '</div>' +
          '<div class="field-value-cell">' + (mainSubj.business ? esc(mainSubj.business) : '—') + '</div>' +
        '</div>' +
      '</div>';
  }

  // 查看营业执照大图（demo 占位）
  function viewBizLicense() {
    var mainSubj = SUBJECTS.find(function (x) { return x.isDefault; }) || SUBJECTS[0] || {};
    document.getElementById('modDetailTitle').textContent = '营业执照';
    document.getElementById('modDetailBody').innerHTML =
      '<div style="display:flex;align-items:center;justify-content:center;padding:20px 0">' +
        '<div style="width:320px;height:220px;border-radius:8px;background:linear-gradient(135deg,#fdeef2,#ffe0e8);display:flex;align-items:center;justify-content:center;color:var(--brand);font-weight:600;font-size:20px">' +
          '营业执照<br>（' + esc(mainSubj.bizLicense || '演示图片') + '）' +
        '</div>' +
      '</div>';
    openModal('modDetailModal');
  }

  // 弹窗内暂存的新头像（dataURL）
  var draftAvatar = '';

  function renderAvatarPreview() {
    var nick = document.getElementById('basicNick').value.trim() || PROFILE.live.nick;
    document.getElementById('avatarPreview').innerHTML = avatarHtml(draftAvatar, nick);
  }

  // 打开「修改基础信息」弹窗并回填：优先回填驳回后需重填的提交快照
  function openBasicModal() {
    var src = (PROFILE.basicState === 'rejected' && PROFILE.basicPending) ? PROFILE.basicPending : PROFILE.live;
    document.getElementById('basicNick').value = src.nick || '';
    document.getElementById('basicIntro').value = src.intro || '';
    draftAvatar = src.avatar || '';
    renderAvatarPreview();
    openModal('basicModal');
  }

  function pickAvatar() { document.getElementById('avatarFile').click(); }

  function onAvatarFile(input) {
    var f = input.files && input.files[0];
    if (!f) return;
    if (!/^image\//.test(f.type)) { showToast(t('仅支持图片格式'), 'err'); return; }
    var r = new FileReader();
    r.onload = function () {
      draftAvatar = r.result;
      renderAvatarPreview();
    };
    r.readAsDataURL(f);
    input.value = ''; // 允许再次选择同一文件
  }

  // 提交修改 → 进入审核中；主体页面仍展示生效中的信息
  function submitBasic() {
    PROFILE.basicPending = {
      nick: document.getElementById('basicNick').value.trim() || PROFILE.live.nick,
      intro: document.getElementById('basicIntro').value.trim() || PROFILE.live.intro,
      avatar: draftAvatar
    };
    PROFILE.basicState = 'reviewing';
    closeModal('basicModal');
    renderBasicCard();
    showToast(t('已提交修改，等待审核'), 'ok');
  }

  /*
    【刷新】—— demo 模拟查询运营后台审核结果（真实由后台决定）：
      第 1 次审核（首次提交后刷新）→ 审核驳回 + 查看详情
      第 2 次审核（再次提交后刷新）→ 审核通过，主体页面信息变更为提交内容
  */
  function refreshBasic() {
    var btn = document.getElementById('basicRefreshBtn');
    if (btn) btn.classList.add('spin');
    PROFILE.auditCount++;
    var pass = PROFILE.auditCount >= 2;   // demo 规则：第 2 次审核即通过
    setTimeout(function () {
      if (pass) {
        var p = PROFILE.basicPending || {};
        PROFILE.live.nick = p.nick || PROFILE.live.nick;
        PROFILE.live.intro = p.intro || PROFILE.live.intro;
        if (p.avatar) PROFILE.live.avatar = p.avatar;
        PROFILE.basicPending = null;
        PROFILE.basicState = 'approved';
        // 主体信息变更：同步顶栏头像/昵称（真实产品全站一致）
        var ta = document.querySelector('.topbar-avatar');
        if (ta) ta.innerHTML = PROFILE.live.avatar
          ? '<img src="' + PROFILE.live.avatar + '" style="width:100%;height:100%;border-radius:50%;object-fit:cover;display:block">'
          : esc((PROFILE.live.nick || '光').charAt(0));
        var tn = document.querySelector('.topbar-name');
        if (tn) tn.textContent = PROFILE.live.nick;
        renderBasicCard();
        showToast(t('审核通过，修改已生效'), 'ok');
      } else {
        PROFILE.basicState = 'rejected';
        renderBasicCard();
        showToast(t('审核驳回，请重新提交'), 'err');
      }
    }, 350);
  }

  // 查看详情：提交信息快照（头像 / 昵称 / 简介）+ 驳回原因
  function openBasicDetail() {
    var p = PROFILE.basicPending || PROFILE.live;
    document.getElementById('modDetailTitle').textContent = '修改详情';
    document.getElementById('modDetailBody').innerHTML =
      '<div class="sub-title" style="margin-top:0">' + t('提交信息快照') + '</div>' +
      '<div class="snap-grid">' +
        '<div class="snap-k">' + t('头像') + '</div>' +
        '<div class="snap-v">' +
          (p.avatar ? '<img class="snap-avatar" src="' + p.avatar + '" alt="">' : '<span class="tag tag-gray">' + t('未更换') + '</span>') +
        '</div>' +
        '<div class="snap-k">' + t('昵称') + '</div>' +
        '<div class="snap-v">' + esc(p.nick) + '</div>' +
        '<div class="snap-k">' + t('简介') + '</div>' +
        '<div class="snap-v">' + esc(p.intro) + '</div>' +
      '</div>' +
      '<div class="snap-reason">' +
        '<span class="r-label">' + t('驳回原因') + '</span>' +
        t('您的修改信息未通过审核，请核对后重新提交。') +
      '</div>';
    openModal('modDetailModal');
  }

  /* ============ 联系方式（邮箱 / 手机号单独更换，验证码验证后生效） ============ */
  var VCM = { type: 'email', code: '', left: 0, timer: null };

  function renderContactCard() {
    var d = PROFILE.live;
    document.getElementById('contactCard').innerHTML =
      '<div class="mod-head">' +
        '<div class="section-divider">' + t('联系方式') + '</div>' +
      '</div>' +
      '<div class="field-grid">' +
        '<div class="field-row">' +
          '<div class="field-label-cell">' + t('邮箱') + '</div>' +
          '<div class="field-value-cell"><span>' + esc(d.email) + '</span>' +
            '<span class="edit-link" onclick="openVcModal(\'email\')">' + t('更换') + '</span></div>' +
        '</div>' +
        '<div class="field-row">' +
          '<div class="field-label-cell">' + t('手机号') + '</div>' +
          '<div class="field-value-cell"><span>' + esc(d.phone) + '</span>' +
            '<span class="edit-link" onclick="openVcModal(\'phone\')">' + t('更换') + '</span></div>' +
        '</div>' +
      '</div>';
  }

  function openVcModal(type) {
    VCM.type = type;
    document.getElementById('vcTitle').textContent = type === 'email' ? t('更换邮箱') : t('更换手机号');
    document.getElementById('vcNewLabel').textContent = type === 'email' ? t('新邮箱') : t('新手机号');
    var inp = document.getElementById('vcNew');
    inp.value = '';
    inp.placeholder = type === 'email' ? t('请输入新邮箱') : t('请输入新手机号');
    document.getElementById('vcCode').value = '';
    stopVcTimer();
    openModal('vcModal');
  }

  // 获取验证码：校验新值格式 → demo 生成 6 位演示码（toast 展示）→ 60s 倒计时
  function sendVc() {
    var v = document.getElementById('vcNew').value.trim();
    if (VCM.type === 'email') {
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)) { showToast(t('请输入正确的邮箱地址'), 'err'); return; }
      if (v === PROFILE.live.email) { showToast(t('新邮箱不能与当前邮箱一致'), 'err'); return; }
    } else {
      if (!/^\d{11}$/.test(v)) { showToast(t('请输入正确的手机号'), 'err'); return; }
      if (v === PROFILE.live.phone) { showToast(t('新手机号不能与当前手机号一致'), 'err'); return; }
    }
    VCM.code = String(Math.floor(100000 + Math.random() * 900000));
    showToast(t('验证码已发送') + '：' + VCM.code, 'ok');
    stopVcTimer();
    VCM.left = 60;
    tickVc();
    VCM.timer = setInterval(tickVc, 1000);
  }

  function tickVc() {
    var btn = document.getElementById('vcSendBtn');
    if (VCM.left > 0) {
      btn.disabled = true;
      btn.textContent = t('重发') + ' (' + VCM.left + 's)';
      VCM.left--;
    } else {
      stopVcTimer();
    }
  }

  function stopVcTimer() {
    if (VCM.timer) { clearInterval(VCM.timer); VCM.timer = null; }
    var btn = document.getElementById('vcSendBtn');
    if (btn) { btn.disabled = false; btn.textContent = t('获取验证码'); }
  }

  // 确定更换：验证码校验通过后立即生效（不走审核）
  function confirmVc() {
    var v = document.getElementById('vcNew').value.trim();
    var c = document.getElementById('vcCode').value.trim();
    if (!v) { showToast(VCM.type === 'email' ? t('请输入新邮箱') : t('请输入新手机号'), 'err'); return; }
    if (!c) { showToast(t('请输入验证码'), 'err'); return; }
    if (c !== VCM.code) { showToast(t('验证码错误，请重新输入'), 'err'); return; }
    if (VCM.type === 'email') { PROFILE.live.email = v; showToast(t('邮箱更换成功'), 'ok'); }
    else { PROFILE.live.phone = v; showToast(t('手机号更换成功'), 'ok'); }
    stopVcTimer();
    closeModal('vcModal');
    renderContactCard();
  }

  /* ================= 企业：主体管理（单一企业认证） =================
     真实产品设计：
       · 一个账号可拥有多个开票主体（均为企业）；首个主体 = 入驻认证完成的主主体。
       · 新增主体流程：填新主体认证信息 → B 端审核认证信息 → 审核通过后
         在【合同管理】签署授权合同 → 主体才算「添加完毕」。
       · 主体状态：认证状态（审核中/审核通过/审核驳回）× 合同签署状态
         （填写信息/合同生成/合同信息重填/待签署/已签署）。
     demo 模拟：审核、签署、下载均为模拟（真实由后端/第三方签约平台驱动）。
  */
  var SUBJ_CERT_STATUS = { pending: { label: '审核中', cls: 'tag-orange' }, certed: { label: '审核通过', cls: 'tag-green' }, rejected: { label: '审核驳回', cls: 'tag-red' } };
  var SUBJ_CONTRACT_STATUS = {
    '': { label: '—', cls: '' },
    'fill': { label: '填写信息', cls: 'tag-gray' },
    'generating': { label: '合同生成', cls: 'tag-blue' },
    'refill': { label: '合同信息重填', cls: 'tag-orange' },
    'pending': { label: '待签署', cls: 'tag-blue' },
    'done': { label: '已签署', cls: 'tag-green' }
  };

  var SUBJECTS = [
    { id: 'SUB1', isDefault: true, certStatus: 'certed', contractStatus: 'done',
      domesticCompanyName: '杭州光影映画文化传媒有限公司', bizLicense: '营业执照.jpg',
      company: 'Hangzhou Guangying Yinghua Culture Media Co., Ltd.', contactAddr: '杭州市西湖区文三路100号',
      contact: '张伟', contactPhone: '13812346688', contactEmail: 'zhangwei@163.com',
      bankName: 'Hangzhou Guangying Yinghua Culture Media Co., Ltd.', bankAccount: '6222000088888888',
      bankEn: 'Industrial and Commercial Bank of China, Hangzhou Branch',
      companyAddrEn: 'No.100, Wensan Road, Xihu District, Hangzhou, China',
      bankAddrEn: 'No.1, Qingchun Road, Shangcheng District, Hangzhou, China',
      swift: 'ICBKCNBJHZP', business: '枥文',
      // 旧字段（供合同信息弹窗兼容展示，本轮不改合同联动）
      companyAddr: '杭州市西湖区文三路100号', payName: '杭州光影映画文化传媒有限公司',
      bank: '中国工商银行杭州分行', payBranch: '文三路支行', payAccount: '6222000088888888' }
  ];
  var SUBJ_IMG = {};

  function addSubImg(key) {
    var arr = SUBJ_IMG[key] || (SUBJ_IMG[key] = []);
    if (arr.length >= 9) { showToast('最多上传 9 张图片', 'err'); return; }
    arr.push({ name: '图片_' + (arr.length + 1) + '.jpg' });
    renderSubImg(key);
  }
  function renderSubImg(key) {
    var arr = SUBJ_IMG[key] || [];
    document.getElementById('subj_grid_' + key).innerHTML = arr.map(function (img, i) {
      return '<div class="img-cell"><div class="img-thumb">' + img.name.charAt(0) + '</div>' +
        '<div class="img-name">' + img.name + '</div>' +
        '<span class="img-del" onclick="delSubImg(\'' + key + '\',' + i + ')">×</span></div>';
    }).join('');
    document.getElementById('subj_add_' + key).style.display = arr.length >= 9 ? 'none' : 'flex';
  }
  function delSubImg(key, idx) { if (SUBJ_IMG[key]) { SUBJ_IMG[key].splice(idx, 1); renderSubImg(key); } }

  // 操作按钮按（认证状态 × 合同签署状态）
  function subjectOps(s) {
    var ops = '<span class="op-link" onclick="subjectDetail(\'' + s.id + '\')">认证详情</span>';
    if (s.certStatus === 'pending') {
      // 审核中：仅认证详情
    } else if (s.certStatus === 'rejected') {
      ops += '<span class="op-link" onclick="subjectResubmit(\'' + s.id + '\')">重新提交</span>';
    } else { // 审核通过
      if (s.contractStatus === 'fill') {
        ops += '<span class="op-link" onclick="subjectFillContract(\'' + s.id + '\')">合同信息填写</span>' +
               '<span class="op-link" onclick="subjectPreviewContract()">合同模板预览</span>';
      } else if (s.contractStatus === 'generating') {
        ops += '<span class="op-link" onclick="subjectViewContract(\'' + s.id + '\')">合同信息查看</span>' +
               '<span class="op-link" onclick="subjectPreviewContract()">合同模板预览</span>';
      } else if (s.contractStatus === 'refill') {
        ops += '<span class="op-link" onclick="subjectFillContract(\'' + s.id + '\')">合同信息填写</span>' +
               '<span class="op-link" onclick="subjectPreviewContract()">合同模板预览</span>';
      } else if (s.contractStatus === 'pending') {
        ops += '<span class="op-link" onclick="subjectViewContract(\'' + s.id + '\')">合同信息查看</span>' +
               '<span class="op-link" onclick="subjectPreviewContract()">合同模板预览</span>' +
               '<span class="op-link" onclick="subjectSign(\'' + s.id + '\')">签署完成</span>';
      } else if (s.contractStatus === 'done') {
        ops += '<span class="op-link" onclick="subjectViewContract(\'' + s.id + '\')">合同信息查看</span>' +
               '<span class="op-link" onclick="subjectDownload()">合同下载</span>';
      }
    }
    return ops;
  }

  function renderSubjectCard() {
    var rows = SUBJECTS.map(function (s) {
      var cert = SUBJ_CERT_STATUS[s.certStatus] || { label: s.certStatus, cls: 'tag-gray' };
      var con = SUBJ_CONTRACT_STATUS[s.contractStatus] || { label: s.contractStatus, cls: 'tag-gray' };
      var conHtml = s.contractStatus
        ? '<span class="tag ' + con.cls + '">' + con.label + '</span>'
        : '<span class="text-3">—</span>';
      var certCell = '<span class="tag ' + cert.cls + '">' + cert.label + '</span>';
      if (s.certStatus === 'rejected') {
        certCell += '<div class="reason-link" onclick="subjectRejectReason(\'' + s.id + '\', \'cert\')">查看原因</div>';
      }
      var conCell = conHtml;
      if (s.contractStatus === 'refill') {
        conCell += '<div class="reason-link" onclick="subjectRejectReason(\'' + s.id + '\', \'contract\')">查看原因</div>';
      }
      return '<tr>' +
        '<td><div class="subj-name">' + esc(s.company) + (s.isDefault ? '<span class="subj-tag"><span class="tag tag-pink">主主体</span></span>' : '') + '</div></td>' +
        '<td>' + esc(s.contact) + '</td>' +
        '<td>' + esc(s.contactPhone) + '</td>' +
        '<td>' + esc(s.contactEmail) + '</td>' +
        '<td>' + certCell + '</td>' +
        '<td>' + conCell + '</td>' +
        '<td><div class="subj-ops">' + subjectOps(s) + '</div></td>' +
      '</tr>';
    }).join('');
    document.getElementById('subjectCard').innerHTML =
      '<div class="mod-head">' +
        '<div class="section-divider">主体管理</div>' +
      '</div>' +
      '<div class="subj-table-wrap" style="overflow-x:auto">' +
      '<table class="subj-table"><thead><tr>' +
        '<th>公司名称</th><th>联系人</th><th>联系电话</th><th>联系邮箱</th><th>认证状态</th><th>合同签署状态</th><th>操作</th>' +
      '</tr></thead><tbody>' + rows + '</tbody></table>' +
      '</div>';
  }

  var editingSubjectId = null;
  function openSubjectModal(existing) {
    editingSubjectId = existing ? existing.id : null;
    document.getElementById('subjectModalTitle').textContent = '编辑主体信息';
    var s = existing || {};
    document.getElementById('subCompanyName').value = s.company || '';
    document.getElementById('subContactAddr').value = s.contactAddr || '';
    document.getElementById('subContact').value = s.contact || '';
    document.getElementById('subContactPhone').value = s.contactPhone || '';
    document.getElementById('subContactEmail').value = s.contactEmail || '';
    document.getElementById('subBankName').value = s.bankName || '';
    document.getElementById('subBankAccount').value = s.bankAccount || '';
    document.getElementById('subBank').value = s.bankEn || '';
    document.getElementById('subCompanyAddrEn').value = s.companyAddrEn || '';
    document.getElementById('subBankAddrEn').value = s.bankAddrEn || '';
    document.getElementById('subSwift').value = s.swift || '';
    document.getElementById('subBusiness').value = s.business || '';
    openModal('subjectModal');
  }

  function submitSubject() {
    var required = ['subCompanyName', 'subContactAddr', 'subContact', 'subContactPhone', 'subContactEmail', 'subBankName', 'subBankAccount', 'subBank', 'subCompanyAddrEn', 'subBankAddrEn', 'subSwift', 'subBusiness'];
    for (var i = 0; i < required.length; i++) {
      var el = document.getElementById(required[i]);
      if (!el || !el.value.trim()) { showToast('请填写完整的主体信息', 'err'); return; }
    }
    var data = {
      company: document.getElementById('subCompanyName').value.trim(),
      contactAddr: document.getElementById('subContactAddr').value.trim(),
      contact: document.getElementById('subContact').value.trim(),
      contactPhone: document.getElementById('subContactPhone').value.trim(),
      contactEmail: document.getElementById('subContactEmail').value.trim(),
      bankName: document.getElementById('subBankName').value.trim(),
      bankAccount: document.getElementById('subBankAccount').value.trim(),
      bankEn: document.getElementById('subBank').value.trim(),
      companyAddrEn: document.getElementById('subCompanyAddrEn').value.trim(),
      bankAddrEn: document.getElementById('subBankAddrEn').value.trim(),
      swift: document.getElementById('subSwift').value.trim(),
      business: document.getElementById('subBusiness').value
    };
    if (editingSubjectId) {
      var s = SUBJECTS.find(function (x) { return x.id === editingSubjectId; });
      if (s) {
        for (var k in data) s[k] = data[k];
        // 合同联动兼容字段同步（本轮不改合同联动，仅同步值）
        s.companyAddr = data.contactAddr;
        s.payName = data.company;
        s.bank = data.bankEn;
        s.payAccount = data.bankAccount;
        s.certStatus = 'pending';
        s.contractStatus = '';
      }
      showToast('已重新提交，等待审核', 'ok');
    }
    closeModal('subjectModal');
    renderSubjectCard();
  }

  // 认证详情：展示提交的所有认证信息
  function subjectDetail(id) {
    var s = SUBJECTS.find(function (x) { return x.id === id; });
    if (!s) return;
    var html = '<div class="sub-title" style="margin-top:0">认证信息</div>' +
      '<div class="field-grid">' +
        '<div class="field-row"><div class="field-label-cell">公司名称</div><div class="field-value-cell">' + esc(s.company) + '</div></div>' +
        '<div class="field-row"><div class="field-label-cell">联系地址</div><div class="field-value-cell">' + esc(s.contactAddr) + '</div></div>' +
        '<div class="field-row"><div class="field-label-cell">联系人</div><div class="field-value-cell">' + esc(s.contact) + '</div></div>' +
        '<div class="field-row"><div class="field-label-cell">联系电话</div><div class="field-value-cell">' + esc(s.contactPhone) + '</div></div>' +
        '<div class="field-row"><div class="field-label-cell">联系邮箱</div><div class="field-value-cell">' + esc(s.contactEmail) + '</div></div>' +
      '</div>' +
      '<div class="sub-title">银行信息</div>' +
      '<div class="field-grid">' +
        '<div class="field-row"><div class="field-label-cell">开户名称</div><div class="field-value-cell">' + esc(s.bankName) + '</div></div>' +
        '<div class="field-row"><div class="field-label-cell">开户账号</div><div class="field-value-cell">' + esc(s.bankAccount) + '</div></div>' +
        '<div class="field-row"><div class="field-label-cell">开户银行</div><div class="field-value-cell">' + esc(s.bankEn) + '</div></div>' +
        '<div class="field-row"><div class="field-label-cell">公司地址</div><div class="field-value-cell">' + esc(s.companyAddrEn) + '</div></div>' +
        '<div class="field-row"><div class="field-label-cell">银行地址</div><div class="field-value-cell">' + esc(s.bankAddrEn) + '</div></div>' +
        '<div class="field-row"><div class="field-label-cell">银行Swift代码</div><div class="field-value-cell">' + esc(s.swift) + '</div></div>' +
        '<div class="field-row"><div class="field-label-cell">商务</div><div class="field-value-cell">' + esc(s.business) + '</div></div>' +
      '</div>';
    if (s.certStatus === 'rejected') {
      html += '<div class="notice notice-warn" style="margin:14px 0 0"><svg viewBox="0 0 20 20" fill="none"><path d="M10 3 2.5 16h15L10 3Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M10 8v3.5M10 14v.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg><div>认证信息有误，请重新提交</div></div>';
    }
    document.getElementById('modDetailTitle').textContent = '主体信息';
    document.getElementById('modDetailBody').innerHTML = html;
    openModal('modDetailModal');
  }

  // 审核驳回 / 合同信息重填：查看原因
  function subjectRejectReason(id, type) {
    var s = SUBJECTS.find(function (x) { return x.id === id; });
    if (!s) return;
    var reason = type === 'contract' ? '合同信息有误，请核对后重新提交' : '认证信息有误，请重新提交';
    document.getElementById('modDetailTitle').textContent = '驳回原因';
    document.getElementById('modDetailBody').innerHTML = '<div class="notice notice-warn" style="margin:0"><svg viewBox="0 0 20 20" fill="none"><path d="M10 3 2.5 16h15L10 3Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M10 8v3.5M10 14v.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg><div>' + reason + '</div></div>';
    openModal('modDetailModal');
  }

  // 审核驳回 → 重新提交（打开编辑弹窗，支持修改）
  function subjectResubmit(id) {
    var s = SUBJECTS.find(function (x) { return x.id === id; });
    if (!s) return;
    openSubjectModal(s);
  }

  // 合同信息填写：仅乙方信息（读取自认证信息，不支持修改，不展示模块标题）
  var curFillId = null;
  function subjectFillContract(id) {
    curFillId = id;
    var s = SUBJECTS.find(function (x) { return x.id === id; });
    if (!s) return;
    var fields = [
      { key: 'company', label: '乙方公司全称' },
      { key: 'contactAddr', label: '联系地址' },
      { key: 'contact', label: '联系人' },
      { key: 'contactPhone', label: '联系电话' },
      { key: 'contactEmail', label: '联系邮箱' },
      { key: 'bankName', label: '开户名称' },
      { key: 'bankAccount', label: '开户账号' },
      { key: 'bankEn', label: '开户行' }
    ];
    var html = '<div style="font-size:12px;color:var(--text-3);margin:0 0 14px">以下信息同步自认证信息，不支持修改</div>';
    fields.forEach(function (f) {
      html += '<div class="form-item">' +
        '<label class="form-label">' + f.label + '</label>' +
        '<input class="form-input fill-field" data-key="' + f.key + '" value="' + esc(s[f.key] || '') + '" disabled>' +
        '</div>';
    });
    document.getElementById('subjectFillBody').innerHTML = html;
    openModal('subjectFillModal');
  }
  function submitSubjectFill() {
    var s = SUBJECTS.find(function (x) { return x.id === curFillId; });
    if (s) {
      var fields = document.querySelectorAll('#subjectFillBody .fill-field');
      fields.forEach(function (el) {
        var key = el.getAttribute('data-key');
        if (key && s[key] !== undefined) s[key] = el.value.trim() || s[key];
      });
      s.contractStatus = 'generating';
    }
    closeModal('subjectFillModal');
    renderSubjectCard();
    showToast('合同信息已提交', 'ok');
  }

  // 合同信息查看：仅展示乙方信息（不展示模块标题）
  function subjectViewContract(id) {
    var s = SUBJECTS.find(function (x) { return x.id === id; });
    if (!s) return;
    var html = '<div class="field-grid">' +
        '<div class="field-row"><div class="field-label-cell">乙方公司全称</div><div class="field-value-cell">' + esc(s.company) + '</div></div>' +
        '<div class="field-row"><div class="field-label-cell">联系地址</div><div class="field-value-cell">' + esc(s.contactAddr) + '</div></div>' +
        '<div class="field-row"><div class="field-label-cell">联系人</div><div class="field-value-cell">' + esc(s.contact) + '</div></div>' +
        '<div class="field-row"><div class="field-label-cell">联系电话</div><div class="field-value-cell">' + esc(s.contactPhone) + '</div></div>' +
        '<div class="field-row"><div class="field-label-cell">联系邮箱</div><div class="field-value-cell">' + esc(s.contactEmail) + '</div></div>' +
        '<div class="field-row"><div class="field-label-cell">开户名称</div><div class="field-value-cell">' + esc(s.bankName) + '</div></div>' +
        '<div class="field-row"><div class="field-label-cell">开户账号</div><div class="field-value-cell">' + esc(s.bankAccount) + '</div></div>' +
        '<div class="field-row"><div class="field-label-cell">开户行</div><div class="field-value-cell">' + esc(s.bankEn) + '</div></div>' +
      '</div>';
    document.getElementById('modDetailTitle').textContent = '合同信息';
    document.getElementById('modDetailBody').innerHTML = html;
    openModal('modDetailModal');
  }

  // 合同模板预览（demo：展示模板正文占位）
  function subjectPreviewContract() {
    document.getElementById('modDetailTitle').textContent = '合同模板预览';
    document.getElementById('modDetailBody').innerHTML =
      '<div class="sub-title" style="margin-top:0">授权入驻合同 · 模板预览</div>' +
      '<div style="font-size:13px;color:var(--text-2);line-height:2">' +
        '甲方：版权开放平台<br>乙方：{生产方}<br><br>' +
        '一、合作内容……<br>二、授权范围……<br>三、收益分配……<br>四、税费与结算……<br>五、保密条款……<br>六、违约责任……<br>（以下为合同模板演示占位，真实条款以法务定稿为准）' +
      '</div>';
    openModal('modDetailModal');
  }

  // 签署完成（demo：弹窗「我已签署」→ 已签署）
  var curSignId = null;
  function subjectSign(id) {
    curSignId = id;
    openModal('signModal');
  }
  function confirmSign() {
    var s = SUBJECTS.find(function (x) { return x.id === curSignId; });
    if (s) { s.contractStatus = 'done'; }
    closeModal('signModal');
    renderSubjectCard();
    showToast('合同已签署', 'ok');
  }

  // 合同下载（demo）
  function subjectDownload() {
    showToast('合同已开始下载（演示）', 'ok');
  }

  function savePwd() { closeModal('pwdModal'); showToast(t('密码修改成功'), 'ok'); }

  renderBasicCard();
  renderContactCard();
  renderSubjectCard();
  applyI18n();
</script>
</body>
</html>
